  // ============ Guided tutorial — a coached first duel (Basics, 2p vs a gentle AI) ============
  var TUT = (function(){
    var active=false, i=0, steps=[], spots=[], prepped=false;
    function panel(){ return $('tutPanel'); }
    function clearSpots(){ spots.forEach(function(el){ if(el&&el.classList){ el.classList.remove('tut-spot'); if(el._tutPos){ el.style.position=''; el._tutPos=false; } } }); spots=[]; }
    function applySpot(sel){
      clearSpots(); if(!sel) return;
      var arr=Array.isArray(sel)?sel:[sel];
      arr.forEach(function(s){
        if(!s) return;
        var els=(typeof s==='string')?document.querySelectorAll(s):[s];
        Array.prototype.forEach.call(els, function(el){ if(el&&el.classList){ el.classList.add('tut-spot'); if(getComputedStyle(el).position==='static'){ el.style.position='relative'; el._tutPos=true; } spots.push(el); } });   // give static targets a stacking context without clobbering already-positioned ones (e.g. the Forms zone)
      });
    }
    function dots(){ var h=''; for(var k=0;k<steps.length;k++) h+='<i class="'+(k===i?'on':'')+'"></i>'; return h; }
    function show(){
      var p=panel(); if(!p) return;
      var st=steps[i]; if(!st){ finish(); return; }
      var isRead=!st.gate;
      var right=isRead ? ('<button class="tutNext" id="tutNextBtn">'+(st.btn||'Next ▸')+'</button>')
                       : ('<span class="tutWait">'+(st.wait||'Your move…')+'</span>');
      p.innerHTML='<div class="tutHead"><span class="tutStep"><span class="tutGrip">⠿</span>Tutorial · '+(i+1)+' / '+steps.length+'<span class="tutMove">· drag to move</span></span>'+
        '<button class="tutSkip" id="tutSkipBtn">Skip ✕</button></div>'+
        '<div class="tutText">'+st.text+'</div>'+
        '<div class="tutFoot"><span class="tutDots">'+dots()+'</span>'+right+'</div>';
      p.classList.add('show');
      // Steps with `stage:true` (read the description box, then act) park the coach up in the play area so the box is visible.
      if(st.stage){ p.style.left=''; p.style.top=''; p.style.right=''; p.style.bottom=''; p.style.transform=''; p.classList.add('atStage'); }
      else p.classList.remove('atStage');
      $('tutSkipBtn').onclick=skip;
      var nb=$('tutNextBtn'); if(nb) nb.onclick=next;
      prepped=false;
      setTimeout(function tryPrep(){                                   // action steps: wait until it's your turn before rigging/spotlighting
        if(!active || steps[i]!==st) return;
        if(st.gate && (state.turn!==YOU || busy)){ setTimeout(tryPrep, 130); return; }
        if(st.prep && !prepped){ prepped=true; try{ st.prep(); }catch(e){} }
        spotNow();
      }, 40);
      // Re-evaluate the board for the new step: moving from a READ step (board locked) to a GATED
      // action step must re-enable the buttons. Steps with a prep re-render on their own, but a
      // gate-only step (e.g. "press Pass") wouldn't — so always repaint here.
      try{ if(typeof render==='function') render(); }catch(e){}
    }
    function spotNow(){ var st=steps[i]; if(!st) return; var hi=(typeof st.hi==='function')?st.hi():st.hi; applySpot(hi); }
    function reapply(){ if(active) spotNow(); }        // render() rebuilds the hand DOM and wipes .tut-spot — re-add it each paint
    function next(){ clearSpots(); i++; if(i>=steps.length){ finish(); return; } show(); }
    function note(type, data){ if(!active) return; var st=steps[i]; if(!st||!st.gate) return; try{ if(st.gate(type, data)) next(); }catch(e){} }
    function start(list){ steps=list||[]; i=0; active=true; var p=panel(); if(p){ p.style.left=''; p.style.top=''; p.style.transform=''; p.style.bottom=''; p.style.right=''; } show(); }
    function stop(){ active=false; tutorialMode=false; clearSpots(); var p=panel(); if(p) p.classList.remove('show'); }
    function skip(){ stop(); setMessage('Tutorial dismissed — play on! You can restart it from New Duel.'); }
    function finish(){
      stop();
      var lsn=currentLesson;
      if(lsn){ setLessonDone(lsn.id); if(lsn.id==='howto') setTutDone(true); }
      else setTutDone(true);
      var more = lsn && nextLesson(lsn);
      setMessage('🎓 Lesson complete'+(lsn?' — <b>'+lsn.title+'</b>':'')+'!');
      // Actionable hand-off: a Tutorials button right here so moving to the next lesson is one tap.
      showModal('<h2>🎓 Lesson complete'+(lsn?' — '+lsn.title:'')+'</h2>'+
        '<p>'+(more?'Nice! Next up: <b>'+more.title+'</b>.':'You’ve finished the Basics — you know the core loop!')+' You can also play this duel out for practice.</p>'+
        '<div class="respOpts"><button id="lsnMore" class="respQuick" style="text-align:center;">🎓 '+(more?'Next: '+more.title:'Open Tutorials')+'</button>'+
        '<button id="lsnHub" class="respLet">All tutorials</button>'+
        '<button id="lsnPlay" class="respLet">Keep playing this duel</button></div>');
      var mm=more;
      if($('lsnMore')) $('lsnMore').addEventListener('click', function(){ if(mm) startLesson(mm); else openTutorials(); });
      if($('lsnHub')) $('lsnHub').addEventListener('click', openTutorials);
      if($('lsnPlay')) $('lsnPlay').addEventListener('click', hideOverlay);
      overlayDismiss=hideOverlay;
      currentLesson=null;
    }
    function needSpecial(){ return active && steps[i] && !!steps[i].requireSpecial; }
    function blocking(){ return active && !!steps[i] && !steps[i].gate; }   // a READ step (no action gate): hold the board until they press the button, so they can't play ahead of the lesson
    return { start:start, note:note, stop:stop, skip:skip, reapply:reapply, needSpecial:needSpecial, blocking:blocking, isActive:function(){return active;} };
  })();

  // Rig a controlled opening so each lesson reliably works: a couple of strong jabs, a pair, a cheap effect
  // (A♣ Prepare for Combat), a comfortable energy pile, and a weak Rival hand so YOU win round 1 and lead round 2.
  function tutPull(list, rank, suit){ for(var k=0;k<list.length;k++){ if(list[k].rank===rank && (suit==null||list[k].suit===suit)) return list.splice(k,1)[0]; } return null; }
  function tutPullDeck(pl, suit, rank){ for(var k=0;k<pl.deck.length;k++){ var c=pl.deck[k]; if((suit==null||c.suit===suit)&&(rank==null||c.rank===rank)) return pl.deck.splice(k,1)[0]; } return null; }
  function tutRig(st){
    var me=st.players[0], foe=st.players[1];
    var pool=me.hand.concat(me.deck);
    var hand=[];
    function add(c){ if(c) hand.push(c); }
    add(tutPull(pool,9,'S'));                                   // strong jab
    add(tutPull(pool,7,'D'));                                   // another jab
    var p1=tutPull(pool,5) ; if(p1){ add(p1); add(tutPull(pool,5)); }   // a rank-5 pair (two suits)
    add(tutPull(pool,1,'C'));                                   // A♣ = Prepare for Combat (draw 2), cost 1 — the effect lesson
    add(tutPull(pool,8,'H')||tutPull(pool,6));                  // filler
    while(hand.length < E.START_HAND && pool.length) hand.push(pool.shift());
    me.hand=hand; me.deck=pool;
    me.energy=[];
    ['C','C','D','H','S','C'].forEach(function(su){ var c=tutPullDeck(me, su); if(c) me.energy.push(c); });   // comfy pile incl. clubs (for the cost-1 club effect)
    // weak Rival: hand from rank 3–4 only, so your opening jab wins and you keep the lead
    var fpool=foe.hand.concat(foe.deck), lows=[], rest=[];
    fpool.forEach(function(c){ (c.rank>=3&&c.rank<=4?lows:rest).push(c); });
    foe.hand=lows.slice(0,E.START_HAND); foe.deck=lows.slice(E.START_HAND).concat(rest);
    st.turn=st.initiative=0;
  }
  function tutHasPair(hand){ var seen={}; for(var i=0;i<hand.length;i++){ if(seen[hand[i].rank]) return true; seen[hand[i].rank]=true; } return false; }
  function tutEnsurePair(){
    var me=state.players[YOU]; if(tutHasPair(me.hand)) return;
    var all=me.hand.concat(me.deck), byRank={};
    all.forEach(function(c){ (byRank[c.rank]=byRank[c.rank]||[]).push(c); });
    var pr=null; for(var r in byRank){ if(byRank[r].length>=2){ pr=r; break; } }
    if(pr==null) return;
    [byRank[pr][0], byRank[pr][1]].forEach(function(c){ if(me.hand.indexOf(c)<0){ me.deck=me.deck.filter(function(x){return x!==c;}); me.hand.push(c); } });
    syncOrder(false); render();
  }
  var tutEffId=null;
  // Only simple, no-target effects (so activating won't open a target/counter picker mid-lesson).
  function tutEffOK(e){ return !!(e && e.impl && ['draw','ramp','valueBoost','reclaim','shield','gainShield'].indexOf(e.kind)>=0); }
  var TUT_EFF_ORDER=['draw','ramp','valueBoost','reclaim','shield','gainShield'];   // prefer a draw effect so the "use its effect" lesson is the clearest kind
  function tutPickEffect(me){
    var inHand=null, ihr=99;                                        // prefer an already-affordable, high-priority effect in hand
    for(var i=0;i<me.hand.length;i++){ var c=me.hand[i], e=E.effectOf(c); if(tutEffOK(e) && E.canAfford(me,c,0)){ var r=TUT_EFF_ORDER.indexOf(e.kind); if(r<ihr){ ihr=r; inHand=c; } } }
    if(inHand) return inHand;
    var best=null, br=99, bc=99;                                    // else best-priority, cheapest safe effect anywhere in your cards
    me.hand.concat(me.deck).forEach(function(c){ var e=E.effectOf(c); if(!tutEffOK(e)) return; var r=TUT_EFF_ORDER.indexOf(e.kind), cost=E.activationCost(c); if(r<br || (r===br && cost<bc)){ best=c; br=r; bc=cost; } });

  }
  function tutEnsureEffect(){
    var me=state.players[YOU];
    var c=tutPickEffect(me);

  }

  // Initiative rig: the RIVAL leads round 1 with higher cards than you hold, so passing is the honest play.

    foe.hand=hiFoe.slice(0,E.START_HAND); while(foe.hand.length<E.START_HAND && restFoe.length) foe.hand.push(restFoe.shift());

  }

  // Quicks lesson (Full mode): an interactive Counter Spell demo — the Rival casts a Technique, you cancel it.
  var tutQuickId=null, tutAwaitCounter=false;
  function tutRigQuicks(st){
    var me=st.players[0], foe=st.players[1];
    // YOU: guarantee a Counter Spell (4♦) in hand + energy to afford it (needs ≥2♦ of 4 total).
    var pool=me.hand.concat(me.deck), hand=[];
    var cs=tutPull(pool,4,'D'); if(cs) hand.push(cs);   // 4♦ = Counter Spell
    while(hand.length<E.START_HAND && pool.length) hand.push(pool.shift());
    me.hand=hand; me.deck=pool;
    me.energy=[]; ['D','D','C','H','S'].forEach(function(su){ var c=tutPullDeck(me,su); if(c) me.energy.push(c); });   // 2♦ + 3 any → affords Counter Spell (cost 4)
    // RIVAL: hold a couple of cheap counterable Techniques + energy so tutCastRivalTech always has one to fire.
    var fpool=foe.hand.concat(foe.deck), fhand=[];
    function isTech(c){ var e=E.effectOf(c); return e && e.impl && !e.quick && e.type && /Technique/.test(e.type) && ['draw','ramp','valueBoost','reclaim'].indexOf(e.kind)>=0; }
    for(var t=0;t<fpool.length && fhand.length<3;t++){ if(isTech(fpool[t])){ fhand.push(fpool[t]); } }
    fhand.forEach(function(c){ var i=fpool.indexOf(c); if(i>=0) fpool.splice(i,1); });
    while(fhand.length<E.START_HAND && fpool.length) fhand.push(fpool.shift());
    foe.hand=fhand; foe.deck=fpool;
    foe.energy=[]; for(var e=0;e<12;e++) foe.energy.push({rank:4,suit:'CDHS'[e%4],id:'tqE'+e});   // plenty for any Technique
    st.turn=st.initiative=0;   // your turn; nothing auto-fires — the lesson triggers the cast on cue
  }
  function tutPrepQuick(){

    var q=me.hand.filter(isCounter)[0];

  // The "show": make the Rival cast a Technique now, opening YOUR Respond? window with Counter Spell offered.
  function tutCastRivalTech(){
    var foe=state.players[RIVAL];
    function isTech(c){ var e=E.effectOf(c); return e && e.impl && !e.quick && e.type && /Technique/.test(e.type) && ['draw','ramp','valueBoost','reclaim'].indexOf(e.kind)>=0; }
    var tech=foe.hand.filter(isTech)[0];
    if(!tech){ for(var k=0;k<foe.deck.length;k++){ if(isTech(foe.deck[k])){ tech=foe.deck.splice(k,1)[0]; foe.hand.push(tech); break; } } }
    if(!tech) return;
    var g=gen, name=(E.effectOf(tech)||{}).name||'a Technique';
    var savedTurn=state.turn; state.turn=RIVAL;
    var r=E.activate(state, RIVAL, tech.id);
    if(!r || r.ok===false){ state.turn=savedTurn; render(); return; }
    flashArt(tech, 'Rival');
    logMsg('<b>Rival</b> casts <b>'+name+'</b>.', 'rival');
    render();
    if(state.pending && state.respondFor===YOU){
      tutAwaitCounter=true;
      setMessage('The Rival cast <b>'+name+'</b> — spring <b>Counter Spell</b>!');
      promptHumanResponse(g, function(){ if(gen===g){ state.turn=YOU; render(); } });   // after resolve, hand the turn back
    } else { state.turn=savedTurn; render(); }
  }

  function tutOpenDeckBuilder(force){

      // While the lesson runs, always come back: on a cancel it would otherwise strand the step, and after a
      // save the reopened builder re-renders "Your saved decks" so the final step can point at the real deck

      if(TUT.isActive()) setTimeout(function(){ tutOpenDeckBuilder(true); }, 120);
    });

  // Settings modal — opt-in display prefs (persisted). Sound mirrors the header 🔊; language is a future placeholder.
  /* The rules panel. ONE panel, three entry points, one rule about editability:
   *   · setup dialog      — editable (no game running)
   *   · netplay lobby     — editable for the HOST; a client sees it read-only before Ready
   *   · ⚙️ Settings        — READ-ONLY while a game is live, editable when idle
   * That last one is the whole reason it is reachable from Settings at all (Aj: "if something weird happens, i
   * can check why my game is not behaving in the ruleset i'm expecting") — while still making a mid-duel edit
   * impossible, which would be either silently ignored or incoherent. */
  var rulesPanelOpen=null;   // opts of the live ⚗️ panel, so an incoming suggestion can repaint it in place
  function refreshRulesPanel(){ if(rulesPanelOpen) showRules(rulesPanelOpen); }
  function showRules(opts){
    opts=opts||{};
    rulesPanelOpen=opts;
    var ro=!!opts.readonly, back=opts.back||hideOverlay;
    /* THREE MODES, not two. `edit` (solo, setup, the host's lobby) writes the rules. `suggest` (a client in a
     * lobby) writes THIS DEVICE's picks and sends them to the host as a suggestion — the controls always edit
     * your own opinion, and when you are the one setting the rules your opinion IS the rule. `readonly`
     * (mid-game) writes nothing. */
    var sug=!!opts.suggest && !ro, src=sug?MY_RULES:RULES;
    var votes=(sug||isHostSeat()) ? netSuggestions() : null;
    function scopeTag(d){ return '<span class="ruleScope">'+(d.duel?'all player counts':'3–6 players')+'</span>'; }
    function rowHTML(d){
      /* A MODE row is a <div> with a segmented control, not a <button> — nesting buttons inside a button is
       * invalid, and the alternatives are mutually exclusive rather than independently checkable, which is the
       * whole point of the mode (see RULE_DEFS). It still carries data-rule so the suites enumerate it. */
      /* In suggest mode the row shows what is IN PLAY when it differs from your pick, so an editable control
       * can never be mistaken for the rules of the game — the one real misreading risk in this whole feature. */
      var liveTag = (sug && src[d.key]!==RULES[d.key])
        ? '<span class="ruleLive">in play: '+esc(valLabel(d,RULES[d.key]))+'</span>' : '';
      var voteTag = voteHTML(d,votes);
      if(d.mode){
        var segs=d.mode.map(function(m){
          return '<button type="button" class="segBtn'+(src[d.key]===m.v?' active':'')+'"'+(ro?' disabled':'')+
                 ' data-mode-for="'+d.key+'" data-mode-v="'+m.v+'" role="radio" aria-checked="'+
                 (src[d.key]===m.v?'true':'false')+'">'+m.label+'</button>';
        }).join('');
        return '<div class="settingRow modeSetting'+(ruleOnIn(src,d)?' on':'')+(ro?' ro':'')+'" data-rule="'+d.key+'" data-mode="1">'+
          '<span class="settingBody"><span class="settingLbl">'+d.label+scopeTag(d)+'</span>'+
          '<span class="settingNote">'+d.note+'</span>'+liveTag+voteTag+'</span>'+
          '<span class="segToggle" role="radiogroup" aria-label="'+d.label+'">'+segs+'</span></div>';
      }
      var on=!!src[d.key];
      return '<button type="button" class="settingRow'+(on?' on':'')+(ro?' ro':'')+'" data-rule="'+d.key+'"'+
        (ro?' disabled':'')+' role="switch" aria-checked="'+(on?'true':'false')+'">'+
        '<span class="settingBox">'+(on?'✓':'')+'</span>'+
        '<span class="settingBody"><span class="settingLbl">'+d.label+scopeTag(d)+'</span>'+
        '<span class="settingNote">'+d.note+'</span>'+liveTag+voteTag+'</span></button>';
    }
    showModal('<h2>⚗️ '+(sug?'Rules &amp; suggestions':'Custom rules')+'</h2>'+
      /* NO ROW COUNTING. This sentence said "the first four … the last three", then four, then five — it went
       * stale every time a rule was added, and twice shipped wrong. Every row already carries its own scope
       * tag, which is asserted, so point at those instead of restating them positionally. */
      '<p class="ruleIntro">Mostly not the default or intended way to play — but certainly <i>a</i> way to play. '+
        '<b>Each rule says whether it changes a duel or only 3–6 player games.</b></p>'+
      (sug ? '<div class="netmsg">The <b>host</b> sets the rules for the table. What you pick here is a '+
             '<b>suggestion</b> — everyone can see it, including the host, who decides.</div>' : '')+
      (ro ? '<div class="netmsg">'+(opts.why||'These are the rules this game is using. Rules are chosen before a game starts.')+'</div>' : '')+
      '<div class="ruleBulk">'+
        RULE_PRESETS.map(function(p){
          return '<button type="button" class="bulkBtn'+(presetActive(p,src)?' active':'')+'" data-preset="'+p.key+
                 '" title="'+esc(p.title)+'"'+(ro?' disabled':'')+'>'+esc(p.label)+'</button>';
        }).join('')+
        '<button type="button" class="bulkBtn clear" id="ruleClear"'+
          ((ro||!RULE_DEFS.some(function(d){ return ruleOnIn(src,d); }))?' disabled':'')+
          '>Clear all</button></div>'+
      '<div class="settings">'+RULE_DEFS.map(rowHTML).join('')+'</div>'+
      /* Deliberately unspecific (Aj: "no need to say which ones haha"). Naming the decks and their win rates is
       * developer detail, and it pre-judges a deck for the player. The measured figures live in the changelog
       * and PATCHNOTES, where they are actually useful. */
      '<p class="ruleWarn">⚠ The Rival is tuned for the default rules and will not adapt — and some decks are '+
        'much better suited to these rules than others.</p>'+
      '<button id="ruleDone">Done</button>');
    /* THE BULK ROW IS DERIVED STATE, so any single change has to refresh it — otherwise a preset button stays
     * lit after you toggle one more rule, which is a lie about what is in play, and Clear all stays greyed out
     * after the first rule goes on. The rows patch themselves in place, so this is the one shared touch-up. */
    function syncBulk(){
      Array.prototype.forEach.call(document.querySelectorAll('.bulkBtn[data-preset]'), function(b){
        var p=RULE_PRESETS.filter(function(x){ return x.key===b.getAttribute('data-preset'); })[0];
        b.classList.toggle('active', !!p && presetActive(p,src));
      });
      var c=$('ruleClear'); if(c) c.disabled = !RULE_DEFS.some(function(d){ return ruleOnIn(src,d); });
    }
    /* THE IN-PLAY CHIP IS DERIVED STATE TOO, and the rows patch themselves in place — so without this a
     * suggestion you have just made shows no "in play" line until the host's echo re-renders the panel, and
     * shows none at all if you are not connected. Same bug as the bulk row, one row lower. */
    function syncLive(){
      if(!sug) return;
      RULE_DEFS.forEach(function(d){
        var row=document.querySelector('.settingRow[data-rule="'+d.key+'"]'); if(!row) return;
        var body=row.querySelector('.settingBody'); if(!body) return;
        var el=body.querySelector('.ruleLive'), differs=(src[d.key]!==RULES[d.key]);
        if(differs){
          if(!el){ el=document.createElement('span'); el.className='ruleLive';
                   body.insertBefore(el, body.querySelector('.ruleVotes')); }
          el.textContent='in play: '+valLabel(d,RULES[d.key]);
        } else if(el && el.parentNode) el.parentNode.removeChild(el);
      });
    }
    /* ONE commit path. In suggest mode nothing is applied to the engine — the rules in play are the host's —
     * it is saved as this device's preference and sent up the wire. Otherwise your picks are the rules. */
    function commit(){
      if(sug){ saveRules(); netSendSuggest(); }
      else { applyRules(); ownRules(); }
    }
    if(!ro) Array.prototype.forEach.call(document.querySelectorAll('.segBtn[data-mode-for]'), function(seg){
      seg.addEventListener('click', function(){
        var k=this.getAttribute('data-mode-for'), v=this.getAttribute('data-mode-v');
        src[k]=v; commit();
        var row=this.closest('.settingRow');
        Array.prototype.forEach.call(row.querySelectorAll('.segBtn[data-mode-for="'+k+'"]'), function(o){
          var act=o.getAttribute('data-mode-v')===v;
          o.classList.toggle('active', act); o.setAttribute('aria-checked', act?'true':'false');
        });
        row.classList.toggle('on', ruleOnIn(src, RULE_DEFS.filter(function(d){ return d.key===k; })[0]));
        syncBulk(); syncLive();
        if(opts.onChange) opts.onChange();
      });
    });
    if(!ro) Array.prototype.forEach.call(document.querySelectorAll('button.settingRow[data-rule]'), function(btn){
      btn.addEventListener('click', function(){
        var k=this.getAttribute('data-rule');
        src[k]=!src[k]; commit();
        this.classList.toggle('on', !!src[k]);
        this.setAttribute('aria-checked', src[k]?'true':'false');
        this.querySelector('.settingBox').textContent=src[k]?'✓':'';
        syncBulk(); syncLive();
        if(opts.onChange) opts.onChange();
      });
    });
    /* A bulk action moves every row, so re-open the panel instead of patching nine rows in place — the
     * per-row handlers above only know how to update themselves. opts is passed through unchanged, so the
     * read-only flag and the Back target survive. */
    if(!ro){
      Array.prototype.forEach.call(document.querySelectorAll('.bulkBtn[data-preset]'), function(btn){
        btn.addEventListener('click', function(){
          var k=this.getAttribute('data-preset');
          var p=RULE_PRESETS.filter(function(x){ return x.key===k; })[0];
          if(!p) return;
          applyPreset(p,src); commit();
          if(opts.onChange) opts.onChange();
          showRules(opts);
        });
      });
      var clr=$('ruleClear');
      if(clr) clr.addEventListener('click', function(){
        if(!RULE_DEFS.some(function(d){ return ruleOnIn(src,d); })) return;
        clearAllRules(src); commit();
        if(opts.onChange) opts.onChange();
        showRules(opts);
      });
    }
    function closePanel(){ rulesPanelOpen=null; back(); }
    $('ruleDone').addEventListener('click', closePanel);
    overlayDismiss=closePanel;
  }
  function showSettings(){

  /* ---- Energy / Shuffle pile viewers -------------------------------------------------------------
   * Two views, one modal, ← / → between them (ENERGY-REORDER-DESIGN.md, decision 2).
   *  · ENERGY is ORDERED and orderable: position 1 is spent next, and tapping a card offers 🔍 View
   *    (the full description-box text) and ⤒ Promote to top.
   *  · SHUFFLE is read-only — what is queued to come back when your deck runs dry.
   * The "first ♥ / first ♦ …" tags are decision 3's labelling: a colored pip takes the EARLIEST card of
   * that suit, so a promoted card of another suit gets skipped. Tagging the first of each suit makes that
   * visible instead of mysterious.
   */
  var pileWhich='energy', pileSel=null, pileRead=null, pileSeat=0;   // pileSeat: whose pile we are looking at (0 = you)
  function pileCanReorder(){
    if(pileSeat!==YOU) return false;                                  // another player's pile is VIEW ONLY
    return !!(state && !state.finished && state.turn===YOU && !state.pending && state.respondFor==null && !busy && !TUT.blocking());
  }
  function pileCards(which){
    var pl=state && state.players[pileSeat]; if(!pl) return [];
    var a=(which==='shuffle' ? pl.shuffle : pl.energy) || [];
    return a.filter(function(c){ return !c.hidden; });                // a redacted zone (shuffle/deck dummies) shows as empty, not as fake cards
  }
  function firstOfSuitIds(cards){                       // which card a colored pip of each suit would claim
    var seen={}, out={};
    cards.forEach(function(c){ if(!seen[c.suit]){ seen[c.suit]=1; out[c.id]=c.suit; } });
    return out;
  }
  function openPileView(which, seat){
    pileWhich=(which==='shuffle')?'shuffle':'energy'; pileSel=null; pileRead=null;
    pileSeat=(typeof seat==='number')?seat:YOU;
    renderPileView();
  }
  function renderPileView(){
    var isNrg=(pileWhich!=='shuffle'), cards=pileCards(pileWhich), canOrder=isNrg && pileCanReorder();
    var mine=(pileSeat===YOU), owner=mine?'':(seatName(pileSeat)+'’s ');   // declare BEFORE the hint reads it
    var firsts=isNrg?firstOfSuitIds(cards):{};
    var rows='';
    cards.forEach(function(c,i){
      var eff=E.effectOf(c), nm=eff?eff.name:'—', tags='';
      if(isNrg && i===0) tags+='<span class="pvTag next">spent next</span>';
      if(isNrg && firsts[c.id]) tags+='<span class="pvTag pip">first '+SUIT_SYMBOL[firsts[c.id]]+'</span>';
      rows+='<div class="pileRow'+(canOrder?'':' ro')+(pileSel===c.id?' sel':'')+'" data-id="'+esc(c.id)+'">'+
        '<span class="pvPos">'+(i+1)+'</span>'+
        '<span class="pvMini"></span>'+
        '<span class="pvName">'+rankLabel(c.rank)+SUIT_SYMBOL[c.suit]+(nm!=='—'?(' · '+esc(nm)):'')+'</span>'+
        '<span class="pvTags">'+tags+'</span></div>';
    });
    var hint = !mine
      ? (isNrg
          ? 'Energy piles are <b>open information</b> — the same as cards face-up on a table. This is <b>view only</b>: position <b>1</b> is what '+seatName(pileSeat)+' spends next.'
          : 'What '+seatName(pileSeat)+' has already spent. It is <b>shuffled at random</b> back into their deck when it runs dry.')
      : (isNrg
        ? (canOrder
            ? 'Position <b>1</b> is spent next. Tap a card to read it or <b>promote it to the top</b> — a promoted card becomes the next one spent, so it recycles into your ♻ pile sooner. A <b>coloured cost</b> takes the <b>first card of that suit</b> (tagged), so it can skip past a promotion.'
            : 'Position <b>1</b> is spent next. You can reorder this on <b>your own turn</b>.')
        : 'Cards you have already spent. When your 🂠 deck runs dry, this pile is <b>shuffled at random</b> back into it — the order here does not matter, only what is in it.');
    var body='<h2>'+(isNrg?('⚡ '+owner+'Energy pile'):('♻ '+owner+'Shuffle pile'))+'</h2>'+
      '<div class="pileHead">'+
        '<button type="button" class="pvNav" id="pvPrev" title="'+(isNrg?'Shuffle pile':'Energy pile')+'">←</button>'+
        '<span class="pvTitle">'+(isNrg?'Spent next, first':'Waiting to be reshuffled')+'</span>'+
        '<span class="pvCount">'+cards.length+' card'+(cards.length===1?'':'s')+'</span>'+
        '<button type="button" class="pvNav" id="pvNext" title="'+(isNrg?'Shuffle pile':'Energy pile')+'">→</button>'+
      '</div>'+
      '<p class="pileHint">'+hint+'</p>'+
      (cards.length?('<div class="pileList" id="pileList">'+rows+'</div>'):'<div class="pileEmpty">This pile is empty.</div>');
    if(pileRead){
      var rc=cards.filter(function(c){ return c.id===pileRead; })[0];
      if(rc) body+='<div class="pvRead">'+cardTextHTML(rc)+'</div>'+
        '<div class="pileCtx pvReadBack"><button id="pvBack" class="ghostBtn">← Back to the pile</button></div>';
    } else if(pileSel){
      body+='<div class="pileCtx">'+
        '<button id="pvView" class="ghostBtn">🔍 View</button>'+
        '<button id="pvPromote"'+(canOrder?'':' disabled')+'>⤒ Promote to top</button>'+
      '</div>';
    }
    body+='<button id="pvDone">Done</button>';
    showModal(body);
    // real card thumbnails (cardEl builds DOM, so paint them after the innerHTML pass)
    Array.prototype.forEach.call(document.querySelectorAll('#pileList .pileRow'), function(row){
      var id=row.getAttribute('data-id'), c=cards.filter(function(x){ return x.id===id; })[0];
      if(c){ var mini=row.querySelector('.pvMini'); if(mini) mini.replaceWith(cardEl(c,'mini')); }
      row.addEventListener('click', function(){
        if(!isNrg || !mine) return;                         // shuffle pile, and any pile but yours, are read-only
        pileSel=(pileSel===id?null:id); pileRead=null; renderPileView();
      });
    });
    var flip=function(){ pileWhich=isNrg?'shuffle':'energy'; pileSel=null; pileRead=null; renderPileView(); };
    $('pvPrev').addEventListener('click', flip);
    $('pvNext').addEventListener('click', flip);
    if($('pvView')) $('pvView').addEventListener('click', function(){ pileRead=pileSel; renderPileView(); });
    if($('pvBack')) $('pvBack').addEventListener('click', function(){ pileRead=null; renderPileView(); });
    if($('pvPromote')) $('pvPromote').addEventListener('click', function(){ promoteFromPile(pileSel); });

  // ---- Custom deck builder ----------------------------------------------------------------------
  // Four steppers (one per class) that must total PARTS_TOTAL parts; a part is one complete 13-card
  // suit, so the deck is always 52 cards. Saving stores {name, parts} and hands the caller back the
  // composition key. Create + delete only — to change a deck, delete it and build it again.
  function openDeckBuilder(startParts, onDone){
    var parts={}; E.PARTS_SUITS.forEach(function(su){ parts[su]=(startParts&&startParts[su])||0; });
    var CLASS_NAME={D:'Wizard',H:'Cleric',C:'Fighter',S:'Rogue'};
    var done=false;
    function finish(key){ if(done) return; done=true; overlayDismiss=null; if(onDone) onDone(key||null); }

    function stepperHTML(su){
      return '<div class="dbRow" data-su="'+su+'">'+
        '<span class="dbCls"><b class="'+(su==='D'||su==='H'?'red':'')+'">'+PART_SUIT_SYM[su]+'</b> '+CLASS_NAME[su]+'</span>'+
        '<span class="dbStep">'+
          '<button type="button" class="dbBtn" data-d="-1" aria-label="One fewer '+CLASS_NAME[su]+' part">−</button>'+
          '<b class="dbN">0</b>'+
          '<button type="button" class="dbBtn" data-d="1" aria-label="One more '+CLASS_NAME[su]+' part">+</button>'+
        '</span>'+
        '<span class="dbCards"></span>'+
      '</div>';
    }
    function savedListHTML(){
      if(!savedDecks.length) return '';
      var h='<div class="dbSaved"><div class="dbSavedHd">Your saved decks</div>';
      savedDecks.forEach(function(d){
        var k=E.partsKey(d.parts);
        h+='<div class="dbSavedRow"><span class="dbSavedName">'+esc(d.name)+'</span>'+
           '<span class="dbSavedParts">'+deckPartsLabel(d.parts)+'</span>'+
           '<button type="button" class="dbDel" data-key="'+k+'" title="Delete this deck">🗑</button></div>';
      });
      return h+'</div>';
    }
    showModal('<h2>✏️ Custom deck</h2>'+
      '<div class="deckBuild">'+
        '<div class="dbHint">Pick <b>'+E.PARTS_TOTAL+' parts</b>. One part is a full 13-card suit of that class — so a deck is always 52 cards. Doubling a class gives you two of each of its cards.</div>'+
        E.PARTS_SUITS.map(stepperHTML).join('')+
        '<div class="dbTotal" id="dbTotal"></div>'+
        '<label class="dbNameRow"><span>Deck name</span><input id="dbName" type="text" maxlength="24" placeholder="e.g. Twin Cleric" autocomplete="off"></label>'+
        '<div class="dbErr" id="dbErr"></div>'+
        savedListHTML()+
      '</div>'+
      '<div class="dbBtns"><button id="dbSave">Save deck</button><button id="dbCancel" class="ghostBtn">Cancel</button></div>');

    function repaint(){
      var total=E.partsCount(parts), ok=E.partsValid(parts);
      E.PARTS_SUITS.forEach(function(su){
        var row=document.querySelector('.dbRow[data-su="'+su+'"]'); if(!row) return;
        row.querySelector('.dbN').textContent=parts[su];
        row.querySelector('.dbCards').textContent=parts[su]?(parts[su]*13+' cards'):'—';
        row.classList.toggle('zero', !parts[su]);
        row.querySelector('[data-d="-1"]').disabled = parts[su]<=0;
        row.querySelector('[data-d="1"]').disabled  = total>=E.PARTS_TOTAL;
      });
      var left=E.PARTS_TOTAL-total;
      $('dbTotal').innerHTML = ok
        ? '<b class="good">'+total+' / '+E.PARTS_TOTAL+' parts — 52 cards</b>'
        : (left>0 ? 'Parts: <b>'+total+' / '+E.PARTS_TOTAL+'</b> — add '+left+' more' : 'Parts: <b>'+total+' / '+E.PARTS_TOTAL+'</b> — remove '+(-left));
      $('dbTotal').classList.toggle('ready', ok);
      $('dbSave').disabled=!ok;
      if($('dbName')) $('dbName').placeholder = ok ? deckPartsLabel(parts) : 'e.g. Twin Cleric';
    }
    Array.prototype.forEach.call(document.querySelectorAll('.deckBuild .dbBtn'), function(b){
      b.addEventListener('click', function(){
        var su=b.parentNode.parentNode.getAttribute('data-su'), d=+b.getAttribute('data-d');
        var next=parts[su]+d;
        if(next<0 || next>E.PARTS_TOTAL) return;
        if(d>0 && E.partsCount(parts)>=E.PARTS_TOTAL) return;
        parts[su]=next; $('dbErr').textContent=''; repaint();
        TUT.note('deckparts', { parts:parts, total:E.partsCount(parts), suit:su });   // the deck lesson gates on the steppers
      });
    });
    Array.prototype.forEach.call(document.querySelectorAll('.deckBuild .dbDel'), function(b){
      b.addEventListener('click', function(){
        var k=b.getAttribute('data-key'), d=savedDeckFor(k);
        if(!d) return;
        if(!window.confirm('Delete the deck "'+d.name+'"? Anything using it falls back to the Full Set.')) return;
        removeSavedDeck(k);
        openDeckBuilder(parts, onDone);   // re-render the builder with the list updated, keeping the work in progress
      });
    });
    $('dbSave').addEventListener('click', function(){
      if(!E.partsValid(parts)) return;
      var name=($('dbName').value||'').trim();
      var clash=savedDeckFor(E.partsKey(parts));
      if(clash){
        $('dbErr').textContent='You already have that exact mix saved as "'+clash.name+'".';
        TUT.note('decksaved', { duplicate:true, name:clash.name });   // lesson: you got there; the deck simply already exists
        return;

      if(savedDecks.some(function(d){ return d.name.toLowerCase()===name.toLowerCase() && name; })){
        $('dbErr').textContent='You already have a deck called "'+name+'" — pick another name.'; return;
      }
      var key=addSavedDeck(name, parts);
      if(!key){ $('dbErr').textContent='Could not save that deck.'; return; }
      TUT.note('decksaved', { key:key, name:name });
      finish(key);
    });
    $('dbCancel').addEventListener('click', function(){ finish(null); });
    overlayDismiss=function(){ finish(null); };
    repaint();

  // Make the coach panel draggable so it never blocks the played cards.
  function initTutDrag(){
    var p=$('tutPanel'); if(!p || p._dragInit) return; p._dragInit=true;
    var on=false, sx=0, sy=0, ox=0, oy=0;
    p.addEventListener('pointerdown', function(e){
      if(e.target.closest && e.target.closest('button')) return;      // let Skip/Next clicks through
      var r=p.getBoundingClientRect();
      on=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      // Pin by top/left only — clear the CSS bottom/right so the box keeps its height instead of stretching top→bottom.
      p.classList.remove('atStage');   // a manual drag takes over from any staged auto-position
      p.style.transform='none'; p.style.left=r.left+'px'; p.style.top=r.top+'px'; p.style.bottom='auto'; p.style.right='auto';
      p.classList.add('dragging'); try{ p.setPointerCapture(e.pointerId); }catch(_){}
    });
    p.addEventListener('pointermove', function(e){
      if(!on) return;
      var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
      nx=Math.max(6, Math.min(nx, window.innerWidth - p.offsetWidth - 6));
      ny=Math.max(6, Math.min(ny, window.innerHeight - p.offsetHeight - 6));
      p.style.left=nx+'px'; p.style.top=ny+'px';
    });
    function up(){ on=false; p.classList.remove('dragging'); }
    p.addEventListener('pointerup', up); p.addEventListener('pointercancel', up);
  }

  // Free-for-all: roll a die for every player, highest leads (ties reroll among the tied).
  function rollDiceMP(){
    var reduce=reduceMotion(), els=[]; for(var i=0;i<mpCount;i++) els.push($('mpDie'+i));
    function oneRound(done){
      var rolls=[]; for(var j=0;j<mpCount;j++) rolls.push(1+Math.floor(Math.random()*6));
      if(reduce){ els.forEach(function(el,i){ if(el) el.textContent=DICE[rolls[i]-1]; }); return done(rolls); }

          setTimeout(function(){ els.forEach(function(el){ if(el) el.classList.remove('land'); }); }, 450);
          done(rolls);

      if(reduce){ yEl.textContent=DICE[fy-1]; rEl.textContent=DICE[fr-1]; done(fy,fr); return; }

  /* ================= NETPLAY (human vs human, host-authoritative) =================
   * Symmetric snapshot + intent model. The HOST owns the engine and applies EVERY seat's intents through it;
   * both ends render from their own redacted NetView.snapshotFor and submit high-level intents. Transport is
   * BroadcastChannel (same-machine two tabs today; the same schema rides a LAN/WebRTC socket in Phase 5).
   * Entirely additive and gated behind ?net= — with no flag none of this runs and the shipped game is untouched.
   * v1 scope: 2 players; pre-fight Quick timing is deferred (Quicks still work as responses to activated effects). */
  var NET = (function(){
    var transport=null, role=null, kind='bc', room=null, mySeat=0, hostState=null, deckPick='full', connected=false, lastErr='';
    var myDeck='random', oppDeck=null, oppReady=false, iReady=false;   // lobby deck-picker state (each side chooses before the host starts)
    var myId='c'+(''+Math.random()).slice(2,10)+(''+Math.random()).slice(2,6);   // this client's stable id (so the host can tell a new joiner from a 350ms retry on the shared bus)
    var hostSeatOf={}, seatDeckMap={}, nextSeat=1, MAX_SEATS=6;                   // host: cid→seat, seat→deck, next free seat
    var useStun=true, sig=null, pc=null, dc=null;   // WebRTC signaling state
    function active(){ return !!role; }
    function isHost(){ return role==='host'; }
    function seatLabel(i){ return i===mySeat ? 'You' : ('Player '+(i+1)); }

    // ---- transports (pluggable): both expose { send(obj), setOnMessage(cb), close() } ----
    function bcTransport(ch){ var cb=null; ch.onmessage=function(e){ if(cb) cb(e.data); }; return { send:function(o){ try{ ch.postMessage(o); }catch(e){} }, setOnMessage:function(c){ cb=c; }, close:function(){ try{ ch.close(); }catch(e){} } }; }
    function rtcTransport(pconn, chan){ var cb=null; chan.onmessage=function(e){ var m; try{ m=JSON.parse(e.data); }catch(_){ return; } if(cb) cb(m); }; return { send:function(o){ try{ chan.send(JSON.stringify(o)); }catch(e){} }, setOnMessage:function(c){ cb=c; }, close:function(){ try{ chan.close(); }catch(e){} try{ pconn.close(); }catch(e){} } }; }

    /* `?net=` still works (links, and every nettest_* suite uses it), but netplay must ALSO be enterable with
     * NO navigation. On Android a downloaded HTML file opens as `content://…`, and that scheme cannot carry a
     * query string — so the old `location.search='?net=rtchost'` navigated to a URI the provider cannot
     * resolve and the game vanished into ERR_FILE_NOT_FOUND. Reported by Aj from his phone, 2026-08-25. */
    function boot(){
      var q; try{ q=new URLSearchParams(location.search); }catch(e){ return false; }
      var m=q.get('net'); var map={ host:['host','bc'], join:['join','bc'], rtchost:['host','rtc'], rtcjoin:['join','rtc'] };
      if(!map[m]) return false;
      return start(map[m][0], map[m][1], { room:q.get('room')||'kf', deck:q.get('deck')||'random', stun:q.get('stun')!=='0' });
    }
    function start(theRole, theKind, opts){
      if(role) return true;                                   // already online
      opts = opts || {};
      role=theRole; kind=theKind; room=opts.room||'kf'; deckPick=opts.deck||'random'; myDeck=deckPick;
      useStun=(opts.stun!==false);
      var st=document.createElement('style'); st.textContent=NETCSS; document.head.appendChild(st);
      var root=document.createElement('div'); root.id='netroot'; document.body.appendChild(root);
      // Persistent exit. Entered via ?net= → clear the query; entered in-page (mobile, content://) → a plain
      // reload returns to the game, because the URL was never touched. Lives on <body> (not #netroot, which
      // renderNet keeps rewriting) so it's always reachable.
      /* Emote bar. Lives on <body> next to Leave (not inside #netroot, which renderNet rewrites), and it is
       * created ONLY in netplay — there is nobody to talk to in a solo game. Collapsed to a single 💬 tap on a
       * phone, where a 7-button row would eat the board. */
      var eb=document.createElement('div'); eb.id='emoteBar';

    // attach the transport (and its message handler) EARLY so no inbound message is dropped; kick off on open.

    /* ---- RULE SUGGESTIONS (v1.31.31). A client suggests; the host validates, stores, and broadcasts to the

    function sugNames(){ var o={}, k; for(k in seatSuggest){ if(seatNames[k]) o[k]=seatNames[k]; } return o; }
    function flushSuggest(){ send({t:'suggest', all:seatSuggest, names:sugNames()}); refreshRulesPanel(); }

      /* NOT isClientActive() — that is `isClient() && started`, i.e. false for the whole LOBBY, which is the
       * only place a suggestion is any use. A suggestion needs a client that is CONNECTED, not one mid-game. */

    /* A client cannot name the other seats itself — seatNames is only populated in its LOCAL frame at game

    // ---------- disconnect / reconnect / drop / Passo (netplay) ----------
    // A live peer's connection drops → HOLD its seat for GRACE_MS. If the connection self-heals (ICE recovers) or the
    // player re-joins (same cid), resume seamlessly. When the grace window expires the seat is handed to **Passo** — a
    // caretaker AI that only ever PASSES (leads its lowest card when forced) and auto-resolves forced windows (smart
    // discard, take-the-hit, decline). The human reclaims the seat the instant they reconnect. The host can also hard
    // **Drop** (concede + eliminate) at any point. So the table is never frozen, and a dropout keeps their standing.
    var discon={}, disconTick=null, GRACE_MS=90000;   // host: absolute seat -> { since, passo? }
    var clientSelfDown=false, clientPeerDown=false;   // client: my own link is down / another player is down (host said so)
    function nowMs(){ return Date.now(); }

    function hostOnPeerDrop(seat){
      if(!isHost() || !hostState || !started || hostState.finished) return;
      if(seat==null || seat===YOU || !hostState.players[seat] || hostState.players[seat].eliminated) return;
      if(discon[seat]) return;                                            // already holding this seat
      discon[seat]={ since: nowMs() };
      logMsg('⚠ '+seatName(seat)+' disconnected — holding their seat for '+Math.round(GRACE_MS/1000)+'s…', 'warn');
      send({t:'peer', ev:'drop'});                                        // other clients show a generic "waiting" banner

    function hostOnPeerBack(seat){

      else { logMsg('👁 '+seatName(seat)+' reconnected — spectating.', 'dim'); }   // already dropped/eliminated → rejoin as a spectator (the #4 spectator view)

    }
    function hostDropPlayer(seat){

    }
    function anyCountingDown(){ for(var k in discon){ if(discon.hasOwnProperty(k) && !discon[k].passo) return true; } return false; }

    function renderDisconBar(){

    // ---- Passo: the caretaker AI for a timed-out seat. Never initiates — passes (leads its lowest card only when forced)
    // and auto-resolves forced windows. Runs entirely host-side by feeding the SAME intents a remote client would send

    function isPasso(seat){ return !!(discon[seat] && discon[seat].passo); }

    // ---- WebRTC copy-paste signaling (no server) ----
    function newPC(){ return new RTCPeerConnection(useStun?{ iceServers:[{ urls:'stun:stun.l.google.com:19302' }] }:undefined); }

    // HOST: create one peer connection + DataChannel per invited player, feeding each into the hub.
    function hostNewInvite(){

    function joinAcceptOffer(code){

    // ---------- HOST authority ----------
    function resolveIds(seat, ids){ var h=hostState.players[seat].hand; return (ids||[]).map(function(id){ return h.filter(function(c){return c.id===id;})[0]; }).filter(Boolean); }

    // ---------- messages ----------

           * so taking `sug` every time re-asserts the client's stored preference on a timer and wipes out any
           * suggestion it has made since — a change would appear on the host and vanish within 350ms. A retry
           * is a re-announcement of the same join, not a fresh statement of preference. */

          if(started) hostOnPeerBack(jseat);                             // re-join (same cid): a held seat resumes; an already-dropped seat rejoins to spectate
          /* Re-render for a new joiner OR for a seat that has just become ready again. The `isNew` test alone
           * was enough before rules could un-ready anybody: a re-READY reuses the same cid, so the host
           * re-stamped readiness and never repainted, leaving Start disabled after the table had re-confirmed. */
          if(started) broadcastMirror(); else if(isNew || !wasReady) renderNet();   // (join retries fire every 350ms)
        }
        else if(m.t==='move'){ var sseat = srcChan ? seatOfChan(srcChan) : (typeof m.seat==='number'?m.seat:1);

           * there is no hostState — i.e. for the entire LOBBY, which is the only place suggestions matter.
           * Putting it inside them looked right and did nothing: the suggestions that appeared were arriving by
           * accident on the join RETRY (which re-sends `sug` every 350ms until the game starts). */
          if(sseat!=null && m.intent && m.intent.op==='suggest'){ hostSuggest(sseat, m.intent.key); return; }
          if(sseat!=null){ if(MP()) hostApplyMoveN(sseat, m.intent); else hostApplyMove(m.intent); } }

        else if(m.t==='suggest'){                                       // the table's suggestions, whole map

        else if(m.t==='rules'){                                          // the host edited mid-lobby: adopt and un-ready

          setMessage('⚗️ The host changed the rules — check them and hit Ready again.'); }
        else if(m.t==='full'){ if(!m.cid || m.cid===myId){ if(sig) sig.err='This game is full (6 players max).'; setMessage('⚠ This game is full.'); renderNet(); } }
        else if(m.t==='log'){                                   // public narration — resolve {who} in OUR frame
          var n=(state&&state.numPlayers)||2, r=((((m.actor-mySeat)%n)+n)%n), who;

        netReact=null; busy=true; $('rivalStatus').textContent=seatName(p)+' is playing…'; netParked={ seat:p, g:g, resume:step }; render(); broadcastMirror(); maybePasso(p);   // remote human's turn → park (Passo acts if it holds the seat)
      })();
    }
    // Pre-fight (Back Stab) window before the active player's fight/pass: the next player may spring a lockout Quick.
    // Host holder → local modal; remote holder → park (netReact 'prefight'). `proceed` runs once the window closes.
    function hostPreFight(g, proceed){
      if(g!==gen) return;
      var pf=E.openPreFight(hostState);
      if(!pf.preFightPending){ return proceed(); }
      var q=pf.q;
      if(q===YOU){ return promptHostPreFight(g, proceed); }
      netParked=null; netReact={ kind:'prefight', seat:q, g:g, cont:proceed };
      busy=true; $('rivalStatus').textContent=seatName(q)+' may spring Back Stab…'; render(); broadcastMirror(); maybePasso(q);
    }
    function promptHostPreFight(g, proceed){
      var quicks=eligiblePreFightQuicks();
      if(!quicks.length){ E.preFightPass(hostState, YOU); return proceed(); }
      var html='<h2>'+seatName(hostState.turn)+' is about to fight</h2><p>Spring a Quick to lock their turn before they play?</p>'+tableContextHTML()+'<div class="respOpts">';
      quicks.forEach(function(c){ var ef=E.effectOf(c); html+='<button class="respQuick" data-id="'+c.id+'">'+ef.name+' · '+cardSym(c)+' ('+ef.cost+'⚡)<span class="respTxt">'+ef.text+'</span></button>'; });
      html+='<button id="pfDecline" class="respLet">Let them fight</button></div>'+peekBtnHTML();
      showModal(html); wirePeek();
      Array.prototype.forEach.call(document.querySelectorAll('.respQuick'), function(btn){
        btn.addEventListener('click', function(){ var id=btn.getAttribute('data-id'), card=hostState.players[YOU].hand.filter(function(c){return c.id===id;})[0];
          var r=E.preFightCast(hostState, YOU, id); if(!r.ok){ setMessage(r.reason); return; } hideOverlay();
          if(card) flashArt(card,'You'); setMessage('🗡 You spring Back Stab!'); logMsg('<b>You</b> sprang Back Stab — '+seatName(hostState.turn)+' is locked.', 'you'); bumpEffect(YOU, E.effectOf(card)); render();
          hostSettleN(g, function(){ if(g===gen) proceed(); }); });                 // the active player may Counter the Back Stab

    function hostApplyMoveN(seat, it){
      if(!hostState || hostState.finished || !it || typeof it.op!=='string') return;
      if(it.op==='emote') return hostEmote(seat, it.key);   // never turn-gated
      var n=hostState.numPlayers;
      // ---- energy reorder: never interacts with a window, so handle it before anything else ----
      if(it.op==='reorderEnergy') return hostReorderEnergy(seat, it);
      // ---- pre-fight (Back Stab) window the remote holder owes ----
      if(it.op==='prefight'||it.op==='prefightPass'){
        if(!netReact || netReact.kind!=='prefight' || netReact.seat!==seat) return;
        var pfc=netReact; netReact=null;
        if(it.op==='prefight'){ var pr=E.preFightCast(hostState, seat, it.id); if(pr&&pr.ok===false){ netReact=pfc; sendTo(seat,{t:'err',seat:seat,reason:pr.reason||'Illegal Quick.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> sprang Back Stab!', 'rival'); return hostSettleN(pfc.g, function(){ if(pfc.g===gen) pfc.cont(); }); }
        E.preFightPass(hostState, seat); say(seat, '{who} let the fight proceed.', 'dim'); return pfc.cont();
      }
      // ---- LOSS-TARGET pick: the remote round-winner chose whose shield to strip (chosen mode) ----
      if(it.op==='lossTarget'){
        if(!netReact || netReact.kind!=='loss' || netReact.seat!==seat) return;
        var lt=(it.target!=null)?((it.target+seat)%n):null;                     // un-rotate the winner's pick to an absolute seat
        var lr=E.chooseLossTarget(hostState, lt);
        if(lr && lr.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:lr.reason||'Illegal target.'}); broadcastMirror(); return; }
        say(seat, '{who} strikes '+logName(lt)+'’s shield with a Special.', 'rival');
        var nrl=netReact; netReact=null; return nrl.cont(lr);
      }
      // ---- REACTIVE ops: valid only for the seat whose reactive window is parked (which may NOT be its turn) ----
      if(it.op==='respond'||it.op==='decline'||it.op==='guard'||it.op==='guardPass'||it.op==='discard'){
        if(!netReact || netReact.seat!==seat) return;                           // stale / duplicate / out-of-window — ignore
        try{
          if(it.op==='respond'){ if(netReact.kind!=='respond') return; var qc=resolveIds(seat,[it.id])[0], qe=qc?E.effectOf(qc):null; var rr=E.respond(hostState, seat, it.id); if(rr&&rr.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:rr.reason||'Illegal response.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> '+((qe&&qe.kind==='counter')?('countered with '+qe.name+'!'):('answered'+(qe?(' with '+qe.name):'')+' at instant speed.')), 'rival'); }
          else if(it.op==='decline'){ if(netReact.kind!=='respond') return; E.declineResponse(hostState, seat); say(seat, '{who} let it resolve.', 'dim'); }
          else if(it.op==='guard'){ if(netReact.kind!=='guard') return; var fr=E.shieldGuard(hostState, seat, it.id); if(fr&&fr.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:fr.reason||'Illegal guard.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> sprang '+((fr&&fr.guardName)||'a guard')+' — shield holds.', 'rival'); }
          else if(it.op==='guardPass'){ if(netReact.kind!=='guard') return; E.shieldGuardPass(hostState, seat); say(seat, '{who} took the hit.', 'rival'); }
          else if(it.op==='discard'){ if(netReact.kind!=='discard') return; var d=E.resolveDiscard(hostState, it.ids||[]); if(d&&d.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:d.reason||'Illegal discard.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> discarded '+((it.ids&&it.ids.length)||0)+' card'+(((it.ids&&it.ids.length)||0)>1?'s':'')+'.', 'rival'); }
        }catch(e){ sendTo(seat,{t:'err',seat:seat,reason:'Rejected.'}); broadcastMirror(); return; }
        var nr=netReact; netReact=null; return nr.resume();
      }
      // ---- TURN ops: valid only for the seat whose turn it is ----
      if(hostState.turn!==seat){ sendTo(seat, {t:'err', seat:seat, reason:'Not your turn.'}); return; }
      var g=(netParked&&netParked.g)||gen;
      // A fight or a pass first opens the pre-fight (Back Stab) window for the next seat; only then does it resolve.
      if(it.op==='play' || it.op==='pass'){
        return hostPreFight(g, function(){
          if(g!==gen) return;
          var r;
          try{
            if(E.isLocked(hostState, seat)){ r=E.pass(hostState, seat); say(seat, '{who} is locked out (Back Stab) — turn skipped.', 'warn'); }
            else if(it.op==='play'){ r=E.play(hostState, seat, resolveIds(seat, it.ids)); if(r&&r.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:r.reason||'Illegal move.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> played '+playPhrase(r.combo)+(r.boosted?' (boosted)':'')+'.', 'rival'); }
            else { r=E.pass(hostState, seat); if(r&&r.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:r.reason||'Illegal move.'}); broadcastMirror(); return; } logMsg('<b>'+seatName(seat)+'</b> passed.', 'rival'); }
          }catch(e){ sendTo(seat,{t:'err',seat:seat,reason:'Move rejected.'}); broadcastMirror(); return; }
          netParked=null;
          if(r && r.roundWinner!=null){ return hostResolveWin(r, g, function(fr){ hostSettleRoundThenCeremony(fr, g); }); }
          driveN();
        });
      }
      var r;
      try{
        if(it.op==='activate'){
          var ac=resolveIds(seat,[it.id])[0], ae=ac?E.effectOf(ac):null;
          var tgt=(it.target!=null)?((it.target+seat)%n):undefined;   // un-rotate the client's (rotated) target back to the absolute seat
          r=E.activate(hostState, seat, it.id, { target:tgt, copyId:it.copyId, discard:it.discard, toTop:it.toTop });
          if(r&&r.ok===false){ sendTo(seat,{t:'err',seat:seat,reason:r.reason||'Illegal move.'}); broadcastMirror(); return; }
          say(seat, '{who} played '+(ae?ae.name:'a Technique')+'.', 'rival');
          hostFlushReveals();          // Outbalance: hand the read to the caster (no-op for every other card)
        } else return;
      }catch(e){ sendTo(seat,{t:'err',seat:seat,reason:'Move rejected.'}); broadcastMirror(); return; }
      netParked=null;
      if(r && r.roundWinner!=null){ return hostResolveWin(r, g, function(fr){ hostSettleRoundThenCeremony(fr, g); }); }
      driveN();
    }
    // After the strike is decided, resolve the struck seat's guard window (host modal / remote park) then the ceremony.
    function hostSettleRoundThenCeremony(r, g){
      if(g!==gen) return;
      if(hostState.shieldResponse && hostState.shieldResponse.q===YOU){ return openShieldGuardModal(r, function(fr){ hostRunCeremony(fr||r, g); }); }
      if(hostState.shieldResponse && hostState.shieldResponse.q!=null){
        if(hostState.shieldResponse.guardId){ netParked=null; netReact={ kind:'guard', seat:hostState.shieldResponse.q, g:g, resume:function(){ hostSettleRoundThenCeremony(r, g); } }; busy=true; render(); broadcastMirror(); maybePasso(netReact.seat); return; }
        E.shieldGuardPass(hostState, hostState.shieldResponse.q); return hostSettleRoundThenCeremony(r, g);   // no guard to spring → take the hit, re-check
      }
      hostRunCeremony(r, g);
    }
    // A round resolved: if the winner must pick whose shield to strip (chosen mode), the host picks locally / a remote
    // winner's choice window parks; then `contAfter(finalRes)` runs the ceremony.
    function hostResolveWin(r, g, contAfter){
      if(!r.needsLossTarget){ return contAfter(r); }
      var winner = (hostState.pendingLossChoice ? hostState.pendingLossChoice.winner : r.roundWinner);
      if(winner===YOU){ return promptLossTarget(r, g, contAfter); }                 // host picks via its opponent panels
      netParked=null; netReact={ kind:'loss', seat:winner, g:g, cont:contAfter };    // remote winner picks (their mirror shows pendingLossChoice)
      busy=true; $('rivalStatus').textContent=seatName(winner)+' is choosing a target…'; render(); broadcastMirror(); maybePasso(winner);
    }
    function hostRunCeremony(fr, g){
      announceRoundWin(fr);
      if(hostState.finished){ busy=false; render(); broadcastMirror(); return endGame(); }
      sendCeremony(fr);
      resolveRoundCeremony(fr, g, function(){ if(g===gen){ broadcastMirror(); driveN(); } });
    }

    // ---- CLIENT: render the real board from each mirror; send inputs as intents. ----
    function applyMirror(st){
      if(iConceded) return;   // we forfeited — stay on our concede screen, ignore the ongoing game
      // During the round ceremony, hold the NEW-ROUND deal (hand grew) so its card fly-in waits for the banner;
      // intermediate mirrors (shield drop, pile clear) still apply so the shatter animates on the beat.
      if(clientCeremonyActive && st && !st.finished && handGrew(st)){ pendingRoundMirror=st; return; }
      if(awaitingRoundReveal && st && !st.finished && handGrew(st)){ return revealRound(st); }
      applyMirrorNow(st);
    }
    function applyMirrorNow(st){
      started=true; state=st; hostState=null; window.__cmfNetState=st;
      var owedModal = !!((st.pending && st.respondFor===YOU) || (st.shieldResponse && st.shieldResponse.q===YOU) || (st.preFightQ===YOU));   // overlay windows — keep them up (don't flicker away)
      var owedDiscard = !!(st.discardPending && st.discardPending.player===YOU);                                     // interactive hand-picker — must stay unlocked
      var owedLoss = !!(st.pendingLossChoice && st.pendingLossChoice.winner===YOU);                                 // panel-pick: whose shield to strip
      if(owedModal) revealOpen=false;                    // a window the GAME owes you outranks a look at a hand
      if(!owedModal && !revealOpen) hideOverlay();
      hideNetroot();
      busy = owedModal || owedLoss || (!owedDiscard && (state.turn!==YOU)) || !!state.finished;   // locked during modal windows / opponent's turn / loss-pick; unlocked to pick discards
      render();
      if(state.finished){ endGame(); return; }
      clientCheckWindow();
    }
    // The mirror can show a window owed to us (seat rotated to index 0). Pop the SAME modal/picker the single-player
    // board uses — its buttons are gated (below) to send intents instead of touching a local engine.
    var clientWinSig=null;
    function clientCheckWindow(){
      if(!isClientActive() || !state || state.finished) return;
      var sig=null;
      if(state.pending && state.respondFor===YOU) sig='resp:'+((state.pending.card&&state.pending.card.id)||'?');
      else if(state.shieldResponse && state.shieldResponse.q===YOU) sig='guard:'+((state.shieldResponse.guardId||'')+':'+(state.shieldResponse.roundWin?'w':'m'));
      else if(state.discardPending && state.discardPending.player===YOU) sig='disc:'+(state.discardPending.count||1);
      else if(state.pendingLossChoice && state.pendingLossChoice.winner===YOU) sig='loss:'+(state.pendingLossChoice.cands||[]).join(',');
      else if(state.preFightQ===YOU) sig='prefight';
      if(sig===clientWinSig) return;                    // already handling this exact window
      clientWinSig=sig;
      if(!sig) return;
      if(sig.indexOf('resp:')===0) promptHumanResponse(gen, function(){});
      else if(sig.indexOf('guard:')===0) openShieldGuardModal(null, function(){});
      else if(sig.indexOf('disc:')===0) promptHumanDiscard(gen);
      else if(sig.indexOf('loss:')===0) promptLossTarget({ cands:state.pendingLossChoice.cands.slice(), comboType:state.pendingLossChoice.comboType }, gen, function(){});
      else if(sig==='prefight') promptHumanPreFight(gen);
    }
    // Test-only (behind ?dbg=1): overwrite both hands on the host and resync, to stage a deterministic scenario.
    function dbgForce(hh, rh, he, re, hs, rs){ if(!hostState) return false; hostState.players[0].hand=hh.slice(); hostState.players[1].hand=rh.slice(); if(he) hostState.players[0].energy=he.slice(); if(re) hostState.players[1].energy=re.slice(); if(hs!=null) hostState.players[0].shields=hs; if(rs!=null) hostState.players[1].shields=rs; busy=(hostState.turn!==YOU); render(); broadcastMirror(); return true; }
    function dbgForceAll(hands, energies, shields, opts){ if(!hostState) return false; for(var s=0;s<hostState.numPlayers;s++){ if(hands&&hands[s]) hostState.players[s].hand=hands[s].slice(); if(energies&&energies[s]) hostState.players[s].energy=energies[s].slice(); if(shields&&shields[s]!=null) hostState.players[s].shields=shields[s]; if(opts&&opts.forms&&opts.forms[s]) hostState.players[s].forms=opts.forms[s].map(function(f){ return { rank:f.rank, suit:f.suit, tier:f.tier||'queen', name:f.name||'', card:{ rank:f.rank, suit:f.suit, id:'form'+f.rank+f.suit+'#'+s } }; });
        if(opts&&opts.equip&&opts.equip[s]) hostState.players[s].equipment=opts.equip[s].map(function(e){ return { id:e.id||'dbg', name:e.name||'Equipment', delta:e.delta||0, oppDelta:e.oppDelta||0, counters:e.counters!=null?e.counters:3, decay:true, card:{ rank:e.rank, suit:e.suit, id:'eq'+e.rank+e.suit+'#'+s } }; });
        if(opts&&opts.deck&&opts.deck[s]) hostState.players[s].deck=opts.deck[s].slice(); if(opts&&opts.shuffle&&opts.shuffle[s]) hostState.players[s].shuffle=opts.shuffle[s].slice(); } if(opts){ if(opts.round!=null) hostState.round=opts.round; if(opts.turn!=null){ hostState.turn=opts.turn; hostState.initiative=opts.turn; hostState.pile=null; hostState.passes=0; hostState.lastPlayer=null; hostState.preFightHandled=false; for(var q=0;q<hostState.numPlayers;q++){ hostState.players[q].lockSkip=false; hostState.players[q].lockRound=false; } } } busy=(hostState.turn!==YOU); render(); broadcastMirror(); return true; }
    // Client replays the round ceremony from the host's event: reuse the real (purely-visual) beat players.
    // holdShields freezes the shield pips so playPreBeats can shatter them ON the "loses a shield" beat (matching
    // the host); flushThreshold shows OUR own tier unlock (queued by render()→animateShields when our shield fell).
    // The NEW-ROUND deal mirror is held (see applyMirror) until the beats finish, so the "Round N" banner and the
    // card fly-in land together — mirroring the host's deferred draw.
    var clientCeremonyActive=false, clientCeremonyRes=null, pendingRoundMirror=null, awaitingRoundReveal=false;
    function clientPlayCeremony(res){
      if(isHost() || !res) return;
      clientCeremonyRes=res; clientCeremonyActive=true; pendingRoundMirror=null; awaitingRoundReveal=false;
      holdShields = !reduceMotion() && !!res.shieldStripped;
      announceRoundWin(res);                                   // message + log, already rotated to our seat
      render();
      playPreBeats(res, function(){ flushThreshold(function(){ holdShields=false; finishClientCeremony(); }); });
    }
    function finishClientCeremony(){
      clientCeremonyActive=false;
      if(pendingRoundMirror){ var m=pendingRoundMirror; pendingRoundMirror=null; revealRound(m); }
      else { awaitingRoundReveal=true; setTimeout(function(){ awaitingRoundReveal=false; }, 2500); }   // deal mirror not here yet — reveal it when it lands (applyMirror), or drop the banner after a beat
    }
    function handGrew(st){ return !!(st && st.players && st.players[0] && state && state.players && state.players[0] && st.players[0].hand.length > state.players[0].hand.length); }
    function revealRound(m){                                   // apply the new-round state + show the "Round N" banner as the cards fly in
      awaitingRoundReveal=false;

      applyMirrorNow(m);
      enterDelayBase = 0;
      if(clientCeremonyRes && clientCeremonyRes.newRound && !m.finished) playRoundCardBeat(clientCeremonyRes, function(){});
    }
    function clientSend(it){ send({t:'move', seat:mySeat, intent:it}); }
    var iConceded=false;
    function concede(){ iConceded=true; send({t:'concede', seat:mySeat}); }   // notify the host we forfeited; ignore further mirrors (stay on our end screen)
    function onOpponentConcede(seat){
      if(!state || state.finished) return;
      if(isHost() && hostState && MP()){                        // N-player: eliminate the conceder, keep the game going
        var r=E.concede(hostState, seat);
        if(r && r.ok){
          say(seat, '🏳 {who} conceded — '+(r.finished?'game over.':'out.'), 'warn');
          if(netReact && netReact.seat===seat) netReact=null;   // drop any window parked for the departed seat
          if(netParked && netParked.seat===seat) netParked=null;
          if(r.finished){ busy=false; render(); broadcastMirror(); return endGame(); }
          busy=false; render(); broadcastMirror(); return driveN();
        }
        return;
      }
      if(isHost() && hostState){ hostState.finished=true; hostState.winner=YOU; }
      state.finished=true; state.winner=YOU;      // 2p: opponent conceded → we win
      logMsg('🏳 Opponent conceded — you win!', 'good'); busy=false; render(); endGame();
    }
    // The HOST forfeits in an N-player game: it's the authority, so it stays on as a referee (eliminated, spectating)
    // and keeps driving the remaining players; only when one is left does the game end.
    function hostConcede(){
      if(!hostState || hostState.finished) return;
      var r=E.concede(hostState, YOU);
      logMsg('🏳 You conceded — you are out'+(r.finished?', game over.':' (refereeing the rest).'), 'warn');
      netReact=null; netParked=null;
      if(r.finished){ busy=false; render(); broadcastMirror(); return endGame(); }
      busy=true; render(); broadcastMirror(); driveN();
    }

    // ---------- view ----------
    /* VERSION HANDSHAKE. Netplay had no protocol negotiation at all: two different builds would connect happily
     * and then simply misbehave, with nothing on screen to say why. That is not hypothetical here — a stale
     * downloaded copy has already produced one false bug report, and once a homebrew rules menu exists a peer
     * silently ignoring an unknown rule would be worse than no menu.
     * It WARNS rather than refuses: a patch-level difference is usually harmless, and locking two friends out of
     * a game because of it would be a worse failure than the mismatch. `?ver=` overrides the reported version so
     * the mismatch path is testable; it is inert without `dbg=1`. */
    var verWarn=null;
    function netVersion(){
      var m=/[?&]ver=([^&]+)/.exec(location.search);
      return (m && /[?&]dbg=1/.test(location.search)) ? decodeURIComponent(m[1]) : GAME_VERSION;
    }
    function noteVersion(theirs){
      if(!theirs || theirs===netVersion()) return false;
      if(verWarn) return true;                                  // already reported; do not spam the log
      verWarn={ mine:netVersion(), theirs:theirs };
      logMsg('⚠ Build mismatch — you are on <b>'+esc(verWarn.mine)+'</b>, your opponent is on <b>'+
             esc(verWarn.theirs)+'</b>. Play may behave differently; download the same build to be sure.', 'bad');
      return true;
    }
    function verWarnHTML(){
      return verWarn ? '<div class="netmsg err">⚠ Build mismatch — you are on <b>'+esc(verWarn.mine)+
             '</b>, they are on <b>'+esc(verWarn.theirs)+'</b>. You can still play, but download the same build to be sure.</div>' : '';
    }
    function connLabel(){ return connected ? '<span class="ok">● connected</span>' : '<span class="wait">○ waiting for opponent…</span>'; }
    function renderSignaling(root){
      var errHTML = sig.err ? '<div class="netmsg err">⚠ '+sig.err+'</div>' : '';
      var head='<div class="netlobby"><h1>Cardmen Fighter — Online</h1>'+
        '<div class="netbar">Peer-to-peer · '+(isHost()?'Hosting (Player 1)':'Joining (Player 2)')+' · no server · '+verTag()+'</div>'+errHTML+verWarnHTML();
      var body='';                        // NB: the branches below ASSIGN body, so the name row is prepended
      if(isHost() && sig.step==='host-gen'){ body='<p>Generating your invite code…</p>'; }
      else if(isHost() && sig.step==='host-wait'){
        body='<h3>Step 1 — send this invite to your friend</h3>'+
          qrBlockHTML('qrInvite', 'Point their phone\u2019s camera at this \u2014 or send them the code below.')+
          '<textarea id="sigOut" class="sigbox" readonly>'+sig.offer+'</textarea>'+
          '<button id="sigCopy" class="netbtn alt">⧉ Copy invite code</button>'+
          shareBtnHTML('Send it')+
          '<h3>Step 2 — paste their reply code here</h3>'+
          '<textarea id="sigIn" class="sigbox" placeholder="Paste the reply code your friend sends back…"></textarea>'+
          '<button id="sigGo" class="netbtn go">Connect ▶</button>'+
          '<p class="nethint">Send the code over any chat (Discord, email, SMS). You connect directly — nothing goes through a server.</p>';
      }
      else if(!isHost() && sig.step==='join-need'){
        body='<h3>Step 1 — paste the invite code from your host</h3>'+
          '<textarea id="sigIn" class="sigbox" placeholder="Paste the invite code Player 1 sent you…"></textarea>'+
          '<button id="sigGo" class="netbtn go">Generate my reply ▶</button>';
      }
      else if(!isHost() && sig.step==='join-reply'){
        body='<h3>Step 2 — send this reply back to your host</h3>'+
          qrBlockHTML('qrReply', 'Let your host scan this \u2014 or send them the code below.')+
          '<textarea id="sigOut" class="sigbox" readonly>'+sig.answer+'</textarea>'+
          '<button id="sigCopy" class="netbtn alt">⧉ Copy reply code</button>'+
          shareBtnHTML('Send it back')+
          '<p class="nethint">Waiting for your host to connect… the game starts automatically once they paste it.</p>';
      }
      // the name row goes FIRST on this screen — it is the client's first sight of the game
      root.innerHTML=head+nameRowHTML(false)+body+'</div>';
      wireNameRow();
      qrInto('qrInvite', sig.offer); qrInto('qrReply', sig.answer);   // SHOW only — phase 1
      var copy=$('sigCopy'); if(copy) copy.addEventListener('click', function(){ var t=$('sigOut'); if(t){ t.select(); try{ navigator.clipboard.writeText(t.value); }catch(e){} try{ document.execCommand('copy'); }catch(e){} copy.textContent='✓ Copied'; } });
      shareWire();
