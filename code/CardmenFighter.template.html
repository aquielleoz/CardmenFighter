<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1020" />
<title>Cardmen Fighter</title>
<style>
  /* ---- STACKING ORDER, DERIVED FROM ONE NUMBER (v1.31.61) ------------------------------------------------
     These four layers only make sense relative to each other, and as hardcoded constants they drifted apart:
     peek lifted its panels to 35 and its Back button to 60, chosen when `.overlay` was 30 — and v1.31.36 raised
     `.overlay` to 100000 so the rules panel would stop opening behind `#netroot`. That fixed the rules panel and
     buried every peek control under a backdrop you can see straight through: hit-tested at 390x780, `#peekBar`,
     `#logWrap`, `#handWrap` and the hand all returned `div#overlay` as the topmost element at their own centre.
     The board was fully legible and nothing responded.
     Deriving them means the next person to raise the overlay carries peek along automatically — the same reason
     the version stamp is read from README rather than declared twice. **Do not reintroduce a bare number here.** */
  :root{
    --zNetroot:99999;                        /* the netplay lobby covers the board */
    --zOverlay:calc(var(--zNetroot) + 1);    /* …and every dialog must outrank the lobby (v1.31.36) */
    --zPeek:calc(var(--zNetroot) + 2);       /* …and while peeking, the panels must outrank the dialog backdrop */
    --zPeekBar:calc(var(--zNetroot) + 3);    /* …and ↩ Back must outrank the lifted panels */
    --headerH:56px;   /* the desktop header. The landscape band overrides it — #disconBar hangs off this. */
    --bg:#160e1e; --bg2:#241633; --line:rgba(255,255,255,.12); --gold:#e8c37a;
    --red:#ff5a5a; --txt:#f2ecf6; --panel:rgba(0,0,0,.3); --good:#43c06a; --bad:#e2624a;
    --nrg:#5ac8fa; --shield:#e8c37a; --pick:#c98bff;
    --cs:1;   /* card scale — grows on wider viewports so cards don't look tiny on big monitors */
    --pm:1;   /* PILE multiplier on top of --cs: the pile shows at most 5 cards, so it can run larger */
  }
  /* Adaptive card sizing: scale playing cards up on large screens (base tuned for laptops/tablets) */
  /* Card scale steps. Playtester on a large screen: "the cards look smol". Measured, they were: at 1920x1080
     a card was 65x94px — 3.4% of the width — with ~970px of board above it mostly empty, because 1920 falls
     just UNDER the old 2000px step. Steps are now denser and gated on min-height as well as min-width, so a
     wide-but-short window (a laptop, a half-height window) does not get cards too tall for its hand row. */
  @media (min-width:560px){  :root{ --pm:1.2; } }
  @media (min-width:1000px){ :root{ --pm:1.45; } }
  @media (min-width:1200px){ :root{ --cs:1.18; --pm:1.6; } }
  /* 1200-1439 is the tightest band: with the battle log open the centre is ~640px wide, and after the rail
     reservation a 5-card pile at --pm:1.6 wrapped. Ease the pile scale here only — these are small screens,
     and the "cards look smol" complaint was about large ones. */
  @media (min-width:1200px) and (max-width:1439px){ :root{ --pm:1.35; } }
  @media (min-width:1440px) and (min-height:800px){ :root{ --cs:1.32; } }
  @media (min-width:1600px) and (min-height:860px){ :root{ --cs:1.5; --pm:1.75; } }
  @media (min-width:1800px) and (min-height:900px){ :root{ --cs:1.68; } }
  @media (min-width:2200px) and (min-height:1000px){ :root{ --cs:1.9; } }
  @media (min-width:2560px) and (min-height:1200px){ :root{ --cs:2.1; } }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt); background:radial-gradient(130% 120% at 50% -10%,var(--bg2),var(--bg) 70%);
    display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;}
  header{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.25); flex:0 0 auto;}
  header h1{font-size:17px; margin:0; letter-spacing:.5px; color:var(--gold); font-weight:900; white-space:nowrap;}
  header h1 small{color:var(--txt); opacity:.55; font-weight:600; font-size:11px; margin-left:6px;}
  header .spacer{flex:1;}
  header button{font:inherit; font-size:13px; font-weight:700; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer;}
  header button.primary{background:var(--gold); color:#3a2a08; border-color:transparent;}
  header .diffWrap{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.8; color:var(--txt); white-space:nowrap;}
  header select{font:inherit; font-size:13px; font-weight:700; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 9px; cursor:pointer; color-scheme:dark;}
  header select:focus{outline:1px solid var(--gold);}
  header h1, header #helpBtn, header #cheatBtn, header #sfxBtn, header #hintsBtn, header #settingsBtn, header #newBtn{flex:0 0 auto;}   /* title + buttons never shrink or clip */
  header #cheatBtn, header #sfxBtn, header #settingsBtn{font-size:16px; line-height:1;}
  header #sfxBtn.muted{opacity:.5;}
  header #hintsBtn{font-size:12px;}
  header #hintsBtn.on{background:rgba(240,200,80,.18); border-color:var(--gold); color:var(--gold);}
  /* Play-hint classes on hand groups (only when Hints is on) */
  #hand .group.hdead{opacity:.34; filter:grayscale(.5);}
  #hand .group.hbreak{outline:2px dashed rgba(240,200,80,.7); outline-offset:2px; border-radius:10px;}
  #hand .group.hplay{}   /* playable as-is: left normal (no extra emphasis needed) */
  /* Tutorial READ step holds the board: dim the hand (except any spotlighted card) so players read the tip, not tap cards */
  #hand.tutlock .group{ opacity:.32; pointer-events:none; transition:opacity .18s; }
  #hand.tutlock .group.tut-spot{ opacity:1; }
  #newBtn.conceding{ background:#7d2b2b; border-color:#a94848; color:#ffe7e7; }  /* mid-duel the button forfeits — tint it as a danger action */
  .matchupTag{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}  /* the matchup truncates instead of pushing New Duel off-screen */
  @media (max-width:560px){ header h1 small{display:none;} header .diffWrap{font-size:0; gap:0;} .matchupTag{display:none;} }
  /* narrow phones: the fixed single-row header pushed New Duel off-screen — let it wrap, shrink the title, and
     collapse the wordy Hints toggle to its 💡 icon (its on/off state still reads via the gold highlight). */
  @media (max-width:480px){
    header{flex-wrap:wrap; justify-content:flex-end; gap:6px 8px; padding:8px 12px;}
    /* let the title shrink and wrap to two lines (CARDMEN / FIGHTER) when the button row gets crowded */
    header h1{font-size:15px; white-space:normal; line-height:1.04; flex:0 1 auto; min-width:0;}
    header #hintsBtn{font-size:0; padding:7px 10px;}
    header #hintsBtn::before{content:'💡'; font-size:16px; line-height:1;}
  }

  main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:8px 10px 0; gap:8px;}
  /* `flex:0 1 auto`, NOT `0 0 auto`. The row already declares `flex-wrap:wrap` — "I will take two lines if I
     have to" — and shrink:0 guaranteed it never had to, so it sat at its max-content width (name + deck name +
     4 shields + energy + deck count + recycle ≈ 400px) and pushed past the viewport instead of wrapping.
     Measured before: 394px inside a 327px screen, 416px inside 390px, with `main` scrolling sideways at both.
     Letting it shrink is what lets the wrap it already asks for actually fire. Desktop has room, so nothing
     moves there — asserted in both directions. */
  .fighter{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 12px; display:flex; align-items:center; gap:12px; flex:0 1 auto; flex-wrap:wrap; min-width:0;}
  .fighter.turn{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,195,122,.3);}
  /* --- N-player opponents strip (3–6 players) --- */
  #opponents{display:none; gap:8px; flex:0 0 auto; flex-wrap:wrap; justify-content:center;}
  #opponents.show{display:flex;}
  .oppPanel{flex:1 1 0; min-width:130px; max-width:230px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 9px; display:flex; flex-direction:column; gap:3px; font-size:11px; position:relative; transition:box-shadow .15s,border-color .15s;}
  .oppPanel.turn{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,195,122,.35);}
  .oppPanel.dead{opacity:.4; filter:grayscale(1);}
  .oppPanel.targetable{cursor:pointer; border-color:var(--pick); box-shadow:0 0 12px rgba(201,139,255,.8); animation:tgtPulse .9s ease-in-out infinite;}
  .fighter.targetable{cursor:pointer; border-radius:12px; outline:2px solid var(--pick); box-shadow:0 0 12px rgba(201,139,255,.8); animation:tgtPulse .9s ease-in-out infinite;}   /* duel: rival panel as a tap-target */
  .oppPanel .oppTop{display:flex; align-items:center; gap:6px; justify-content:space-between;}
  .oppPanel .oppName{font-weight:800; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oppPanel .oppSeat{font-size:9px; opacity:.6; font-weight:700;}
  .oppPanel .oppShields{display:flex; gap:3px; flex-wrap:wrap;}
  .oppPanel .oppShields .s{width:12px;height:15px;border-radius:2px 2px 4px 4px; background:var(--shield); box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);}
  .oppPanel .oppShields .s.lost{background:transparent; border:1px solid rgba(255,255,255,.2);}
  .oppPanel .oppStats{display:flex; gap:8px; flex-wrap:wrap; opacity:.9;}
  .oppPanel .oppStats .red{color:var(--bad);}
  .oppPanel .oppGear{font-size:9.5px; opacity:.85; min-height:11px; display:flex; gap:5px; flex-wrap:wrap;}
  .oppPanel .oppGear .g{color:var(--good);} .oppPanel .oppGear .d{color:var(--bad);} .oppPanel .oppGear .f{color:var(--gold);}
  .oppPanel .oppTag{position:absolute; top:5px; right:8px; font-size:9px; font-weight:800; color:var(--gold);}
  .oppPanel .oppDead{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; letter-spacing:2px; color:var(--bad); font-size:13px; text-shadow:0 1px 4px rgba(0,0,0,.7);}
  .fighter .who{font-weight:800; font-size:14px; min-width:44px;}
  .shields{display:flex; gap:4px;}
  .shields .s{position:relative; width:16px;height:20px;border-radius:3px 3px 5px 5px; background:var(--shield); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
  .shields .s.lost{background:transparent; border:1.5px solid rgba(255,255,255,.2);}
  /* --- shield shatter + damage shake --- */
  .shields .s.shatter{ background:var(--shield)!important; border:none!important; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); z-index:1; animation:shieldBreak .64s ease-out forwards; }
  @keyframes shieldBreak{ 0%{transform:scale(1) rotate(0); opacity:1; filter:brightness(1.7);} 18%{transform:scale(1.2) rotate(-4deg); filter:brightness(2.1);} 100%{transform:scale(.35) rotate(10deg); opacity:0;} }
  .shields .s .shards{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .shields .s .shards i{ position:absolute; left:50%; top:50%; width:5px; height:6px; margin:-3px 0 0 -2px; background:var(--shield); border-radius:1px; opacity:0; animation:shardFly .64s ease-out forwards; }
  .shields .s .shards i:nth-child(1){ --dx:-16px; --dy:-20px; --rot:140deg; }
  .shields .s .shards i:nth-child(2){ --dx:16px;  --dy:-18px; --rot:-120deg; }
  .shields .s .shards i:nth-child(3){ --dx:-14px; --dy:14px;  --rot:90deg; }
  .shields .s .shards i:nth-child(4){ --dx:15px;  --dy:16px;  --rot:-80deg; }
  .shields .s .shards i:nth-child(5){ --dx:0px;   --dy:-25px; --rot:200deg; }
  @keyframes shardFly{ 0%{opacity:1; transform:translate(0,0) rotate(0) scale(1);} 15%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.55);} }
  @keyframes shieldShake{ 0%,100%{transform:translateX(0);} 15%{transform:translateX(-4px);} 30%{transform:translateX(4px);} 45%{transform:translateX(-3px);} 60%{transform:translateX(3px);} 78%{transform:translateX(-2px);} }
  .shields.shake-shield{ animation:shieldShake .46s ease-in-out; }
  @media (prefers-reduced-motion: reduce){ .shields .s.shatter{animation:none;} .shields.shake-shield{animation:none;} .shields .s .shards{display:none;} }
  .stat{font-size:12px; opacity:.9; display:flex; align-items:center; gap:4px; white-space:nowrap;}
  .stat b{color:var(--nrg); font-weight:800;}
  .stat.deck b{color:var(--gold);}
  /* REWORK Forms & Rides Zone — on-table, left edge (rival top-left, you bottom-left) */
  .formZone{position:absolute; left:8px; display:none; flex-direction:column; gap:5px; align-items:flex-start; z-index:3; pointer-events:none; max-width:min(46%,188px);}
  #rivalFormZone{top:30px;} #youFormZone{bottom:4px;}
  .formZone .zoneLbl{font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; opacity:.5; font-weight:700; padding-left:3px;}
  .formZone .formRow{pointer-events:auto; display:flex; flex-wrap:wrap; gap:5px;}
  .formZone .card.formMini{width:40px; min-width:40px; height:56px; border-radius:7px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.45); border:1.5px solid rgba(140,130,235,.65);}
  .formZone .card.formMini.ride{border-color:rgba(255,196,60,.7);}
  .formZone .card.formMini .idx{font-size:.62rem;}
  .formZone .card.formMini.targetable{border-color:var(--bad); box-shadow:0 0 0 2px var(--bad), 0 0 12px rgba(226,98,74,.5); animation:superPulse 1.1s ease-in-out infinite;}
  .formZone .formStrip{pointer-events:auto; cursor:pointer; display:flex; flex-wrap:wrap; gap:4px; align-items:center;}
  .formZone .formChip{font-size:.72rem; font-weight:800; line-height:1; padding:3px 7px; border-radius:6px; background:linear-gradient(180deg,rgba(120,110,220,.22),rgba(20,18,32,.9)); border:1px solid rgba(140,130,235,.6); box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .formZone .formChip.ride{border-color:rgba(255,196,60,.65); background:linear-gradient(180deg,rgba(255,196,60,.2),rgba(20,18,32,.9));}
  .formZone .formChip .sr{color:#ff9a9a;}
  .formZone .formStrip .superBadge.mini{cursor:pointer; align-self:flex-start; padding:3px 9px; font-size:.66rem;}
  .superBadge{align-self:stretch; text-align:center; font-weight:800; font-size:.72rem; letter-spacing:.06em; color:#1a1330; background:linear-gradient(90deg,#ffd24a,#ffb020); border-radius:8px; padding:3px 8px; box-shadow:0 0 12px rgba(255,196,60,.6); animation:superPulse 1.4s ease-in-out infinite;}
  .superLine{display:block; margin-top:6px; font-weight:800; letter-spacing:.04em; color:#ffd24a; text-shadow:0 0 10px rgba(255,196,60,.55);}
  @keyframes superPulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  /* on-board equipment zones (top = Rival, bottom = You) */
  /* equipment sits out of the way on the RIGHT edge (rival top-right, you bottom-right), stacking downward */
  .equipZone{position:absolute; right:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; z-index:3; pointer-events:none; max-width:min(48%,180px);}
  #rivalEquipZone{top:4px;} #youEquipZone{bottom:4px;}
  .equipZone .eq{pointer-events:auto; cursor:pointer; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:104px; max-width:168px; padding:7px 12px; border-radius:11px; background-color:var(--panel); background-size:cover; background-position:center 30%; border:1px solid var(--line); box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .equipZone .eq.buff:not(.hasArt){border-color:rgba(67,192,106,.7); background-image:linear-gradient(180deg,rgba(67,192,106,.16),rgba(20,18,32,.9));}
  .equipZone .eq.debuff:not(.hasArt){border-color:rgba(226,98,74,.7); background-image:linear-gradient(180deg,rgba(226,98,74,.16),rgba(20,18,32,.9));}
  .equipZone .eq.buff.hasArt{border-color:rgba(67,192,106,.85);}
  .equipZone .eq.debuff.hasArt{border-color:rgba(226,98,74,.85);}
  .equipZone .eq.hasArt{border-width:1.5px;}
  .equipZone .eq.hasArt .eqName, .equipZone .eq.hasArt .eqEff, .equipZone .eq.hasArt .eqCtr{text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7);}
  .equipZone .eqName{font-size:13.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; color:#fff;}
  .equipZone .eqEff{font-size:11.5px; opacity:.92; white-space:nowrap; color:#e8edf5;}
  .equipZone .eqCtr{font-size:12px; font-weight:800; opacity:.95; letter-spacing:.5px;}
  .equipZone .eqCtr b{font-size:13.5px;}
  .equipZone .eq.eqFlash{ box-shadow:0 0 0 3px var(--gold), 0 0 22px 6px rgba(255,196,60,.85) !important; transform:scale(1.06); transition:transform .18s ease, box-shadow .18s ease; z-index:5; }   /* counter changed — hold a bright glow so the eye catches it */
  .equipZone .eq.eqSpent{ opacity:.72; filter:grayscale(.35); }
  .equipZone .eq.eqSpent .eqGone{ color:#c9b58a; font-weight:800; letter-spacing:.5px; text-transform:uppercase; font-size:10px; }
  .equipZone .eq.buff .eqCtr{color:var(--good);} .equipZone .eq.debuff .eqCtr{color:var(--bad);}
  .equipZone .eq.targetable{cursor:pointer; outline:2px solid var(--pick); box-shadow:0 0 12px rgba(201,139,255,.75); animation:tgtPulse .9s ease-in-out infinite;}
  .equip{display:flex; gap:5px; flex-wrap:wrap;}
  .equip .e{font-size:10px; font-weight:800; padding:2px 6px; border-radius:10px; border:1px solid var(--line);}
  .equip .e.targetable{cursor:pointer; outline:2px solid var(--pick); box-shadow:0 0 10px rgba(201,139,255,.7); animation:tgtPulse .9s ease-in-out infinite;}
  @keyframes tgtPulse{0%,100%{box-shadow:0 0 6px rgba(201,139,255,.5);}50%{box-shadow:0 0 14px rgba(201,139,255,.9);}}
  .equip .e.buff{color:var(--good); border-color:rgba(67,192,106,.5);}
  .equip .e.debuff{color:var(--bad); border-color:rgba(226,98,74,.5);}

  /* desktop = 3 columns: collapsible log LEFT · fight table CENTER · card description RIGHT */
  /* desktop grid: log (left, full height of the play area) · table · description; hand full-width below */
  #board{flex:1 1 auto; min-height:0; display:grid; gap:10px;
    grid-template-columns:auto minmax(0,1fr) clamp(240px,28vw,380px);
    grid-template-rows:minmax(0,1fr) auto;}
  #board > #logWrap{grid-column:1; grid-row:1;}
  #board > #table{grid-column:2; grid-row:1;}
  #board > #side{grid-column:3; grid-row:1;}
  #board > #handWrap{grid-column:1 / span 3; grid-row:2;}
  #table{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:0; position:relative;}
  #pileLabel{font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.7; min-height:15px;}
  #pile{display:flex; gap:6px; min-height:70px; align-items:center; justify-content:center; flex-wrap:wrap;}
  /* The play area's LEFT rail holds the rival's forms (top), the "last played" stash (middle) and your forms
     (bottom); the RIGHT rail holds the equipment zones. The pile is centred in the whole area, so as it grew it
     started colliding with the stash — worst when the battle log is open and the area is narrow. Reserve both
     rails so the pile centres in the clear band instead. Desktop only: the rails are laid out differently below
     1200px, and phones need every pixel. */
  /* Asymmetric on purpose: the stash is a fixed-width strip on the LEFT (5 x 30px tiny cards + gaps ~176px),
     while the right rail's equip zones sit top/bottom and never met the vertically-centred pile (measured
     267px+ of slack). Reserving both sides squeezed the band enough to wrap the pile at 1440 with the log
     open, so only the left is reserved, and by a fixed amount rather than a vw that grows past its need. */
  /* Keep the pile CENTRED with its label and message, but stop it reaching the rails: narrow the BOX and
     centre it, rather than padding it (padding shifts the content, which put a 1-card pile off-centre — Aj
     caught both). The stash is slimmed to 3-per-row below so this reservation still leaves room for 5 big
     cards even at 1440 with the battle log open. */
  @media (min-width:1200px){ #pile{ width:100%; box-sizing:border-box; max-width:calc(100% - 260px); margin-inline:auto; } }
  #pile .empty{opacity:.4; font-style:italic; font-size:13px;}
  #stackView{display:none; flex-direction:column; gap:3px; align-items:center; margin:3px 0;}
  #stackView .stk{font-size:11px; padding:2px 9px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.05); opacity:.9;}
  #stackView .stk.top{border-color:var(--gold); box-shadow:0 0 8px rgba(232,195,122,.4);}
  #stackView .stk.countered{text-decoration:line-through; opacity:.5;}
  #stackView .stk .who{opacity:.6;}
  #message{font-size:13.5px; text-align:center; min-height:20px; padding:0 8px; max-width:520px;}
  #message b{color:var(--gold);}
  #roundTag{position:absolute; top:6px; left:12px; font-size:11px; font-weight:800; letter-spacing:.4px; opacity:.6;}

  /* --- right column: card description (image on top, text below; fills the column, scrolls long text) --- */
  #side{flex:0 0 clamp(240px,28vw,380px); display:flex; flex-direction:column; gap:8px; min-height:0;
    border-left:1px solid var(--line); padding-left:10px; position:relative;}
  /* big card face on TOP, description text BENEATH (a scrolling column) */
  #cardView{flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px;
    display:flex; flex-direction:column; align-items:stretch; gap:12px; min-height:120px; overflow-y:auto;}
  #cardView .cvEmpty{opacity:.45; font-size:13.5px; font-style:italic; margin:auto; text-align:center;}
  #cardView .card.big{flex:0 0 auto; align-self:center;}
  #cardView .cvBigFace{flex:0 0 auto; width:100%; aspect-ratio:375/523; background-size:contain; background-repeat:no-repeat; background-position:top center; border-radius:12px;}
  #cardView .cvBigArt{flex:0 0 auto; width:100%; aspect-ratio:3/2; background-size:cover; background-position:center; border-radius:12px;}   /* raw illustration (layouts retired) */

  /* STICKY, not duplicated (Aj asked for either a second copy at the top or "one of those floating things").

  .modal .ruleFoot{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center;

  /* deal-in for freshly drawn cards */
  @keyframes dealIn{ from{ opacity:0; transform:translateY(32px) scale(.78) rotate(-5deg);} 60%{opacity:1;} to{ opacity:1; transform:none;} }
  #hand .card.enter{ animation:dealIn .46s cubic-bezier(.2,.85,.25,1.05) both; }
  /* pile cards start off-transform; entrance is driven inline via JS FLIP */
  #pile .card{ transform-origin:center; }
  /* THE PILE IS THE FOCAL POINT and shows at most 5 cards (a straight or a full house), so it has far more room
     than the hand — yet it rendered via .card.sm at a 38x55 base, i.e. SMALLER than the hand's 46x66. Give it
     its own multiplier on top of --cs. Kept modest on phones, where 5 cards across 390px is the binding
     constraint, and generous from tablet up. */
  #pile .card{ width:calc(38px*var(--cs)*var(--pm)); height:calc(55px*var(--cs)*var(--pm)); border-radius:calc(8px*var(--cs)*var(--pm)); }
  #pile .card .r, #pile .card .s{ font-size:calc(13px*var(--cs)*var(--pm)); }
  #pile .card .c{ font-size:calc(19px*var(--cs)*var(--pm)); }
  #pile .card.faced .idx{ font-size:calc(11px*var(--cs)*var(--pm)); padding:1px 4px 2px; }
  #pile .card .efi{ width:calc(13px*var(--cs)*var(--pm)); height:calc(13px*var(--cs)*var(--pm)); }
  #pile .card .qbadge{ font-size:calc(8px*var(--cs)*var(--pm)); }
  /* boosted / reduced plays get a glowing border so a play's effective value reads at a glance */
  #pile.boosted .card{ border-color:rgba(95,220,255,.95); box-shadow:0 0 11px 2px rgba(95,220,255,.7); animation:pileGlowUp 1.5s ease-in-out infinite; }
  #pile.reduced .card{ border-color:rgba(255,110,110,.95); box-shadow:0 0 11px 2px rgba(255,110,110,.7); animation:pileGlowDn 1.5s ease-in-out infinite; }
  @keyframes pileGlowUp{ 0%,100%{ box-shadow:0 0 8px 1px rgba(95,220,255,.55); } 50%{ box-shadow:0 0 15px 4px rgba(95,220,255,.9); } }
  @keyframes pileGlowDn{ 0%,100%{ box-shadow:0 0 8px 1px rgba(255,110,110,.55); } 50%{ box-shadow:0 0 15px 4px rgba(255,110,110,.9); } }
  @media (prefers-reduced-motion: reduce){

    #pile .card{ transition:none !important; }

   * what buried peek's controls — they lift themselves above the overlay, and their lifts were bare numbers. */
  .overlay{position:fixed; inset:0; background:rgba(10,4,16,.8); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:var(--zOverlay); padding:20px;}

  /* --- phone: ONE fixed screen. The pile stays up top and the hand stays pinned at the bottom;

  @media (max-width:720px){
    /* phone: log sits beside the play area only (bounded height, scrolls); hand + description span FULL width below it */
    /* the play area sizes to its CONTENT (min-content floor) so #message can never collapse and spill onto the hand;
       if the whole board can't fit a short viewport, main scrolls instead of overlapping (the description row is what scrolls off, never the hand). */
    main{overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;}
    /* minmax(0,...), NOT minmax(min-content,...). With a min-content floor the play row grows to whatever its
       tallest child needs, and #log has no natural height — measured at 360x740, an open battle log made that
       row **4218px** inside a 740px viewport and pushed the hand clean off the screen with no way to scroll to
       it, so opening the log made the game unplayable. The landscape band below already carried this fix and
       named the cause in its comment; both portrait blocks were simply never updated. */
    #board{grid-template-columns:auto minmax(0,1fr); grid-template-rows:minmax(0,1fr) auto auto;}
    #board > #logWrap{grid-column:1; grid-row:1;}          /* just the play-area row — never runs alongside the hand/description */
    #board > #table{grid-column:2; grid-row:1;}
    #board > #handWrap{grid-column:1 / span 2; grid-row:2;}   /* full width */
    #board > #side{grid-column:1 / span 2; grid-row:3;}       /* full width */
    #logWrap:not(.collapsed){width:clamp(160px,42vw,230px);}  /* expanding only narrows the play area now, not the hand/description */
    /* collapsed rail is short on phones — a vertical "Battle Log" clips to "…LE LOG", so shorten it to "LOG" here */
    #logWrap.collapsed #logHead > span:first-child{font-size:0;}
    #logWrap.collapsed #logHead > span:first-child::before{content:'LOG'; font-size:10px; letter-spacing:1.5px;}
    #table{min-height:96px; padding:4px 0;}
    .equipZone{max-width:min(54%,150px);} .equipZone .eq{min-width:0; padding:5px 9px;} .equipZone .eqName{font-size:12px; max-width:128px;} .equipZone .eqEff{font-size:10px;} .equipZone .eqCtr{font-size:11px;} .equipZone .eqCtr b{font-size:12px;}
    #side{height:clamp(132px,20vh,172px); flex-direction:row; align-items:stretch; border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:8px;}
    #cardView{flex:1 1 auto; flex-direction:row; align-items:flex-start; gap:10px; padding:10px 12px;}   /* image left, text right (strip) */
    #cardView .cvBigFace{display:none;}                                  /* mobile: hide the full layout (its printed text is unreadable at strip size) */
    #cardView .cvBigArt{display:block; flex:0 0 auto; align-self:stretch; height:100%; width:auto; aspect-ratio:3/2; background-size:cover; background-position:center; border-radius:10px;}   /* show the raw art on the left, text to the right */
    #cardView .card.big{width:46px;height:66px;} #cardView .card.big .r{font-size:15px;} #cardView .card.big .s{font-size:15px;} #cardView .card.big .c{font-size:24px;}
    #cardView .cvText{flex:1 1 0; width:auto; min-width:0;}
    #cardView .cvName{font-size:14.5px;} #cardView .cvType{font-size:11px; margin:2px 0 5px;} #cardView .cvBody{font-size:12.5px; line-height:1.45;}
    #cardActivate{left:12px; top:12px; bottom:auto; width:32px; height:32px;}   /* corner badge on the strip image */
    #handWrap{border-top:1px solid var(--line);}
    #actions{flex-wrap:wrap;}
    #hint{flex:1 0 100%; order:-1; margin:0 0 6px;}
    #hand{max-height:22dvh;}
  }
  @media (max-width:480px){
    #actions button{padding:9px 12px; font-size:14px;}
    #sortBtn{padding:9px 11px;}
  }
  @media (max-width:380px){ .card{width:40px;height:58px;} .card .c{font-size:20px;} .card.big{width:52px;height:76px;} }
  /* really tight (short) phones + landscape: the inline description strip eats scarce vertical space, so drop it and
     offer a "🔍 View card" button that opens the full-screen reader instead (the whole page becomes the description box). */
  @media (max-width:720px) and (max-height:800px){
    #board{grid-template-rows:minmax(0,1fr) auto;}   /* no description row — reclaim its height. minmax(0,…): see the note above */
    #board > #side{display:none;}
    #viewCardBtn{display:inline-block;}
  }

  /* --- LANDSCAPE / SHORT VIEWPORT ------------------------------------------------------------------------
     A phone held sideways is ~844x390, which MISSES the phone branch above entirely (that gate needs
     max-width:720px) and therefore got the full DESKTOP layout inside 390px of height. Measured at 844x390
     before this block: header 56 + hand region 213 left the play area **57px** tall — and a card is 66px, so
     the pile could not render a single card. On a 667x375 SE it was worse: the hand and the whole action bar
     sat **136px BELOW the viewport**, unreachable, because the phone branch's `minmax(min-content,1fr)` let
     the hand force its own minimum and push everything down.
     Height is the scarce axis in landscape and width is abundant, so this block buys height back from the
     chrome instead of rescaling the page: a slimmer header, tighter gaps, shorter action buttons, and a hand
     capped by dvh. Cards shrink via --cs, but --pm is raised to compensate so the PILE stays near full size —
     that is the thing you actually read mid-play, and it is the part that had no room at all.
     Comes AFTER the phone branch on purpose: at 667x375 both match, and this one must win. */
  @media (orientation:landscape) and (max-height:520px){
    :root{ --headerH:37px; }        /* measured: the landscape header is 37px, so a hardcoded 54px floated 17px low */
    :root{ --cs:.82; --pm:1.15; }                              /* pile = .82 x 1.15 = .94, near full size */
    header{padding:3px 10px; gap:6px;}
    header h1{font-size:13px;}
    header h1 small{display:none;}
    header button{padding:4px 8px; font-size:12px;}
    header select{padding:4px 7px; font-size:12px;}
    header .diffWrap{font-size:10px;}
    main{padding:4px 8px 0; gap:4px;}
    #board{gap:6px; grid-template-rows:minmax(0,1fr) auto;}    /* minmax(0,...) — min-content was the SE overflow */
    #handWrap{padding:4px 8px 5px;}
    /* #handMeta (your name, shields, energy, deck, shuffle pile) measured 67px — it WRAPS to two rows on a
       narrow landscape phone, and it was the single biggest consumer of the height the play area needed.
       The inner .fighter span carries an inline padding, hence the !important. */
    #handMeta{font-size:11px; gap:5px; margin:0 3px 4px;}
    #handMeta .fighter{padding:2px 5px !important; gap:6px !important;}
    #handMeta .stat, #handMeta .deckName{font-size:10.5px;}
    #handMeta .shields{gap:3px;}
    #handMeta .shields .s{width:11px; height:14px;}
    #hand{max-height:32dvh; padding:13px 6px 4px; gap:5px;}    /* 13px top still clears the hover lift */
    #actions{margin-top:4px; gap:6px;}
    #actions button{padding:6px 11px; font-size:13px; border-radius:9px;}
    #hint{font-size:11.5px; min-height:13px;}
    #pileLabel{font-size:11px; min-height:13px;}
    #pile{min-height:56px;}
    #message{font-size:12px; min-height:15px;}
    #roundTag{font-size:10px;}
    #table{gap:4px;}
  }
  /* Roomier landscape (>=380px tall: the common 844x390 and 932x430 iPhones). The 360-375px devices need
     every pixel, but these have slack in the play area once the chrome is slimmed — measured 140px and 263px
     of play area at --cs:.82 — so spend it on card size. Same "cards look smol" reasoning as the desktop
     steps, applied to the axis that is actually free here. */
  @media (orientation:landscape) and (min-height:380px) and (max-height:520px){
    :root{ --cs:.9; --pm:1.35; }
  }
  /* The FLOOR: 568x320 — iPhone 5/5s/SE-1st and the iPod touch 7th gen (sold until 2022) are all this size
     in landscape. Aj: "no phone is that thin" — 640x360 does pass, but these do exist, and at 320px tall the
     hand region wanted 206px of it (64%) and the pile drew 34px over the hand. Everything here is a straight
     trade of detail for reachability; below this we stop claiming support. */
  /* Also below the floor: NARROW and short. 640x360 was left with 2px of pile-to-hand clearance and no
     honest way to buy more — every candidate (inlining the hint, growing the row, min-content tracks) was
     measured and made something else worse. 800x360 is equally short but WIDE, and fits with 13px to spare,
     so the rule is narrow-and-short, not just short. */
  @media (orientation:landscape) and (max-height:364px) and (max-width:720px){
    #board{grid-template-rows:auto auto; overflow-y:auto; overscroll-behavior:contain;}
  }
  @media (orientation:landscape) and (max-height:340px){
    /* At 568px wide BOTH #handMeta and #actions wrap to two rows, so the hand region wanted 199px of a 320px
       viewport and the play area's 1fr track collapsed to 32px for 96px of content — the pile drew over the
       hand. Making it genuinely fit would mean hiding real controls (the ♻ shuffle-pile button, the stat
       readouts), which is the wrong trade for a 2016 device.
       So below 340px we stop fighting for a single screen and DEGRADE GRACEFULLY: the rows go content-sized
       and the board scrolls. Nothing is ever drawn on top of anything, everything stays reachable, and the
       same fallback covers a desktop window dragged to any absurd height — which is otherwise unbounded. */
    #board{grid-template-rows:auto auto; overflow-y:auto; overscroll-behavior:contain;}
    #handMeta{font-size:10px; gap:4px; margin:0 2px 2px;}
    #handMeta .shields .s{width:9px; height:11px;}
    #actions{margin-top:3px;}
    #actions button{padding:4px 7px; font-size:11.5px;}
    #pileLabel{font-size:10px; min-height:11px;}
    #pile{min-height:40px;}
    #table{gap:3px;}
  }
  /* Narrow AND short — a small phone sideways (667x375 SE). Below 721px the action bar loses its desktop
     spacer and WRAPS to two rows, which cost 25px and pushed a 5-card pile into the hand with the battle log
     open. Shrink the buttons enough to keep one row. */
  /* TWO COLUMNS FOR THE SIGNALLING PAIR (v1.31.48). Height is the scarce axis here and width is abundant —
     measured ~1000px of empty screen either side of a centred QR — so the code box and its buttons move
     BESIDE the symbol instead of under it. That is what actually gets Copy above the fold; capping the QR's
     size (v1.31.47) bought 15% of the height back and still left the button below it.
     The QR column has a DEFINITE width on purpose. `qrInto` measures .qrWrap, and a shrink-to-fit flex item
     would hand it the canvas's own 300px default — the exact trap this file already records — and worse, once
     the canvas sets its own CSS width the wrapper would shrink to match, ratcheting the symbol smaller on
     every resize. A fixed basis breaks that feedback entirely. */
  @media (orientation:landscape) and (max-height:520px){
    #netroot .sigPair{display:flex; gap:12px; align-items:flex-start;}
    #netroot .sigPair > .sigPairQR{flex:0 0 235px; max-width:235px;}
    #netroot .sigPair > .sigPairCode{flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:6px;}
    #netroot .sigPair .sigbox{margin:0;}
    #netroot .sigPair .netbtn{margin:0;}
  }
  @media (orientation:landscape) and (max-height:520px) and (max-width:720px){
    #actions{gap:4px;}
    #actions button{padding:5px 8px; font-size:12px; border-radius:8px;}
    /* The hint takes its OWN line, pinned to one line. All three arrangements were measured: inline-and-
       wrapping gave a 63px bar, inline-and-clipped still gave 63px (it squeezes the buttons), own-line gives
       55px. Own line wins, and `nowrap` keeps it from ever becoming two. */
    #hint{font-size:11px; flex:1 1 100%; order:9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    /* And pin #message to one line for the same reason. It renders 26px instead of 13px whenever its text
       wraps, the text depends on game state, and at 640x360 there were only 8px of clearance — so the wrap
       was an intermittent overlap (1 failure in 8 suite runs). Removing the VARIABILITY is cheaper than
       absorbing it: making the row grow instead (minmax(min-content,1fr) + a scrolling board) was measured
       and put the action bar 11-117px below the fold on every device, which is far worse than an ellipsis on
       the one screen size where a long message does not fit. The full text is always in the battle log. */
    #message{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
    /* Five opponent panels at min-width:130px need 690px+ and so WRAPPED to two rows at 667px — measured a
       172px opponents strip in a 6-player game, which put the action bar 60px below the viewport. Compact
       them enough that a full table fits one row (5 x 88 + gaps = ~484 of 667). */
    /* With a 6-player strip (69px even compacted) the play area is only 96px, and the pile's own column
       measured 109px of content — it overflowed the grid track into the hand. Ease the pile back to its
       unmultiplied size here; 667x375 is the smallest landscape device we support and it cannot afford the
       bigger pile the roomier sizes get. */
    :root{ --pm:1; }
    #pile{min-height:44px;}
    #message{font-size:11px; min-height:13px;}
    #opponents{gap:4px;}
    .oppPanel{min-width:88px; max-width:150px; padding:4px 6px; gap:2px; font-size:10px; border-radius:9px;}
    .oppPanel .oppName{font-size:11px;}
    .oppPanel .oppSeat{display:none;}                                   /* the name already identifies the seat */
    .oppPanel .oppShields{gap:2px;}
    .oppPanel .oppShields .s{width:9px; height:12px;}
    .oppPanel .oppStats{gap:5px;}
    /* 667x375 with SIX players is the hardest case in the game: the opponents strip (69px even compacted)
       left the play-area grid track 49px for 96px of content, so the pile drew over the hand. Lay each panel
       out as a single ROW — name + shields — and drop the per-seat stat line. The detail is still one tap
       away: tapping a panel expands it (the B1 zone-targeting work). Nothing else is small enough to cut. */
    .oppPanel{flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap;}
    .oppPanel .oppStats{display:none;}
    .oppPanel .oppTop{flex:1 1 auto; min-width:0;}
  }
</style>
</head>

<script>
/* ==== ENGINE (inlined) ==================================================== */
__ENGINE__
/* ==== AI (inlined) ======================================================== */
__AI__
/* ==== CARD ART (inlined; cardId -> illustration data URI) ================== */
__ART__
/* ==== CARD FACES (inlined; cardId -> full card-face data URI) ============== */
__FACES__
/* ==== NETVIEW (inlined; per-seat redacted snapshots for netplay) =========== */
__NETVIEW__
__QR__
/* ==== UI =================================================================== */
(function(){
  'use strict';
  var E=window.CardmenEngine, AI=window.CardmenAI;
  E.setDeferRoundDraw(true);   // the UI draws the new round's cards AFTER the end-of-round hand-limit trim (see resolveRoundCeremony)
  E.setShieldCards(true);      // CATCH-UP M1: shields are cards — a broken shield returns to its owner's hand (the trailing player refuels)
  E.setLoserMill(true);        // CATCH-UP M2: the round's loser mills (winning-play size) cards into their Energy Pile (energy parity; deck-out guarded)
  E.setSpecialLossMode('chosen'); // MP: on a Special win the victor strips ONE chosen rival's shield (not the whole table). No-op at 2p.
  E.setMillScope('targeted');     // MP: only the struck rival(s) mill catch-up cards, not every non-winner. No-op at 2p. (Cutthroat combo — flattens 3–6p balance; see CARD-STATS.md.)
  /* The build stamp. Substituted by build.js from README.md's `**Status:**` line — see the note there. It
   * exists because a downloaded single-file game is otherwise indistinguishable from a stale copy of itself:
   * Aj reported a missing name field that had shipped two versions earlier, and nothing on screen could have
   * told him. Shown where a bug report is actually taken from — the setup dialog and the netplay lobby bar. */
  var GAME_VERSION='__VERSION__';
  function verTag(){ return '<span class="verStamp" title="Build version — quote this in a bug report">'+GAME_VERSION+'</span>'; }
  var YOU=0, RIVAL=1;
  var SUIT_SYMBOL={C:'♣',D:'♦',H:'♥',S:'♠'};
  var TYPE={single:'Jab',pair:'Pair',trio:'Trio',straight:'Straight',flush:'Flush',fullhouse:'Full House',kit:'Consecutive Pairs',twopair:'Two Pair',quadro:'Four of a Kind',trioone:'Trio + 1',fourtwo:'Four + 2',airplane:'Consecutive Trios'};
  /* Consecutive pairs are the first VARIABLE-LENGTH shape, so a fixed name is not enough — a run of two pairs and
   * a run of three are different plays. Where the combo object is in hand, say which; the bare TYPE entry
   * covers the call sites that only carry a type string. */
  function comboName(combo){
    if(!combo) return 'Special';
    /* "2 Consecutive Pairs", not "2 Pairs": the non-consecutive shape is "Two Pair" on the board, and two names
     * that differ by an S would be unreadable in a log line. The panel makes the same distinction in its
     * segments, so the board and the rules now say the same thing. */
    if(combo.type==='kit') return (combo.size/2)+' Consecutive Pairs';
    return TYPE[combo.type]||'Special';
  }
  var REWORK_LABEL={1:'A',11:'J',12:'Q',13:'K'};                                // REWORK playtest: ranks show as A/J/Q/K on the 2-as-apex ladder
  function rankLabel(r){ return REWORK_LABEL[r]||r; }
  function cardSym(c){ return rankLabel(c.rank)+SUIT_SYMBOL[c.suit]; }          // deck reads 3..10,J,Q,K,A,2 under REWORK (else 1..10)
  function energyChips(pl){ var s=E.SUITS.map(function(su){ var n=E.countSuit(pl.energy,su); return n?('<span class="nrgS'+(red(su)?' red':'')+'">'+n+SUIT_SYMBOL[su]+'</span>'):''; }).join(''); return s || '<span class="nrgS nrgZero">0</span>'; }
  function energyBreakdown(pl){ return 'Energy by suit — '+E.SUITS.map(function(s){ return E.countSuit(pl.energy,s)+SUIT_SYMBOL[s]; }).join('  '); }
  function cardSymList(cards){ return cards.map(cardSym).join(', '); }         // "5♠, 6♥, 7♠"
  function kindLabel(t){ return t==='single' ? 'Jab' : 'Special '+TYPE[t]; }   // short label for the corner tag / hints
  function kindPhrase(t){ return t==='single' ? 'a Jab' : 'a Special - '+TYPE[t]; }  // sentence form for the center announcement

  // fight play → phrase after "played ":  "a Jab - 4♥"  /  "a Special - Straight (5♠, 6♥, 7♠, 8♥, 9♦)"
  function playPhrase(combo){
    if(combo.type==='single') return 'a Jab - '+cardSym(combo.cards[0]);
    return 'a Special - '+comboName(combo)+' ('+cardSymList(combo.cards)+')';
  }
  // effect activation → phrase after "played ", from the card: "a Technique - 2♦ Book Smarts — Draw 3 cards"
  function effPhrase(card){
    var eff=card?E.effectOf(card):null;
    if(!eff) return 'a Technique'+(card?' - '+cardSym(card):'');
    var art=/^[AEIOU]/i.test(eff.type)?'an':'a';   // "an Equipment", "a Technique"
    return art+' '+eff.type+' - '+cardSym(card)+' '+eff.name+' — '+(eff.text||'').replace(/\.$/,'');
  }
  var state=null, selected={}, busy=false, gen=0, fullLog=[];
  var enterDelayBase=0;              // ms offset added to drawn-card deal-in, so a round's new cards arrive on the "Round N" beat
  var ROUND_BEAT=750, ROUND_HOLD=1350;   // ceremony timing (ms): each pre-card beat, and the Round-N card hold
  var handOrder=[];            // UI display order of card ids (Sort reorders this)
  var layout=[], gidSeq=0, drag=null, tapTimer=null, tapPendingGid=null, justDragged=false;   // hand shown as draggable groups (combos)
  var sortState='unsorted';   // current hand arrangement; the Sort button label reflects THIS. Reverts to 'unsorted' when a fresh card is drawn.
  var SORT_NEXT={ unsorted:'singles', singles:'pairs', pairs:'straights', straights:'singles' };   // click cycles among the three sorts
  var SORT_TITLE={ unsorted:'Sort: Unsorted', singles:'Sort: Singles', pairs:'Sort: Pairs', straights:'Sort: Straights' };
  var HINTS_KEY='cmf_hints_v1';
  var hintsOn=false; try{ hintsOn = localStorage.getItem(HINTS_KEY)==='1'; }catch(e){}   // play hints — DEFAULT OFF (opt-in guidance)
  var PULSE_KEY='cmf_pulse_detail_v1';
  var pulseDetail=false; try{ pulseDetail = localStorage.getItem(PULSE_KEY)==='1'; }catch(e){}   // detailed energy pulses — DEFAULT OFF (net delta); Settings toggles it
  var pick=null;               // active selection: {kind:'discard'|'top', cardId, need, chosen:{}}
  var formsOpen=null;          // which Forms & Rides zone is expanded to full cards — a seat key like 'p0'/'p2', or null (collapsed to chips)
  var oppOpen=null;            // which opponent PANEL is expanded to real zones in a free-for-all (seat index, or null)
  function zoneKeyFor(seat){ return 'p'+seat; }
  function collapseForms(){ if(formsOpen!==null){ formsOpen=null; render(); } }
  var targeting=null;          // {cardId} while choosing an equipment to remove
  var pileSig=null;            // signature of the pile currently rendered (skip rebuild/re-animate)
  var flipFrom=null;           // {cardId: DOMRect} captured from the hand for a play-to-pile FLIP

  var equipFx={}, equipFxClear=null;   // zoneKey:id -> { counters, flashUntil, name, good, card, gone } — drives the counter-change / spent flash

  function buildEqBox(e, info, opts){
    opts=opts||{};
    var box=document.createElement('div'); box.className='eq '+(info.good?'buff':'debuff')+(opts.flash?' eqFlash':'')+(opts.ghost?' eqSpent':'');

  function renderEquipZone(el, pl, mine, seat){
    if(!el) return;
    el.innerHTML='';
    if(typeof seat!=='number') seat=(mine?YOU:RIVAL);
    var zk=zoneKeyFor(seat)+':', now=Date.now(), live={}, flashing=false;   // per-SEAT fx key: 'rival' collided across opponents
    (pl.equipment||[]).forEach(function(e){
      var info=equipInfo(e, mine, seat), key=zk+e.id, prev=equipFx[key];
      var flashUntil=prev?prev.flashUntil:0;
      if(prev && e.counters<prev.counters) flashUntil=now+1300;                          // a counter just dropped → flash the box
      equipFx[key]={ counters:e.counters, flashUntil:flashUntil, name:e.name, good:info.good, card:e.card, gone:false };
      live[key]=true;
      var flash=now<flashUntil; if(flash) flashing=true;
      el.appendChild(buildEqBox(e, info, { flash:flash }));
    });
    for(var key in equipFx){                                                             // a tracked equip that vanished = spent to 0 & retired → brief "spent" ghost
      if(!equipFx.hasOwnProperty(key) || key.indexOf(zk)!==0 || live[key]) continue;
      var f=equipFx[key];
      if(!f.gone){ f.gone=true; f.flashUntil=now+1300; }
      if(now<f.flashUntil){ el.appendChild(buildEqBox({ id:key, name:f.name, counters:0, card:f.card }, { good:f.good }, { ghost:true, flash:true })); flashing=true; }
      else delete equipFx[key];
    }
    if(flashing) scheduleEquipFxClear();
  }

  /* ---- pile entrance: FLIP played cards from the hand (you) or slide from above (rival) ---- */
  function animatePileEntrance(byPlayer){
    var pileEl=$('pile'), kids=pileEl.children;
    if(reduceMotion()){ flipFrom=null; return; }
    var n=kids.length;
    Array.prototype.forEach.call(kids, function(el, i){
      var id=el.dataset.id; if(!id) return;
      var last=el.getBoundingClientRect();
      var from=flipFrom && flipFrom[id];
      var dx, dy, sc, fadeFrom;
      if(from){                                   // true FLIP from the card's slot in your hand
        dx=from.left-last.left; dy=from.top-last.top; sc=from.width/last.width || 1; fadeFrom=1;
      } else {                                    // rival (or dealt) card slides in from their side
        dy=(byPlayer===RIVAL?-1:1)*130; dx=(i-(n-1)/2)*10; sc=.62; fadeFrom=0;
      }
      el.style.transition='none';
      el.style.opacity=fadeFrom;
      el.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
      var delay=i*60;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        el.style.transition='transform .42s cubic-bezier(.2,.8,.25,1) '+delay+'ms, opacity .32s '+delay+'ms';
        el.style.transform=''; el.style.opacity='1';
      }); });
    });
    flipFrom=null;
  }

  /* ---- battle log ---- */
  /* "Am I still following the newest entry?" The slack exists so ONE tall entry appearing does not drop you out
   * of auto-follow — but as a flat 80px it was wrong whenever the log overflowed by LESS than that: every
   * scroll position then reads as "at the bottom", so `setLogNewBtn(true)` is unreachable and the ↓ New button
   * can never appear. Measured on desktop with a real game: 13 lines overflow by 23px, and scrolled fully to
   * the TOP the old test still returned true. Aj found it (2026-08-29) — reported as a netplay gap, reproduces
   * in solo, because this is shared code.
   * The slack is therefore capped by how far the log can actually scroll: never more than half the range, so
   * "top" and "bottom" stay distinguishable no matter how short the history is. */
  function logAtBottom(){
    var l=$('log'), max=l.scrollHeight-l.clientHeight;
    if(max<=0) return true;                                     // nothing to scroll — you are always at the newest
    return (max - l.scrollTop) < Math.min(80, max/2);
  }
  function setLogNewBtn(show){ var b=$('logNewBtn'); if(b) b.classList.toggle('show', show); }
  function scrollLogToBottom(){ var l=$('log'); l.scrollTop=l.scrollHeight; setLogNewBtn(false); }
  // Reader-relative name for a seat in OUR frame: yourself is "You", and a duel's opponent is "Rival"
  // rather than "P2" (seatName is the raw seat label and does not know about duels).
  function logName(i){ return i===YOU ? 'You' : (nameOf(i) || (MP() ? ('P'+(i+1)) : 'Rival')); }
  /* Narrate a GAME EVENT. `actor` is the absolute seat acting, or null for a neutral line.
   * The template carries a `{who}` placeholder instead of a baked-in name, because phrasing is
   * reader-relative — the same event is "You played" to the actor and "Rival played" to everyone else.
   * Locally it renders in our own frame; as netplay host it ALSO broadcasts the template so each client
   * can render it in theirs. Without this a client's battle log was empty all game, even for its own moves. */
  /* `foes` is a list of SEATS, never names. A name baked in by the speaker cannot be re-framed by the reader —
   * that is the whole bug this replaces. `{foe}` is resolved on each end, in that end's own frame. */
  function foeText(foes){
    var list=(foes||[]).filter(function(q,i,a){ return q!=null && a.indexOf(q)===i; });
    if(!list.length) return '';
    return list.map(function(q){ return logName(q); }).join(' & ');
  }
  function say(actor, tpl, cls, foes){
    var txt=tpl.replace(/\{who\}/g, actor==null ? '' : '<b>'+logName(actor)+'</b>')
               .replace(/\{foe\}/g, '<b>'+foeText(foes)+'</b>');
    logMsg(txt, cls);
    if(typeof NET!=='undefined' && NET.sayBroadcast) NET.sayBroadcast(actor, tpl, cls, foes);
  }
  function logMsg(html, cls){
    var l=$('log'); var stick=logAtBottom();           // only auto-follow if you're already at the newest entry
    var d=document.createElement('div'); d.className='le'+(cls?' '+cls:''); d.innerHTML=html;
    fullLog.push(d.textContent);                       // uncapped plain-text history, for the Save button
    l.appendChild(d); while(l.children.length>80) l.removeChild(l.firstChild);
    if(stick){ l.scrollTop=l.scrollHeight; requestAnimationFrame(function(){ l.scrollTop=l.scrollHeight; }); }   // follow the newest (defer once so a tall entry's height is settled)
    else setLogNewBtn(true);   // reading history? don't yank — flag "↓ New" instead
  }
  function downloadLog(){
    var head=['Cardmen Fighter — Battle Log','You: '+deckLabel(youDeck)+'   vs   Rival: '+deckLabel(rivalDeck)];
    if(state) head.push('Reached Round '+state.round+(state.finished?(' — '+(state.winner===YOU?'YOU WON':'Rival won')):''));

    /* THE TRACE GOES IN THE SAVE FILE. Aj's saved logs were the only evidence that characterised the fork, and

    try{

    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }

  // An effect is activatable if it's your turn, the selected card carries a proactive effect you

  function activatableCard(card){
    if(!card || state.turn!==YOU || state.finished || busy || pick || targeting || targetPick) return false;
    var eff=E.effectOf(card);
    if(!eff || !eff.impl || eff.kind==='phantasm') return false;   // quicks are proactively castable now (fizzle if no target)

  // Why the effect can't be activated right now (a short reason), or null if it can. Assumes
  // activatableCard(card) is already true. This decides whether the shown button is GREYED OUT.
  function activateBlock(card){
    var eff=E.effectOf(card);
    if(E.isLocked(state, YOU)) return 'Locked out this round (Back Stab).';
    if(eff.kind==='transform' && E.transformGateStatus){                       // REWORK: transform is gated by shields lost
      var gs=E.transformGateStatus(state, YOU, eff.tier);
      if(!gs.ok) return (gs.gate==='table'?'Locked — the table must lose '+gs.need+' shields first':'Locked — you must lose '+gs.need+' shields first')+' ('+gs.have+'/'+gs.need+').';
    }
    var _cd=E.rideCostDelta?E.rideCostDelta(state, YOU, card):0;
    if(!E.canAfford(state.players[YOU], card, _cd)) return 'Not enough energy — need '+E.costHint(card, _cd)+'.';
    if(eff.pitchHigh){                                                        // REWORK: Ultima Attack / Armor Piercing pitch a Broadway card as an extra cost
      var _pa=state.players[YOU].hand.some(function(c){ return c.id!==card.id && (c.rank===1||c.rank===10||c.rank===11||c.rank===12||c.rank===13); });
      if(!_pa) return 'Needs a Broadway card (10, J, Q, K, or A) in hand to discard as an extra cost.';
    }
    if(eff.kind==='removeEquip' && (E.removeTargets?E.removeTargets(state, YOU, eff):E.equipTargets(state, YOU)).length===0) return 'No Equipment or zone card to target.';
    if(eff.kind==='counterfeit' && (!state.pile || state.pile.byPlayer===YOU)) return 'No Rival play to copy right now.';
    // fizzle guardrails: don't let you burn a Quick that would do nothing on your own turn
    if(eff.kind==='counter') return 'Nothing to counter — hold it to answer a Rival Technique.';
    if(eff.kind==='protect' && state.players[YOU].equipment.length===0) return 'No equipment of yours to protect.';

  // ---- instant click/tap tooltip (also works on greyed buttons, unlike native title) ----

  // ===== HAND GROUPING + DRAG (drag cards together into a combo, drag up into the play area to play) =====
  function newGid(){ return ++gidSeq; }
  function groupById(gid){ for(var i=0;i<layout.length;i++) if(layout[i].id===gid) return layout[i]; return null; }
  // Only matched-rank sets (pair/trio) and full houses can be BUILT by drag (straights/flushes are Sort-only).
  function groupKindKF(cards){
    if(cards.length===1) return 'single';
    var combo=E.detectCombo(cards);
    if(combo){ if(combo.type==='pair'||combo.type==='trio') return 'set'; if(combo.type==='fullhouse') return 'fullhouse'; if(combo.type==='straight') return 'straight'; }
    return 'invalid';
  }
  function canMergeKF(a,b){ var k=groupKindKF(a.concat(b)); return k==='set'||k==='fullhouse'; }
  function orderGroupCards(cards){
    var byR={}; cards.forEach(function(c){ (byR[c.rank]=byR[c.rank]||[]).push(c); });
    var ranks=Object.keys(byR).sort(function(a,b){ return byR[b].length-byR[a].length; });   // trio before pair (full house layout)
    var out=[]; ranks.forEach(function(r){ byR[r].sort(function(x,y){ return E.SUITS.indexOf(x.suit)-E.SUITS.indexOf(y.suit); }); out=out.concat(byR[r]); });

  }
  var COMBO_LABEL={ pair:'Pair', trio:'Trio', fullhouse:'Full House', straight:'Straight', flush:'Flush' };
  function groupLabel(cards){ var c=E.detectCombo(cards); return c?(COMBO_LABEL[c.type]||'Combo'):'Group'; }
  // Sync layout to the engine hand: drop played cards, split now-invalid groups, add new draws (in hand order).
  function reconcileLayout(){
    var byId={}; state.players[YOU].hand.forEach(function(c){ byId[c.id]=c; });
    var seen={}, out=[];
    layout.forEach(function(g){
      var remaining=g.cards.filter(function(c){ return byId[c.id] && !seen[c.id]; }).map(function(c){ return byId[c.id]; });
      remaining.forEach(function(c){ seen[c.id]=true; });
      if(!remaining.length) return;
      if(remaining.length>1 && groupKindKF(remaining)==='invalid') remaining.forEach(function(c){ out.push({id:newGid(),cards:[c]}); });
      else out.push({id:g.id, cards:remaining});
    });
    orderedHand().forEach(function(c){ if(!seen[c.id]){ out.push({id:newGid(),cards:[c]}); seen[c.id]=true; } });
    layout=out;
  }
  function mergeGroups(aGid, bGid){
    var a=groupById(aGid), b=groupById(bGid); if(!a||!b) return;
    var idxB=-1; for(var i=0;i<layout.length;i++) if(layout[i].id===bGid){ idxB=i; break; }
    var merged={ id:newGid(), cards:orderGroupCards(b.cards.concat(a.cards)) };
    layout=layout.filter(function(g){ return g.id!==aGid && g.id!==bGid; });
    if(idxB<0||idxB>layout.length) idxB=layout.length;
    layout.splice(idxB,0,merged);
    merged.cards.forEach(function(c){ selected[c.id]=true; });   // a freshly built combo is selected, ready to fight/read
  }
  function breakGroup(gid){
    var g=groupById(gid); if(!g||g.cards.length<2) return;
    var idx=-1; for(var i=0;i<layout.length;i++) if(layout[i].id===gid){ idx=i; break; }
    g.cards.forEach(function(c){ delete selected[c.id]; });   // a broken group is deselected
    var pieces;
    if(groupKindKF(g.cards)==='fullhouse'){                   // a full house breaks into its Trio + Pair (not five singles)
      var byR={}; g.cards.forEach(function(c){ (byR[c.rank]=byR[c.rank]||[]).push(c); });
      var trio=[], pair=[];
      Object.keys(byR).forEach(function(r){ if(byR[r].length===3) trio=byR[r]; else pair=byR[r]; });
      pieces=[{id:newGid(),cards:orderGroupCards(trio)},{id:newGid(),cards:orderGroupCards(pair)}];
    } else {
      pieces=g.cards.map(function(c){ return {id:newGid(),cards:[c]}; });
    }

  function breakAllGroups(){
    var out=[]; layout.forEach(function(g){ if(g.cards.length>1) g.cards.forEach(function(c){ out.push({id:newGid(),cards:[c]}); }); else out.push(g); });
    layout=out;
  }
  // REWORK: glow a hand card whose effect a Form in your zone is currently empowering.

  // REWORK: gold pulse on a J/Q/K in hand when it can be transformed RIGHT NOW

  function markTransform(el, c){
    if(!state || !E.transformGateStatus) return;

  function renderHand(yourTurn){
    if(drag && drag.moved) return;                    // don't rebuild the hand mid-drag

    hand.className=((pick||yourTurn)?'':'disabled')+(lockedRead?' tutlock':'');
    var canEnter=!reduceMotion(), enterIdx=0;
    if(pick){                                          // pick mode: flat individual cards, no grouping/drag

        cardrow.appendChild(el);
      });

  function canHumanPlay(cards){

  // Shared by the Fight button and drag-to-play.
  /* A CLIENT NEVER PLAYS LOCALLY — it sends an intent and waits for the host's mirror. ONE definition, called
   * from both entry points, because the per-entry-point version is exactly how this broke: `doFight` carried a
   * copy and the drag-to-play release did not, so a dragged play ran the local engine, never reached the host,
   * and left the client narrating a round the host never saw (phantom rounds, `Pair (NaN, NaN)`, a client
   * "racing to the game end"). Aj found it by noticing the Fight button worked and dragging did not. Any NEW
   * way to play a card is covered for free by the guard in `playCards`. */
  function sendClientPlay(cards){
    var ids=(cards||[]).map(function(c){ return c.id; });
    if(!ids.length){ setMessage('Select a card or combo to play.'); return; }
    NET.clientSend({op:'play', ids:ids}); selected={}; busy=true; render();

  function placeEmoteList(){

    if(r.right > vw-pad) dx = (vw-pad) - r.right;                   // hanging off the right → pull left
    if(r.left + dx < pad) dx = pad - r.left;                        // …but never past the left edge
    if(dx) list.style.transform='translateX('+Math.round(dx)+'px)';
  }
  function isNetClient(){ return !!(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()); }

  function playCards(cards){
    if(typeof TUT!=='undefined' && TUT.blocking && TUT.blocking()) return;
    if(isNetClient()){ sendClientPlay(cards); return; }                // the backstop: every path into the engine
    if(!canHumanPlay(cards)){ setMessage('That play won’t beat the pile here.'); render(); return; }
    if(typeof TUT!=='undefined' && TUT.needSpecial && TUT.needSpecial() && (!cards||cards.length<2)){ setMessage('For this lesson, make a <b>Special</b> — two cards of the same number.'); render(); return; }
    flipFrom={};
    Array.prototype.forEach.call($('hand').querySelectorAll('.card'), function(el){ if(el.dataset.id) flipFrom[el.dataset.id]=el.getBoundingClientRect(); });
    var r=E.play(state, YOU, cards);
    if(!r.ok){ flipFrom=null; setMessage(r.reason); render(); return; }
    selected={};
    setMessage('You played <b>'+kindPhrase(r.combo.type)+'</b>'+(r.boosted?' (boosted)':'')+'.');
    say(YOU, '{who} played '+playPhrase(r.combo)+(r.boosted?' with a boost':'')+'.', 'you');   // r.boosted comes from nextPlayBoost — a valueBoost card ACTIVATED earlier, which is the only way to boost

  function selectedCards(){ return state.players[YOU].hand.filter(function(c){ return selected[c.id]; }); }
  function toggle(id){ if(state.turn!==YOU||state.finished||busy||pick||targeting||targetPick) return;

  function fightLegal(cards){
    if(!cards.length) return null;
    var combo=E.detectCombo(cards); if(!combo) return null;
    if(state.round<2 && combo.size>1) return null;
    var eff=E.applyEquip(combo, YOU, state);

  // The single context-aware action for the current selection: Activate (default) or Phantasm.
  function ctxAction(){
    var sel=selectedCards();

    if(targetPick && targetPick.chosen!=null)
      return {mode:'activate', label:'⚡ Activate', ok:true, reason:'', gold:true, run:function(){ confirmTargetPick(); }};
    if(targetPick)
      return {mode:'activate', label:'🎯 Pick a target', ok:false, reason:'Tap the rival you want to hit, then press ⚡ Activate.', run:null};
    if(sel.length===1){
      var eff=E.effectOf(sel[0]);
      if(eff && eff.kind==='phantasm'){
        var pi=phantInfo();

        return {mode:'phantasm', label:'Phantasm', ok:false, reason:'Phantasmal warps a Special on the pile — there isn’t one.', run:null};
      }
      if(activatableCard(sel[0])){
        var card=sel[0], block=activateBlock(card);
        var tgt=effNeedsTarget(E.effectOf(card));   // targeting effects: the button chooses a target first; energy is only spent once one is picked
        return {mode:'activate', label: tgt?'🎯 Choose target':'⚡ Activate', ok:!block, reason:block||'', run:function(){ activate(card.id); }};
      }

  function updateActions(yourTurn){

            ? 'Phantasmal Illusion — Confirm to copy the '+kindLabel(state.pile.combo.type)+' as it is, or add 1 card to reshape it ('+n+'/1 optional).'
            : 'Phantasmal Illusion — choose 1 card to complete a higher Special over the '+kindLabel(state.pile.combo.type)+' ('+n+'/1 picked).')

    }
    sort.style.display=''; pass.style.display=''; clear.style.display='';
    fight.textContent='Fight'; pass.textContent='Pass';
    fight.disabled=true; pass.disabled=true;
    if(state.finished){ hint.textContent=''; return; }
    if(typeof TUT!=='undefined' && TUT.blocking && TUT.blocking()){          // tutorial read step — hold the board until they press the button
      fight.disabled=true; pass.disabled=true; ctxBtn.style.display='none'; cardAct.style.display='none';
      hint.textContent='Read the tutorial tip, then press the button to continue.'; hint.className=''; return;
    }
    if(!yourTurn){
      hint.textContent = (MP() && state.players[YOU].eliminated)
        ? '💀 You’re out — spectating the rest of the duel.'
        : (MP() ? (seatName(state.turn)+' is fighting…') : 'Rival is fighting…');
      hint.className = (MP() && state.players[YOU].eliminated) ? 'bad' : '';
      return;
    }
    /* BUSY MEANS THE PRESENTATION IS STILL RUNNING, and every action handler ALREADY refuses while it is —
     * silently. `yourTurn` is `state.turn===YOU && !state.finished` with no `busy` in it, so once the turn comes
     * back to you but the opponent's beats are still playing, Fight and Pass render ENABLED and do nothing at
     * all: `doFight`, `doPass` and `toggle` each `return` on `busy` without a message. MEASURED at **2014ms of
     * swallowed Pass clicks** in the Initiative lesson, where the Rival leads round 1 — found by
     * `lessontest_initiative`, which had to retry its click for two seconds before anything happened.
     * An enabled control that does nothing is worse than a disabled one, and from the outside it is
     * indistinguishable from the game having hung. Placed AFTER the `!yourTurn` branch so "Rival is fighting…"
     * still wins when it is genuinely not your turn — that message is more specific than this one. */
    if(busy){
      fight.disabled=true; pass.disabled=true; ctxBtn.style.display='none'; cardAct.style.display='none';
      hint.textContent='Hold on — the board is still resolving.'; hint.className='';
      return;
    }
    if(E.isLocked(state, YOU)){                               // Back Stab: you can't play or activate this round
      hint.textContent='Locked out this round (Back Stab) — you can only '+(state.pile?'pass':'skip')+'.'; hint.className='bad';
      fight.disabled=true; pass.disabled=false; pass.textContent=state.pile?'Pass':'Skip';
      return;

    var charged=state.players[YOU].nextPlayBoost||0;

                            : "Activate this card's effect") : ctx.reason;

    if(actCard){

    /* THE STEP'S OWN CARDS. Disabling beats refusing: an enabled control that does nothing is the v1.31.74 bug,
     * and letting the play through is worse still because the card is gone.
     * ABOVE the empty-selection branch on purpose: that branch returns early, so a check below it leaves Pass
     * live and the player can still break the script by passing with nothing selected. */
    var tutOnly=(typeof TUT!=='undefined' && TUT.needCards)?TUT.needCards():null;
    if(tutOnly){
      var selIds=sel.map(function(c){ return c.id; }).sort().join(',');
      var wantIds=tutOnly.slice().sort().join(',');
      if(selIds!==wantIds){
        hint.textContent = tutOnly.length ? 'This lesson needs the cards it just pointed at — follow the step above.'
                                          : 'Not this step — read the step above and use ⚡ Activate.';
        hint.className='bad'; fight.disabled=true; pass.disabled=true; return;
      }
    }
    if(!sel.length){ hint.textContent=(leading?'Lead a card'+(state.round<2?' (jabs only)':''):'Beat the '+kindLabel(state.pile.combo.type)+' or pass')+'. Tap a card to read or activate it.'+chargeTag; return; }
    var legal=fightLegal(sel);

    var tutSpecialGate=(typeof TUT!=='undefined' && TUT.needSpecial && TUT.needSpecial() && combo.size<2);   // tutorial: the "make a Special" step won't accept a single-card jab

    else if(legal){ hint.textContent=kindLabel(combo.type)+chargeTag+(actCard&&!actBlock?' — Fight it, or Activate its effect.':' — fight!'); hint.className='good'; fight.disabled=false; }
    else if(actCard && !actBlock){ hint.textContent=E.effectOf(actCard).name+' — Activate its effect.'; hint.className='good'; }
    else if(actCard && actBlock){ hint.textContent=E.effectOf(actCard).name+' — '+actBlock; hint.className='bad'; }
    else if(state.round<2 && combo.size>1){ hint.textContent='Round 1 is jabs only.'; hint.className='bad'; }
    else { hint.textContent=kindLabel(combo.type)+' — doesn’t beat the '+kindLabel(state.pile.combo.type)+'.'; hint.className='bad'; }

  /* ---- selection (pick) mode for DISCARD4 / DRAW2TOP1 ---- */
  function togglePick(id){
    if(!pick || id===pick.cardId) return;
    if(pick.from && pick.from.indexOf(id)<0) return;   // dig discard: only the looked cards are eligible
    var card=state.players[YOU].hand.filter(function(c){return c.id===id;})[0]; if(card) showCard(card);
    if(pick.chosen[id]) delete pick.chosen[id];
    else { if(Object.keys(pick.chosen).length>=pick.need) return; pick.chosen[id]=true; }
    render();
  }
  function confirmPick(){
    if(!pick) return;
    var ids=Object.keys(pick.chosen);
    // Phantasmal Illusion's swap is OPTIONAL when a bare copy already beats — 0 cards is a legal confirm there.
    var optional=(pick.kind==='phantasm' && pick.bare);
    if(optional ? (ids.length>pick.need) : (ids.length!==pick.need)) return;
    if(pick.kind==='phantasm'){                                            // Phantasmal Illusion — the swap is optional
      var warped=kindLabel(state.pile.combo.type), opts={ cardId:pick.cardId };
      if(ids.length){
        var addCard=cardById(ids[0]);
        var ri=phantasmSolve(addCard, pick.cardId);
        if(ri<0){ setMessage('That card won’t complete a higher Special — choose another.'); pick.chosen={}; render(); return; }
        opts.removeIdx=ri; opts.addId=ids[0];
      }
      /* A CLIENT SENDS AN INTENT. This branch called `E.phantasm(state, YOU, opts)` unguarded, so on a client
       * the illusion ran the LOCAL engine, mutated the mirror and was wiped by the next broadcast — the host
       * never heard about it. Fourth site of the drag-to-play class (v1.31.56). The host re-solves the swap
       * from `addId` alone rather than trusting an index a client computed. */
      if(isNetClient()){
        NET.clientSend({op:'phantasm', cardId:pick.cardId, addId:(ids.length?ids[0]:null)});
        pick=null; selected={}; busy=true; render(); return;
      }
      var r=E.phantasm(state, YOU, opts);
      if(!r.ok){ setMessage(r.reason); pick.chosen={}; render(); return; }
      pick=null; selected={};
      setMessage('🎭 You warped the '+warped+' into a higher <b>'+kindLabel(r.made)+'</b> — you take the initiative.');
      say(YOU, '{who} conjured a Phantasmal Illusion — a '+kindLabel(r.made)+' overtakes the pile.', 'you');
      render();
      return afterHumanAction();
    }
    if(pick.kind==='handlimit'){                                            // hand cap (end of round, or end of a play turn)
      var hsyms=ids.map(function(id){var c=cardById(id); return c?cardSym(c):null;}).filter(Boolean);
      var hlResume=pick.resume, hlG=pick.resumeG;
      if(state) state.trimPending=null;                         // the table is no longer waiting on us
      E.discardToLimit(state, YOU, ids);
      pick=null; selected={};
      say(YOU, '{who} discarded to hand size — '+hsyms.join(', ')+' → energy pile.', 'you');
      setMessage('Discarded down to '+E.MAX_HAND+'.');
      render();
      if(hlResume){ if(hlG!=null && hlG!==gen) return; return hlResume(); }   // end-of-round trim → resume the ceremony (draw + Round card)
      return afterHumanAction();
    }
    if(pick.kind==='discard'){                                             // a forced discard (self draw-and-pitch, or Rival-forced)
      var discSyms=ids.map(function(id){var c=cardById(id); return c?cardSym(c):null;}).filter(Boolean);
      var rg=pick.resumeG;
      if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ NET.clientSend({op:'discard', ids:ids}); pick=null; selected={}; busy=true; render(); return; }
    if(typeof NET!=='undefined' && NET.clientNotReady && NET.clientNotReady()){ setMessage('Connecting to the host\u2026 wait for the game to start.'); return; }
      var r=E.resolveDiscard(state, ids);
      if(!r.ok){ setMessage(r.reason); return; }
      pick=null; selected={};
      say(YOU, '{who} discarded '+discSyms.join(', ')+' → energy pile.', 'you');
      setMessage('Discarded '+ids.length+' card'+(ids.length>1?'s':'')+'.');
      render();
      if(state.finished) return endGame();
      if(rg!=null) return resumeRival(rg);   // Rival-forced discard mid-turn — resume the AI
      return;                                 // your own draw-and-pitch — it's still your turn
    } else { // top
      var r2=E.chooseTop(state, YOU, ids[0]);
      if(!r2.ok){ setMessage(r2.reason); return; }
      var c=cardById(ids[0]); // already removed; use the label we captured
      setMessage('You put a card on top of your deck.');
      say(YOU, '{who} put a card on top of the deck.', 'you');
    }
    pick=null; selected={};
    if(state.finished){ render(); return endGame(); }
    render();
  }
  function cancelPick(){
    // Phantasmal Illusion is optional — allow backing out. Discards / hand-limit / top stay mandatory.
    if(pick && pick.kind==='phantasm'){ pick=null; selected={}; setMessage('Phantasmal cancelled.'); render(); return true; }
  }
  function cardById(id){ return state.players[YOU].hand.filter(function(c){return c.id===id;})[0]; }

  function isHostileSingular(eff){ return eff && (eff.kind==='discardOpp'||eff.kind==='destroyShield'||eff.kind==='energyDenyOpp'||eff.kind==='lockout'||(eff.kind==='recycle'&&eff.scope==='opp')); }
  // Effects that pick a target before firing — the button reads "Choose target" and no energy is spent until a target is locked in.
  function effNeedsTarget(eff){ return eff && (eff.kind==='removeEquip' || eff.kind==='counterfeit' || isHostileSingular(eff)); }
  function livingOpps(){ var a=[]; for(var i=0;i<state.numPlayers;i++) if(i!==YOU && !state.players[i].eliminated) a.push(i); return a; }
  /* TARGETING IS NOW TWO STEPS (Aj: "always err on the side of confirming first"). Tapping a target used to
   * fire the effect instantly; it now only STAGES the target, and the context button turns into ⚡ Activate to
   * confirm. Clear still cancels with nothing spent. */
  function promptTargetPick(cardId, eff){ targetPick={ cardId:cardId, chosen:null, name:eff.name }; selected={}; setMessage('<b>'+eff.name+'</b> — tap the rival'+(MP()?' panel':'')+' to aim. Nothing is spent until you confirm.'); render(); }
  function chooseTargetSeat(seat){
    if(!targetPick) return;

    setMessage('<b>'+targetPick.name+'</b> aimed at <b>'+logName(seat)+'</b> — press <b>⚡ Activate</b> to confirm, or <b>Clear</b> to cancel.');

  // The round winner (chosen mode, 3–6p) picks whose shield to strip. `done(finalRes)` continues with the resolved result.
  function promptLossTarget(res, g, done){
    lossPick={ cands:res.cands.slice(), g:g, done:done };
    busy=true;   // lock hand actions; the opponent panels stay clickable (their onclick isn't gated by busy)
    setMessage('You won with a <b>'+(TYPE[res.comboType]||'Special')+'</b> — tap a rival to strip a shield.');
    render();
  }
  function chooseLossSeat(seat){
    if(!lossPick || lossPick.cands.indexOf(seat)<0) return;
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ lossPick=null; NET.clientSend({op:'lossTarget', target:seat}); busy=true; render(); return; }   // client picks → host applies
    if(typeof NET!=='undefined' && NET.clientNotReady && NET.clientNotReady()){ setMessage('Connecting to the host\u2026 wait for the game to start.'); return; }
    var g=lossPick.g, done=lossPick.done; lossPick=null;
    var fin=E.chooseLossTarget(state, seat);
    say(YOU, '{who} strike '+logName(seat)+'’s shield with a Special.', 'you');
    if(g!=null && g!==gen) return;
    done(fin);
  }
  function activate(cardId, _opts){
    if(state.turn!==YOU||state.finished||busy||pick||targeting||targetPick) return;
    if(typeof TUT!=='undefined' && TUT.blocking && TUT.blocking()) return;
    var card=cardById(cardId); var eff=card?E.effectOf(card):null;
    if(!card||!eff||!eff.impl) return;
    var _cd2=E.rideCostDelta?E.rideCostDelta(state, YOU, card):0;

      flashArt(card, 'You');                    // center-stage art pop only — a Form's full text is read by hovering it in the Forms & Rides zone, not shoved into the description box

      return;
    }

    setMessage('You played <b>'+eff.name+'</b>.'+pitchNote);
    say(YOU, '{who} played '+effPhrase(card)+(r.pitched?' — pitched '+cardSym(r.pitched):'')+'.', 'you');
    bumpEffect(YOU, eff);

    // the Rival (and then you again) may answer on the stack — Counter, spring Leyline, etc.
    settleWindows(gen, function(){

  /* Pandora's Outbalance promises "look at the target's hand", so show it. `seat` is in the LOCAL frame (a

  /* Open across mirror updates: the reveal is deliberately NOT on state, and applyMirrorNow() closes any

   * modal, and a netplay caster sees their hand read flash for a frame and vanish. */
  var revealOpen=false;

  function showRevealIfAny(next){
    var rv = (E.takeReveal ? E.takeReveal(YOU) : null);

  // After one of YOUR actions resolves, deal with any forced discard it created:
  // your own (draw-and-pitch) opens the picker; the Rival's (you played a discard on them) auto-resolves.
  function handleDiscardAfterAction(){
    var dp=state.discardPending; if(!dp) return false;
    if(dp.player===YOU){
      pick={ kind:'discard', need:dp.count, chosen:{}, from:dp.from||null };   // no resumeG => still your turn afterwards; `from` = the dig's looked cards
      setMessage(dp.from ? ('Choose '+dp.count+' of the cards you looked at to bank into Energy — keep the rest.') : ('Choose '+dp.count+' card'+(dp.count>1?'s':'')+' to send to your Energy Pile.'));

    if(d.ok) logMsg('<b>Rival</b> discarded '+d.discarded.length+' card'+(d.discarded.length>1?'s':'')+'.', 'rival');

  }
  function doRemove(cardId, targetId){

    if(typeof NET!=='undefined' && NET.clientNotReady && NET.clientNotReady()){ setMessage('Connecting to the host\u2026 wait for the game to start.'); return; }
    var r=E.activate(state, YOU, cardId, {target:targetId});

    selected={}; targeting=null;
    setMessage('You played <b>'+eff.name+'</b>.');

  // Direction 1: you cast a Technique — if a response window opened, let the Rival's

  function rivalMayRespond(humanEffName){

  function doFight(){

  function doPass(){

  function doPassBody(){
    var r=E.pass(state, YOU);

  function finishPassRound(r){

      if(typeof NET!=='undefined' && NET.hostLive && NET.hostLive() && MP() && r.needsLossTarget){ return NET.hostResolveWin(r, g, function(fr){ NET.hostSettleRoundThenCeremony(fr, g); }); }   // netplay: a remote winner picks its target, then the ceremony
