      if(typeof NET!=='undefined' && NET.sendCeremony && NET.hostLive && NET.hostLive()) NET.sendCeremony(r);   // netplay: client replays this ceremony too

  // Direction 1: YOU cast a destroyShield technique (Critical Hit / Ultima Attack). If the Rival

  function rivalMayGuard(){

  // COUNTERFEIT: choose a card from the Rival's current play to copy into your hand.

  function doCounterfeit(cardId, copyId){

  // PHANTASMAL ILLUSION (fight action): is it available, and can it beat the current play?
  function phantInfo(){
    if(state.turn!==YOU || !state.pile || state.finished || busy) return null;
    var you=state.players[YOU];
    var pc=you.hand.filter(function(c){ var ef=E.effectOf(c); return ef && ef.kind==='phantasm'; })[0];
    if(!pc) return null;                                              // no button unless you hold it
    if(state.pile.combo.size<2) return { show:true, ok:false, reason:'Phantasmal Illusion copies a Special — not a jab.' };
    if(!E.canAfford(you, pc)) return { show:true, ok:false, reason:'Not enough ♦ energy to cast Phantasmal Illusion.' };
    if(you.hand.length-2<1 && (you.deck.length+you.shuffle.length)===0) return { show:true, ok:false, reason:'Keep a card to lead — not enough cards to spend on the illusion.' };
    // v1.31.6: the swap is OPTIONAL. A bare copy takes the play's base values and then your boosts, Equipment
    // and Odysseus's +1 apply — so it can already beat without spending a card. Only fall back to the swap search.
    var bare=phantasmBare(pc.id);
    var solvable=bare || you.hand.some(function(c){ return c.id!==pc.id && phantasmSolve(c, pc.id)>=0; });
    if(!solvable) return { show:true, ok:false, reason:'A bare copy only ties, and no card in your hand completes a higher Special over this play.' };
    return { show:true, ok:true, cardId:pc.id, bare:!!bare };
  }
  // Would a copy with NO swap already beat? Same math the engine runs: base values + applyEquip + Odysseus.
  function phantasmBare(phantId){
    var base=state.pile.combo.cards, plain=[];
    for(var i=0;i<base.length;i++) plain.push({rank:base[i].rank, suit:base[i].suit});
    var cand=E.detectCombo(plain); if(!cand) return false;
    var phCard=state.players[YOU].hand.filter(function(c){return c.id===phantId;})[0];
    var pp=(phCard && E.effectFor)?(E.effectFor(state, YOU, phCard).phantasmPlus||0):0;
    var eff=E.applyEquip?E.applyEquip(cand, YOU, state):cand;
    if(pp) eff={type:eff.type,size:eff.size,value:eff.value+pp,key:[eff.key[0]+pp].concat(eff.key.slice(1)),cards:eff.cards};
    return E.beats(eff, state.pile.combo);
  }
  // find the remove-index that lets `addCard` form a higher Special over the current pile.
  function phantasmSolve(addCard, phantId){ return phantasmSolveFor(state, YOU, addCard, phantId); }
  /* SEAT-AWARE, because the host has to re-solve a CLIENT's illusion. The client sends only which card it is
   * adding; the host works out which pile card it replaces, exactly as `resolveIds` re-resolves card ids rather
   * than trusting them. A client is untrusted, so an index it computed is not evidence of anything. */
  function phantasmSolveFor(st, seat, addCard, phantId){
    var base=st.pile.combo.cards;
    var phCard=st.players[seat].hand.filter(function(c){return c.id===phantId;})[0];
    var pp=(phCard && E.effectFor)?(E.effectFor(st, seat, phCard).phantasmPlus||0):0;   // Odysseus: +value on the illusion
    for(var ri=0; ri<base.length; ri++){
      var phantom=[]; for(var i=0;i<base.length;i++){ if(i!==ri) phantom.push({rank:base[i].rank,suit:base[i].suit}); }
      var cand=E.detectCombo(phantom.concat([{rank:addCard.rank,suit:addCard.suit}]));
      if(cand && E.applyEquip) cand=E.applyEquip(cand, seat, st);        // that seat's Equipment/boosts reach the illusion
      if(cand && pp) cand={type:cand.type,size:cand.size,value:cand.value+pp,key:[cand.key[0]+pp].concat(cand.key.slice(1)),cards:cand.cards};
      if(cand && E.beats(cand, st.pile.combo)) return ri;
    }
    return -1;
  }
  function doPhantasm(e){
    if(busy||pick||targeting||targetPick) return;
    var info=phantInfo(); if(!info) return;
    if(!info.ok){ showTip($('ctxBtn'), info.reason); if(e&&e.stopPropagation) e.stopPropagation(); return; }
    pick={ kind:'phantasm', need:1, chosen:{}, cardId:info.cardId, bare:!!info.bare };   // the swap is OPTIONAL
    selected={};
    setMessage(info.bare ? 'Your illusion already beats this play — Confirm to conjure it, or add one card first.'
                         : 'Choose one card from your hand to add to the illusion — it must complete a higher Special.');
    render();
  }
  // End of your turn: if you're over the hand cap, discard down before the Rival acts.
  // Single chokepoint for "hand control to the opponent seat(s)". Netplay-host overrides this to await the
  // remote player's move from the wire instead of running the local AI; single-player behaviour is unchanged.
  function driveRival(){
    if(NET && NET.isHost && NET.isHost()) return MP() ? NET.driveN() : NET.awaitRival();   // 2p → awaitRival; 3–6p → the N-player driver
    return MP()?runOpponents():runRival();
  }
  function afterHumanAction(){
    if(state.finished) return endGame();
    if(state.turn!==YOU) driveRival(); else render();
  }

  // Log the win itself (win / shield strip / prevented / kick / jab). The "Round N — draws" line is logged
  // LATER by logRoundDraw(), after the end-of-round discard + the deferred draw.
  function announceRoundWin(res){
    var w=res.roundWinner, who=logName(w), cls=(w===YOU?'you':'rival');
    var spec = res.comboType ? (TYPE[res.comboType]||'Special') : 'Special';
    /* WHO lost the shield now comes from res.struck (engine, v1.29.6). It used to be "whoever was eliminated,
     * else the string 'a rival'" — so in a free-for-all almost every line read "a rival lost a shield" even
     * though the game knew perfectly well which seat it was. */
    var struck=(res.struck||[]).filter(function(q,i,a){ return a.indexOf(q)===i; });
    var foeList = struck.length ? struck.map(logName).join(' & ') : null;
    var foe = foeList || (MP() ? 'a rival' : (w===YOU?'Rival':'You'));
    var lostVerb = (struck.length===1 && struck[0]===YOU) ? 'lose' : (foe==='You' ? 'lose' : 'lost');
    if(res.kick){
      pendingKick=true; lastEndType='kick';
      setMessage('💥🦵 <b>'+who+'</b> land'+(w===YOU?'':'s')+' the FIGHTER KICK — '+foe+' explode'+(foe==='You'?'':'s')+'!');
      /* NOTE `foe` is still built with the SENDER's `logName`, so a client can read a foe name where it should read
       * "You". Left as a known limit rather than fixed blind: resolving it needs the struck seats on the wire,
       * and `say` carries one seat. Filed in the BACKLOG. The verb agreement is fixed here. */
      /* PAST TENSE ON BOTH HALVES. v1.31.55 moved {who}'s verb to past tense and left this copula alone, so a
       * client reading itself as {foe} got "You is out!" — Aj's log, 2026-08-29. A verb attached to {foe} needs
       * the same treatment as one attached to {who}; neither name's number is known when the template is written. */
      sayOnce(w, '💥 {who} landed the FIGHTER KICK — {foe} was taken out!', cls, struck.length?struck:[w===YOU?RIVAL:YOU]);
    }
    else if(res.prevented && !res.shieldStripped){
      setMessage('🛡 The loss was prevented!');
      sayOnce(w, '{who} won with a '+spec+' - but the loss was prevented.', cls);
    }
    else if(res.shieldStripped){
      setMessage('<b>'+foe+'</b> '+lostVerb+' a shield.');
      sayOnce(w, '{who} won with a <b>'+spec+'</b> - {foe} lost a shield.', cls, struck);
    }
    else if(res.wonWithCombo){
      // A Special won but nothing was stripped (no valid target, or every strike was blanked). Saying
      // "won the round of Jabs" here was simply wrong — Aj saw exactly this after striking P3's shield.
      setMessage('<b>'+who+'</b> won with a <b>'+spec+'</b> — no shield lost.');
      sayOnce(w, '{who} won with a <b>'+spec+'</b> - no shield was lost.', cls);
    }
    else {
      setMessage('<b>'+who+'</b> won the round of Jabs.');
      sayOnce(w, '{who} won the round of Jabs.', cls);
    }
    logCatchUp(res, w, struck);
    TUT.note('roundWin', res);
  }
  // Catch-up (M1 shields-as-cards + M2 loser-mill): surface the round loser's refuel. Skipped on a Kick
  // (the loser is out). Every seat is named from res.milled / res.struck — the old version derived the loser
  // as "whichever of YOU/RIVAL didn't win", which in a free-for-all told the WRONG player they lost a shield.
  /* say() on a host or in solo; nothing on a netplay client, where the host's broadcast carries the line. */
  function sayOnce(actor, tpl, cls, foes){
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()) return;
    return say(actor, tpl, cls, foes);
  }
  function logCatchUp(res, w, struck){
    if(res.kick) return;
    if(res.shieldToHand && struck && struck.length){
      struck.forEach(function(q){
        sayOnce(q, '🛡→✋ {who} took the broken shield back into hand.', q===YOU?'you':'rival');
      });
    }
    if(res.milled){
      Object.keys(res.milled).forEach(function(k){
        var q=parseInt(k,10), mn=res.milled[k];
        sayOnce(q, '{who} moved '+mn+' card'+(mn>1?'s':'')+' from deck to Energy — catch-up.', q===YOU?'you':'rival');
      });
    }
  }
  function logRoundDraw(res){
    var rn = res.newRound || (state && state.round);      // never render "Round undefined" (Aj saw it)
    if(!rn) return;
    /* One neutral line for everyone (Aj's wording), instead of "You draw 2, Rival draws 2" — which could not
     * be phrased for 3-6 seats and named the wrong player in a free-for-all. Per-seat detail that actually
     * matters (your own fizzle) still follows. */
    // The per-round draw SCALES with the table (= numPlayers since v1.31.3), so ask the engine.
    // E.DRAW_PER_ROUND is the DUEL value and would announce "draws 2" at a six-player table drawing 6.
    var per=(E.drawCountFor&&state)?E.drawCountFor(state):((E.DRAW_PER_ROUND!=null)?E.DRAW_PER_ROUND:2);
    say(null, '<b>Round '+rn+'</b> begins. Each player draws '+per+'.', 'round');
    if(res.draws && res.draws[YOU]===0) logMsg('Draw fizzled — your deck &amp; shuffle pile are empty. Spend energy on effects to recycle cards back into your deck.', 'warn');
  }
  function logDeckout(res){
    // The engine records the decked-out seat in res.eliminated for N-player games; only a duel can safely
    // infer it as "whoever didn't win". Deriving it that way in a free-for-all named the wrong player.
    var elim = (res && res.eliminated && res.eliminated.length) ? res.eliminated[res.eliminated.length-1] : null;
    var loserSeat = (elim!=null) ? elim : (MP() ? null : (state.winner===YOU ? RIVAL : YOU));
    var loser = (loserSeat!=null) ? logName(loserSeat) : 'A rival';
    var youWin = state.winner===YOU;
    lastEndType='deckout';
    setMessage('<b>'+loser+'</b> decked out — '+(youWin?'you win!':(logName(state.winner)+' wins.')));
    say(loserSeat!=null?loserSeat:state.winner, (loserSeat!=null?'{who} decked out!':(loser+' decked out!')), 'warn');
  }

  /* ---- Round-announcement ceremony ----------------------------------------------------------
     A round resolves in beats: win → (special: loser loses a shield) → seize the initiative. THEN the
     end-of-round hand-limit trim runs (before any draw), THEN the new round's cards are drawn and the
     "Round N" card flies them in. Terminal rounds (Fighter Kick) never reach here — they finish on the win. */
  function roundSubtitle(res){
    if(res.opening) return 'Jabs only';
    if(res.draws && res.draws[YOU]===0) return 'Deck empty — spend energy to recycle';
    if(res.newRound===2) return 'Specials unlocked!';
    var nDraw=(E.drawCountFor&&state)?E.drawCountFor(state):2;   // scales with the table — never hardcode it
    return 'Each player draws '+nDraw+(nDraw===1?' card':' cards');
  }
  /* The between-rounds ceremony beats. This was the THIRD site deriving the loser as "whichever of YOU/RIVAL
   * didn't win" (Aj caught it after v1.29.6 fixed the other two): with P2 beating P3, `youWon` is false, so
   * `foe` became 'You' and the ceremony announced "You lose a shield" to a player who lost nothing — while the
   * battle log, already fixed, correctly said "P3 lost a shield". Now reads res.struck like announceRoundWin. */
  function buildPreDrawBeats(res){
    var w=res.roundWinner, youWon=(w===YOU), who=logName(w), cls=youWon?'good':'bad';
    var struck=(res.struck||[]).filter(function(q,i,a){ return a.indexOf(q)===i; });
    var youStruck=struck.indexOf(YOU)>=0;
    var foe = struck.length ? struck.map(logName).join(' & ') : (MP() ? 'a rival' : (youWon?'Rival':'You'));
    var lostVerb = youStruck ? 'lose' : (struck.length ? 'loses' : (foe==='You'?'lose':'loses'));
    var isSpecial=res.comboType && res.comboType!=='single';
    var label=isSpecial ? (TYPE[res.comboType]||'Special') : 'Jab';
    var beats=[{ html:'<b>'+who+'</b> won the round with a <b>'+label+'</b>!', cls:cls }];
    if(res.shieldStripped) beats.push({ html:'<b>'+foe+'</b> '+lostVerb+' a shield 🛡', cls:(youStruck?'bad':cls), shield:true });
    else if(res.prevented) beats.push({ html:foe+'’s shield held — loss prevented 🛡', cls:'dim' });
    beats.push({ html:'<b>'+who+'</b> '+(youWon?'seize':'seizes')+' the initiative!', cls:cls });
    return beats;
  }
  /* The clean-up-pick notice, on the ceremony's own stage. Guarded by its own class both ways: it never
   * overwrites a ceremony beat that is already showing, and `clearTrimWait` only takes down a banner it put up. */
  function showTrimWait(txt){
    var fx=$('roundfx'); if(!fx) return;
    /* IT TAKES OVER A LEFTOVER CEREMONY BEAT, on purpose. `playPreBeats` deliberately leaves its last beat
     * ("… seizes the initiative!") on stage for the Round-N plate to swap into, so by the time a clean-up pick
     * opens the stage is showing something stale — and refusing to overwrite it meant the notice never appeared
     * at all. A ceremony still mid-sequence wins the race back on its next step, which is correct: the beats
     * are the shorter-lived message. */
    var inner=fx.querySelector('.rfInner'); if(!inner) return;
    if(/trimwait/.test(fx.className) && inner.getAttribute('data-trim')===txt) return;   // already saying it
    inner.className='rfInner dim'; inner.innerHTML='<div class="rfBeat">'+esc(txt)+'</div>';
    inner.setAttribute('data-trim', txt);
    void inner.offsetWidth; inner.classList.add('in');
    fx.className='show trimwait';
  }
  function clearTrimWait(){
    var fx=$('roundfx'); if(!fx || !/trimwait/.test(fx.className)) return;
    var inner=fx.querySelector('.rfInner'); if(inner) inner.removeAttribute('data-trim');
    clearRoundfx();
  }
  function clearRoundfx(){ var fx=$('roundfx'); if(!fx) return; fx.className=''; fx.onclick=null; var inner=fx.querySelector('.rfInner'); if(inner){ inner.className='rfInner'; inner.innerHTML=''; } }
  function snapDrawnCards(){ Array.prototype.forEach.call(document.querySelectorAll('#hand .card.enter'), function(el){ el.classList.remove('enter'); el.style.animationDelay=''; }); }

  // Phase 1: the pre-draw beats. Reveals the deferred shield shatter on the shield beat. Leaves the banner
  // showing the final beat (so the Round card can swap in, or the trim can hide it).
  function playPreBeats(res, done){
    var fx=$('roundfx'), inner=fx&&fx.querySelector('.rfInner'), g=gen, shieldShown=false;
    function revealShields(){ if(shieldShown) return; shieldShown=true; holdShields=false; if(g===gen && state){ animateShields($('rivalShields'), state.players[RIVAL].shields, RIVAL); animateShields($('youShields'), state.players[YOU].shields, YOU); } }
    if(!fx || reduceMotion()){ revealShields(); setTimeout(function(){ if(g===gen) done(); }, reduceMotion()?200:0); return; }
    var beats=buildPreDrawBeats(res), i=0, timers=[], ended=false;
    function fin(){ if(ended) return; ended=true; timers.forEach(clearTimeout); revealShields(); if(g===gen) done(); }
    function step(){
      if(g!==gen){ fin(); return; }
      if(pendingThreshold){                                            // the shield just broke and unlocked a tier — give it its OWN beat, right here
        var info=pendingThreshold; pendingThreshold=null;
        inner.className='rfInner'; inner.innerHTML=''; fx.className='';  // clear the round banner so the unlock stands alone
        showThreshold(info);
        timers.push(setTimeout(function(){ if(g!==gen){ fin(); return; } fx.className='show'; step(); }, reduceMotion()?1450:2050));
        return;
      }
      if(i>=beats.length){ fin(); return; }
      var b=beats[i++];
      if(b.shield) revealShields();                                    // shatter → checkThresholds() queues pendingThreshold for the next step()
      inner.className='rfInner'+(b.cls?' '+b.cls:''); inner.innerHTML='<div class="rfBeat">'+b.html+'</div>';
      void inner.offsetWidth; inner.classList.add('in');
      timers.push(setTimeout(step, ROUND_BEAT));
    }
    fx.className='show'; fx.onclick=function(){ i=beats.length; timers.forEach(clearTimeout); timers=[]; fin(); };   // tap to skip the beats
    step();
  }
  // Phase 2: the "Round N" card (drawn cards fly in here). res.draws must be populated by now.
  function playRoundCardBeat(res, done){
    var fx=$('roundfx'), inner=fx&&fx.querySelector('.rfInner'), g=gen, ended=false, t;
    if(!fx || reduceMotion()){ setTimeout(function(){ if(g===gen) done(); }, reduceMotion()?200:0); return; }
    function fin(){ if(ended) return; ended=true; clearTimeout(t); fx.className=''; fx.onclick=null; inner.className='rfInner'; inner.innerHTML=''; snapDrawnCards(); if(g===gen) done(); }
    var fizzle=!!(res.draws && res.draws[YOU]===0);
    inner.className='rfInner rfCard'+(fizzle?' fizzle':''); inner.innerHTML='<div class="rfRound">Round '+res.newRound+'</div><div class="rfSub">'+roundSubtitle(res)+'</div>';
    void inner.offsetWidth; inner.classList.add('in');
    fx.className='show'; fx.onclick=fin;
    t=setTimeout(fin, ROUND_HOLD);
  }
  // End-of-round hand-limit trim — runs BEFORE the new draw. Over the cap? prompt the human to pitch
  // (to Energy); confirmPick calls `cb` when done. Otherwise proceed immediately.
  function endOfRoundTrimThen(cb){
    /* Clean-up Phase: everyone discards down to hand size (to Energy), no priority. Opponents auto-trim; you
     * pick. This used to trim and announce seat 1 ONLY — so at a six-player table seats 2+ were never trimmed
     * here and their clean-up was invisible in the log. Narration goes through `say`, which renders {who} in
     * each reader's own frame and broadcasts in netplay. */
    /* EVERY PLAYER PICKS THEIR OWN PITCHES (Aj, 2026-08-30: "no. all players choose what to discard").
     * This used to auto-trim every seat but the local one, so in netplay the host chose its own cards and every
     * client had its LOWEST cards taken by `discardToLimit` — an asymmetry in a competitive game.
     * Now it is a SEQUENTIAL QUEUE. A remote human seat gets the real picker on its own board, reusing the
     * forced-discard window wholesale (`discardPending` → `{op:'discard'}` → `E.resolveDiscard`, and both paths
     * already send discards to the Energy pile, so the semantics are identical). An AI seat is still trimmed for
     * it. The LOCAL seat is queued LAST, which keeps solo behaviour exactly as it was.
     * Sequential rather than simultaneous because that is what the window machinery supports — and because a
     * disconnected seat is covered for free: Passo answers a `discard` window with `ids:[]`. */
    var g=gen, queue=[];
    for(var ci=0; ci<state.numPlayers; ci++){
      if(ci===YOU || state.players[ci].eliminated) continue;
      if(state.players[ci].hand.length - E.MAX_HAND > 0) queue.push(ci);
    }
    if(state.players[YOU].hand.length - E.MAX_HAND > 0) queue.push(YOU);   // local seat last: solo order unchanged
    function nextTrim(){
      if(g!==gen) return;
      if(!queue.length){ state.trimPending=null; render(); return cb(); }
      var seat=queue.shift(), over=state.players[seat].hand.length - E.MAX_HAND;
      if(over<=0) return nextTrim();                                        // it may have changed while we waited
      if(seat===YOU){
        clearRoundfx();                                        // hide the banner so the hand + pick are visible
        state.trimPending={ player:YOU, need:over };
        pick={ kind:'handlimit', need:over, chosen:{}, resume:nextTrim, resumeG:gen };
        setMessage('Clean-up — over the hand limit ('+E.MAX_HAND+'). Discard '+over+' to your Energy Pile.');
        render();
        return;
      }
      if(typeof NET!=='undefined' && NET.isRemoteHumanSeat && NET.isRemoteHumanSeat(seat)){
        state.trimPending={ player:seat, need:over };
        state.discardPending={ player:seat, count:over };
        if(NET.hostParkTrim(seat, g, nextTrim)) return;
        state.discardPending=null;                             // could not park — fall through and trim for them
      }
      E.discardToLimit(state, seat);
      say(seat, '{who} discarded '+over+' to hand size → energy pile.', 'rival');
      return nextTrim();
    }
    nextTrim();
  }
  // Orchestrate a resolved round: pre-draw beats → end-of-round trim → draw → Round card → continuation.
  function resolveRoundCeremony(res, g, continuation){
    inCeremony=true;                                            // suppress the render-diff deck-mill float here; the catch-up mill fires its own explicit −N
    holdShields = !reduceMotion() && !!res.shieldStripped;      // defer the shatter to its beat
    render();                                                   // settle board; no fresh cards yet (draw deferred)
    playPreBeats(res, function(){
      if(g!==gen) return;
      flushThreshold(function(){                                // a transform tier that just unlocked gets its OWN beat here
      if(g!==gen) return;
      endOfRoundTrimThen(function(){
        if(g!==gen) return;
        E.roundDraw(state, res);                                // draw the new round's cards (held invisible for a beat)
        if(res.deckedOut){ inCeremony=false; logDeckout(res); render(); clearRoundfx(); busy=false; return endGame(); }
        logRoundDraw(res);
        enterDelayBase = reduceMotion()?0:340;                  // Round banner appears FIRST (round start), THEN the new cards fly in
        render(); enterDelayBase = 0;
        playRoundCardBeat(res, function(){ inCeremony=false; if(g===gen) continuation(); });
      });
      });
    });
  }

  /* Turn one seat's AI log into paced "beats" — the readable presentation layer: a dwell per action,
   * the card flashed or revealed, and a centre-stage message. SHARED by the duel driver (runRival) and
   * the N-player driver (runOpponents). It lived inline in runRival, and because the free-for-all driver
   * only logged, every bit of the v1.25.0/v1.26.0 readability work (rival dwells, the QUICK cue, the
   * two-phase art flash) was missing there — your play never breathed, the caption still read "You
   * played…" under an opponent's card, and their effects were invisible. Extracted so it cannot drift. */
  function buildOppBeats(log, seat){
    var who=logName(seat), beats=[];
      log.forEach(function(e){
        if(e.play){
          var eff=e.card?E.effectOf(e.card):null;
          beats.push({ dwell: revealDwell(e.card), run:function(){
            say(seat, '{who} played '+effPhrase(e.card)+'.', 'rival'); bumpEffect(seat, eff);
            if(e.card){ if(eff&&eff.kind==='transform'){ flashArt(e.card, who); } else { revealEffect(e.card, who); } setMessage('<b>'+who+' used '+(eff?eff.name:'a card')+'.</b>'); }   // Forms pop center-stage only; read them by hovering the Forms & Rides zone
          }});
        }
        else if(e.useEquip){ beats.push({ dwell:750, run:function(){ say(seat, '{who} spent a '+e.name+' counter — drew a card.', 'rival'); } }); }
        else if(e.fight==='play'){ bumpFight(seat, e.combo&&e.combo.type);   // opponents' fights were never counted — see recordGame
        beats.push({ dwell:1500, run:function(){ say(seat, '{who} played '+playPhrase(e.combo)+(e.boost?' with a <b>Brilliant Tactic</b> boost':'')+'.', 'rival'); bumpFight(RIVAL, e.combo.type); setMessage('<b>'+who+'</b> played '+kindPhrase(e.combo.type)+'.'); render(); } }); }
        else if(e.phantasm){ beats.push({ dwell:1300, run:function(){ say(seat, '{who} conjured a Phantasmal Illusion — a '+kindLabel(e.made)+' overtakes the pile.', 'rival'); setMessage('🎭 <b>Rival warped your play with a Phantasmal Illusion!</b>'); render(); } }); }
        else if(e.fight==='pass'){ beats.push({ dwell:950, run:function(){ say(seat, '{who} passed.', 'rival'); setMessage('<b>'+who+'</b> passed.'); render(); } }); }
        else if(e.discard){ beats.push({ dwell:600, run:function(){ say(seat, '{who} discarded '+e.discard+' to hand size.', 'rival'); } }); }
        else if(e.forcedDiscard){ beats.push({ dwell:750, run:function(){ say(seat, '{who} discarded '+e.forcedDiscard+' card'+(e.forcedDiscard>1?'s':'')+'.', 'rival'); } }); }
        else if(e.lockedSkip){ beats.push({ dwell:650, run:function(){ say(seat, '{who} is locked out — turn skipped.', 'warn'); setMessage('<b>'+who+'</b> is locked out — turn skipped.'); render(); } }); }
        else if(e.stuck){ beats.push({ dwell:650, run:function(){ say(seat, '{who} is out of cards!', 'warn'); setMessage('<b>'+who+'</b> is out of cards!'); render(); } }); }
      });
    return beats;
  }

  function runRival(){
    if(state.finished){ return; }
    busy=true; render(); $('rivalStatus').textContent='thinking…';
    var g=gen;
    setTimeout(function step(){
      if(g!==gen) return;
      if(state.finished || state.turn===YOU){ busy=false; $('rivalStatus').textContent=''; render(); return; }
      /* A LESSON MAY FLY THE RIVAL ITSELF (Aj, 2026-09-01: *"we need the ai pilot to sequence this in a way
       * that's useful for the tutorial"*). A tutorial needs the opponent to demonstrate specific things in a
       * specific order; a difficulty tier cannot promise that, and measurement showed why — `minion` never uses
       * effects at all, and `knight` used to activate a value boost and then pass (fixed in v1.31.77; the
       * strategic pass was blind to `nextPlayBoost`), which is the kind of thing a tier can regress at any time.
       * A pilot returns a log in exactly the AI's shape, so `buildOppBeats` presents it identically and nothing
       * downstream can tell the difference. */
      var log=(tutorialMode && currentLesson && currentLesson.pilot)
              ? currentLesson.pilot(state, RIVAL)
              : AI.takeTurn(state, RIVAL, difficulty, [YOU]);   // [YOU] = suspend if you can answer a Quick
      $('rivalStatus').textContent='';
      var passed=log.filter(function(e){return e.fight==='pass';})[0];
      if(passed && passed.result && passed.result.roundWinner!=null){
        var pres=passed.result;
        if(pres.shieldResponsePending && state.shieldResponse){          // Rival's shield is threatened — it may spring its guard
          var q=state.shieldResponse.q, rpl=state.players[q];
          var rgcard=rpl.hand.filter(function(c){return c.id===state.shieldResponse.guardId;})[0];
          var fr=(rpl.shields<=2) ? E.shieldGuard(state, q, state.shieldResponse.guardId) : E.shieldGuardPass(state, q);
          if(fr.guarded){ if(rgcard) flashArt(rgcard, 'Rival'); quickFlash('Rival', fr.guardName, false); setMessage('🛡 <b>Rival sprang '+fr.guardName+' — its shield holds!</b>'); logMsg('<b>Rival</b> sprang '+fr.guardName+' in response — its shield holds.', 'rival'); }
          return finishStep(fr, g, log.filter(function(e){return e.play;}));   // finishStep renders (with the ceremony's held draw/shield)
        }
        return finishStep(pres, g, log.filter(function(e){return e.play;}));   // finishStep renders (with the ceremony's held draw/shield)
      }
      // Turn the Rival's actions into paced "beats". Effect activations reveal the card in the side
      // panel and dwell so you can read them; the fight/pass beats render the board.
      var beats=buildOppBeats(log, RIVAL);
      playBeats(beats, g, function(){
        if(g!==gen) return;
        render();                                                                 // settle the board to the final state
        if(state.preFightQ===YOU){ return promptHumanPreFight(g); }               // Rival is about to fight — you may spring Back Stab
        if(state.pending && state.respondFor===YOU){ return promptHumanResponse(g); }   // your turn to answer a Quick
        if(state.shieldResponse && state.shieldResponse.q===YOU){ return openShieldGuardModal(null, function(){ resumeRival(g); }); }   // Rival's destroyShield threatens you — spring a guard
        if(state.discardPending && state.discardPending.player===YOU){ return promptHumanDiscard(g); }   // Rival forced you to discard
        if(state.finished){ busy=false; return endGame(); }
        setTimeout(function(){ if(g===gen) step(); }, 480);
      });
    }, playHold());
  }
  // The Rival forced a discard on you: pause its turn, let you choose which cards to pitch, then resume.
  function promptHumanDiscard(g){
    var dp=state.discardPending;
    if(!dp || dp.player!==YOU){ return resumeRival(g); }
    busy=false;                                            // let the picker be interactive
    pick={ kind:'discard', need:dp.count, chosen:{}, resumeG:g, from:dp.from||null };
    setMessage(dp.from ? ('Choose '+dp.count+' of the cards you looked at to bank into Energy — keep the rest.') : ('Rival forces a discard — choose '+dp.count+' card'+(dp.count>1?'s':'')+' to send to your Shuffle Pile.'));
    render();
  }
  // Direction 2: the Rival cast a Technique you can answer. Pause the Rival's turn,
  // let you pick a Quick (or decline), then resume the rest of its turn.
  function eligibleQuicks(){
    var you=state.players[YOU], e=you.energy.length, pend=state.pending;
    return you.hand.filter(function(c){
      var ef=E.effectOf(c);
      if(!ef||!ef.impl||!ef.quick||!E.canAfford(you, c)) return false;
      if(ef.kind==='protect') return pend.eff.kind==='removeEquip' && you.equipment.length>0;
      return true;                                   // Counter Spell answers any Technique
    });
  }
  // Settle the response stack: the Rival's AI answers its own windows inline (recursively), and when
  // a window is YOURS you're prompted; when the stack settles, `done` runs. Used by both a Rival cast
  // (cont resumes its turn) and YOUR own cast (cont continues your turn) — handles Counter-a-Counter.
  function settleWindows(g, done){
    if(g!==gen) return;
    // NETPLAY HOST: the Rival is a remote human — route through NET so their response windows wait on the wire
    // (instead of the AI loop below), while the host's own windows still pop the normal modal.
    if(typeof NET!=='undefined' && NET.hostSettleActive && NET.hostSettleActive()){ return (MP() && NET.hostSettleN) ? NET.hostSettleN(g, done) : NET.hostSettle(g, done); }
    var guard=0, lastResp=null, lastQ=null;
    // Drain the window for ANY AI seat. This used to loop on `respondFor===RIVAL` only, and the branch
    // below handles `respondFor===YOU` — so in a free-for-all a window owed to seat 2+ was handled by
    // NEITHER: that seat never countered, and the undrained window left the turn parked. `respondDecision`
    // is seat-generic and always advances state (respond or decline), so this terminates.
    while(state.pending && state.respondFor!=null && state.respondFor!==YOU && !isHumanSeat(state.respondFor) && guard++<64){

  }
  function promptHumanResponse(g, cont){

    var tutNeedsCounter = tutAwaitCounter && typeof TUT!=='undefined' && TUT.isActive && TUT.isActive();

  function humanResponds(g, quickId, cont){

  function humanDeclines(g, cont){

  // ---- PRE-FIGHT QUICK WINDOW (Back Stab): the NON-active player may spring a Quick before the active
  // player's Play Sub-Phase. Two directions: you spring it on the Rival (Case A), or the Rival on you (Case B). ----
  function eligiblePreFightQuicks(){
    var you=state.players[YOU];
    return you.hand.filter(function(c){ var ef=(E.effectFor?E.effectFor(state,YOU,c):E.effectOf(c)); return ef&&ef.impl&&ef.quick&&ef.kind==='lockout'&&E.canAfford(you,c); });   // effectFor: Hermes Mode makes Back Stab a Quick

  // Case A — the Rival is about to fight and YOU hold Back Stab: offer to spring it and lock their turn.

  // Case B — YOU are about to fight and the Rival holds Back Stab: give the Rival its pre-fight window first.

  function rivalPreFightThen(g, proceed){
    var pf=E.openPreFight(state);
    var q=pf.q;
    // ANY AI opponent can hold this window, not just seat 1 — `openPreFight` names whichever seat is next,
    // which in a free-for-all is often seat 2+. This used to test `pf.q!==RIVAL` and silently drop those,
    // so Back Stab (and every Form-granted pre-fight Quick) was dead for P3 and beyond. Your own window is
    // prompted elsewhere (promptHumanPreFight); a human seat's is driven by netplay (NET.hostPreFight).
    if(!pf.preFightPending || q==null || q===YOU || isHumanSeat(q)){ return proceed(); }
    var mv=AI.preFightMove(state, q, YOU, diffOf(q));
    if(mv.pass){ E.preFightPass(state, q); return proceed(); }
    var r=E.preFightCast(state, q, mv.cast);
    if(!r.ok){ E.preFightPass(state, q); return proceed(); }
    busy=true;
    setMessage('🗡 '+logName(q)+' springs <b>Back Stab</b> — your turn is locked!');
    say(q, '{who} sprang Back Stab — you are locked out of this turn.', 'rival');

    render();
    settleWindows(g, function(){                       // you (active) may Counter the Back Stab
      if(g!==gen) return;
      if(E.isLocked(state, YOU)){ finishPassRound(E.pass(state, YOU)); }   // fight denied → forced skip
      else proceed();                                                       // you Countered it → fight as normal
    });
  }
  function resumeRival(g){
    if(g!==gen) return;
    if(state.finished){ busy=false; return endGame(); }
    return driveRival();                              // finish the Rival's suspended turn (netplay-aware)
  }
  // ---- N-player turn driver: play every AI seat until control returns to the human (seat 0) ----
  // logOppPlays was here: a log-only renderer for opponents' turns. Superseded by buildOppBeats, which
  // logs AND paces/flashes/messages. Deleted rather than left as a second path that could drift again.
  function mpResolveAIShieldWindows(){                 // auto-resolve any shield-guard windows that belong to AI seats
    var guard=0;
    while(state.shieldResponse && state.shieldResponse.q!==YOU && guard++<16){
      var q=state.shieldResponse.q, rpl=state.players[q];
      if(rpl.shields<=2 && state.shieldResponse.guardId) E.shieldGuard(state, q, state.shieldResponse.guardId); else E.shieldGuardPass(state, q);

  }
  // A human occupies opponent seat p — the turn driver pauses here and waits for their input to arrive.
  // Today this is unreachable (every opponent seat is 'ai'); Phase 5 netplay resumes the driver via
  // applyRemoteInput() once the remote seat's move is broadcast in. The busy flag keeps the local UI locked.
  function awaitHumanSeat(p, g){
    busy=true; $('rivalStatus').textContent='Waiting for '+seatName(p)+'…'; render();
    if(!isHumanSeat(p)) console.warn('awaitHumanSeat called on a non-human seat', p, controllerOf(p));
    // no auto-resume: the transport (Phase 5) will call back into the driver when the remote input lands.
  }
  /* How long YOUR play sits on the table before an opponent answers. Aj: "my play also gets clobbered right
   * away by ai, i know they think fast… but can my play just linger a bit?" The duel driver had a 650ms opener;
   * the free-for-all driver had NONE and stepped straight into the first AI seat. One constant, both drivers. */
  var PLAY_HOLD = 1000;
  function playHold(){ return reduceMotion() ? 60 : PLAY_HOLD; }
  function runOpponents(){
    if(state.finished){ busy=false; render(); return endGame(); }
    busy=true; render();
    var g=gen;
    var firstStep=true;
    (function step(){
      if(firstStep){ firstStep=false; return setTimeout(function(){ if(g===gen) step(); }, playHold()); }   // let your play linger
      if(g!==gen) return;
      if(state.shieldResponse && state.shieldResponse.q===YOU){ return openShieldGuardModal(null, function(){ if(g===gen) step(); }); }   // your shield is threatened
      mpResolveAIShieldWindows();
      if(state.finished){ busy=false; $('rivalStatus').textContent=''; render(); return endGame(); }
      if(state.discardPending && state.discardPending.player===YOU){ return promptHumanDiscard(g); }  // a rival forced YOU to discard — prompt (resumes via resumeRival→runOpponents)
      if(state.preFightQ===YOU){ return promptHumanPreFight(g); }                                   // resumes via resumeRival→runOpponents
      if(state.pending && state.respondFor===YOU){ return promptHumanResponse(g); }                 // ditto
      if(state.turn===YOU){ busy=false; $('rivalStatus').textContent=''; render(); return; }        // back to the human
      var p=state.turn;
      if(isHumanSeat(p)){ return awaitHumanSeat(p, g); }   // a human occupies this opponent seat — pause for their input (unreachable today: all opponents are 'ai')
      $('rivalStatus').textContent=seatName(p)+' is playing…';

       * logOppPlays and rendered — no dwell, no flashArt/revealEffect, no setMessage, no bumpEffect — so
       * an opponent's turn was invisible: your play never breathed, the centre-stage caption still read
       * "You played…" under their card, and their effects never showed. The round-resolution branches
       * below must run AFTER the beats, so they moved inside the completion callback. */
      var beats=buildOppBeats(log, p);

        if(g!==gen) return;

              mpResolveAIShieldWindows(); announceRoundWin(fr); if(state.finished){ busy=false; render(); return endGame(); } resolveRoundCeremony(fr, g, function(){ if(g===gen) step(); }); });

  function finishStep(res, g, effs){

    });
  }

  // Sort tidies the hand into sorted order. In normal play it breaks any built combos and clears selection;
  // during a pick (forced discard / hand-limit) it ONLY reorders — your picked cards stay picked.
  function fv(c){ return E.fightValue(c); }
  function bySortVal(a,b){ return fv(a)-fv(b) || E.SUITS.indexOf(a.suit)-E.SUITS.indexOf(b.suit); }
  // Group the hand into pairs/trios by rank (rank with 4 → two pairs), ordered low→high; singles interleave by rank.
  function sortIntoPairs(hand){
    var byV={}; hand.forEach(function(c){ (byV[fv(c)]=byV[fv(c)]||[]).push(c); });
    var groups=[];
    Object.keys(byV).map(Number).sort(function(a,b){return a-b;}).forEach(function(v){
      var cs=byV[v].slice().sort(bySortVal);
      if(cs.length===4){ groups.push(cs.slice(0,2)); groups.push(cs.slice(2,4)); }   // 4-of-a-kind → two playable pairs
      else groups.push(cs);                                                          // 1 single · 2 pair · 3 trio
    });
    return groups;
  }
  // Pull out runs of 5 consecutive values as straight groups (low→high), rest as singles.
  function sortIntoStraights(hand){
    var remaining=hand.slice(), groups=[], made=true;
    while(made){
      made=false;
      var byV={}; remaining.forEach(function(c){ var v=fv(c); if(!byV[v]) byV[v]=c; });   // one card per value
      var vals=Object.keys(byV).map(Number).sort(function(a,b){return a-b;});
      for(var s=0;s<vals.length;s++){
        var run=[vals[s]]; for(var k=1;k<5;k++){ if(vals.indexOf(vals[s]+k)>=0) run.push(vals[s]+k); else break; }
        if(run.length===5){
          var cards=run.map(function(v){ return byV[v]; });
          groups.push(cards.slice().sort(bySortVal));
          cards.forEach(function(cd){ remaining=remaining.filter(function(x){ return x!==cd; }); });
          made=true; break;
        }
      }
    }
    remaining.slice().sort(bySortVal).forEach(function(c){ groups.push([c]); });
    groups.sort(function(a,b){ return Math.min.apply(null,a.map(fv)) - Math.min.apply(null,b.map(fv)); });   // low→high by the group's lowest card
    return groups;
  }
  function updateSortLabel(){ var b=$('sortBtn'); if(b) b.textContent=SORT_TITLE[sortState]||'Sort'; }
  function applySortLayout(groups){
    withFlip(function(){
      handOrder=[]; groups.forEach(function(g){ g.forEach(function(c){ handOrder.push(c.id); }); });
      if(!pick){ layout=groups.map(function(g){ return {id:newGid(), cards:g}; }); selected={}; }
    });
  }
  function flipSort(){
    if(peeking) return;                               // no reordering while reviewing

     * return early on `state.turn!==YOU || busy`, so you could not tidy your hand while waiting for the other
     * players — which is exactly when you want to. Aj: "i always wondered why i could not sort my hand while
     * the other players where taking their turns". Peeking still refuses, because peek is inspect-only. */
    var target=SORT_NEXT[sortState]||'singles';
    var hand=state.players[YOU].hand.slice();
    var groups = target==='pairs' ? sortIntoPairs(hand) : target==='straights' ? sortIntoStraights(hand) : E.sortHand(hand).map(function(c){ return [c]; });
    applySortLayout(groups);
    sortState=target; updateSortLabel();   // label shows the arrangement now applied
  }

  function endGame(){

    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ /* the host will push it */ }

        '<div class="respOpts"><button id="againBtn" class="respQuick" style="text-align:center;">'+(MP()?'New Game':'New Duel')+'</button>'+

  var overlayDismiss=null;   // set to a fn by dismissible modals (Card Codex); backdrop click invokes it. null = not dismissible (e.g. duel setup)
  /* RESETS THE CLASS LIST. Two dialogs widen themselves by adding a class after this call (the Codex, and the

  function showModal(html, cls){ overlayDismiss=null; closeCardFull(); var m=$('modal'), ov=$('overlay');

  // Quicks lesson (Full mode): an interactive Counter Spell demo — the Rival casts a Technique, you cancel it.

  /* ONE DEFINITION for both halves of the Quicks lesson, and the two halves are COUPLED: `tutRigQuicks`
   * stocks the Rival's hand with counterable Techniques and `tutCastRivalTech` then searches that hand for one.
   * They each carried a byte-identical copy of this test until v1.31.73. Had they drifted, the rig would stock
   * cards the show cannot find, `tutCastRivalTech` would hit its `if(!tech) return;` and the Counter Spell
   * lesson would silently teach nothing — no error, no failed assertion, just a dead cue. */
  function tutIsTech(c){ var e=E.effectOf(c); return e && e.impl && !e.quick && e.type && /Technique/.test(e.type) && ['draw','ramp','valueBoost','reclaim'].indexOf(e.kind)>=0; }
  function tutRigQuicks(st){
    var me=st.players[0], foe=st.players[1];

    var pool=me.hand.concat(me.deck), hand=[];
    var cs=tutPull(pool,4,'D') || tutPullShield(me,pool,4,'D'); if(cs) hand.push(cs);   // 4♦ = Counter Spell — see tutPullShield: it can be behind a shield
    while(hand.length<E.START_HAND && pool.length) hand.push(pool.shift());
    me.hand=hand; me.deck=pool;
    me.energy=[]; ['D','D','C','H','S'].forEach(function(su){ var c=tutPullDeck(me,su); if(c) me.energy.push(c); });   // 2♦ + 3 any → affords Counter Spell (cost 4)
    // RIVAL: hold a couple of cheap counterable Techniques + energy so tutCastRivalTech always has one to fire.
    var fpool=foe.hand.concat(foe.deck), fhand=[];
    for(var t=0;t<fpool.length && fhand.length<3;t++){ if(tutIsTech(fpool[t])){ fhand.push(fpool[t]); } }
    fhand.forEach(function(c){ var i=fpool.indexOf(c); if(i>=0) fpool.splice(i,1); });
    while(fhand.length<E.START_HAND && fpool.length) fhand.push(fpool.shift());
    foe.hand=fhand; foe.deck=fpool;

  function tutPrepQuick(){

  // The "show": make the Rival cast a Technique now, opening YOUR Respond? window with Counter Spell offered.
  function tutCastRivalTech(){
    var foe=state.players[RIVAL];
    /* TRY EVERY CANDIDATE, never just the first. This picked `filter(tutIsTech)[0]` and gave up if that one
     * card would not cast — and whether it casts depends on the deal (the Rival's energy must cover its cost
     * and colour). About one game in eight the first candidate was unaffordable, `E.activate` returned
     * `ok:false`, and the lesson sat on step 2 telling the player to counter a Technique that was never cast.
     * Silent: no error, and the step's own gate meant the lesson could never be finished. Fixed in v1.31.73.
     * Same shape as the deal-dependence that made three netplay SUITES flake — here it was the product. */
    var cands=foe.hand.filter(tutIsTech);
    for(var k=0;k<foe.deck.length;k++){ if(tutIsTech(foe.deck[k])) cands.push(foe.deck[k]); }   // deck cards are pulled into hand only once one casts
    var g=gen, savedTurn=state.turn, tech=null, r=null, name='a Technique';
    for(var ci=0; ci<cands.length; ci++){
      var cand=cands[ci], fromDeck=foe.deck.indexOf(cand);
      if(fromDeck>=0){ foe.deck.splice(fromDeck,1); foe.hand.push(cand); }
      state.turn=RIVAL;
      var rr=E.activate(state, RIVAL, cand.id);
      if(rr && rr.ok!==false){ tech=cand; r=rr; name=(E.effectOf(cand)||{}).name||'a Technique'; break; }
      if(fromDeck>=0){ var hi=foe.hand.indexOf(cand); if(hi>=0) foe.hand.splice(hi,1); foe.deck.splice(fromDeck,0,cand); }   // put an unusable deck card back
      state.turn=savedTurn;
    }
    if(!tech){ state.turn=savedTurn; render(); return; }
    /* PRESENT IT THE WAY A REAL DUEL DOES. This called bare `flashArt` and then opened the Respond? modal in the
     * same frame, so the cast was never actually visible — Aj: "i never see the opponent's card being cast".
     * An ordinary duel does not have this problem because the prompt waits for `playBeats` to finish, and
     * `buildOppBeats` pairs `revealEffect` with `revealDwell`; the tutorial bypassed that layer and hand-rolled
     * its own presentation. Using the same pair also drops the card into the READER, which is the thing you
     * need to read before deciding whether to counter. */
    revealEffect(tech, 'Rival');
    logMsg('<b>Rival</b> casts <b>'+name+'</b>.', 'rival');
    render();
    if(state.pending && state.respondFor===YOU){
      tutAwaitCounter=true;
      setMessage('The Rival cast <b>'+name+'</b> — spring <b>Counter Spell</b>!');
      /* SETTLE THE CHAIN, THEN hand the turn back. This used to jump straight to `state.turn=YOU`, skipping
       * `settleWindows` — the one thing every other `promptHumanResponse` call site chains. Countering opens a
       * window for the RIVAL to answer your Counter Spell, and with nothing draining it the duel was left
       * `pending=true, respondFor=1` forever: the lesson still showed its "Countered!" payoff and still marked
       * itself complete, then handed the player a board that could never take another action. Fixed v1.31.73. */
      /* DWELL BEFORE THE MODAL — `revealDwell` is the same 2650ms/1200ms the real beats use, so a change to the
       * flash's phasing moves both together instead of leaving the tutorial behind. Reduced motion is honoured
       * because revealDwell honours it. */
      return setTimeout(function(){
        if(g!==gen) return;
        promptHumanResponse(g, function(){ settleWindows(g, function(){ if(gen===g){ state.turn=YOU; render(); } }); });
      }, revealDwell(tech));
    } else { state.turn=savedTurn; render(); }
  }

  /* THE 2 lesson (Full mode). The 2 carries more rules than any other card and they CONTRADICT each other on
   * first hearing: it is the apex at sizes 1-3, and the LOW card in plays of four or more. Telling someone that
   * twice does not land it — so the lesson shows the SAME THREE 2s winning nothing as a full house right after
   * a lone 2 has beaten an Ace.
   * The engine is explicit about the mechanism (`detectCombo`: `cards.map(seqValue)`, "222XX is the SMALLEST
   * full house under 'low'"), and it is invisible on screen: a full house is ranked by its TRIO, and nothing in
   * the UI says so. That is the step this lesson exists for. */
  var tutTwoId=null, tutFhIds=null, tutBoostId=null, tutAceId=null, tutPairIds=null;
  /* AN ILLEGAL DECK, ON PURPOSE (Aj, 2026-09-01: *"let's make an illegal deck really. can we do that?"*).
   * The lesson needs the Rival to hold SIX 2s across three rounds — one to beat your Ace, two for the pair that
   * takes the initiative back, three for the full house — and a legal seat has four. So the tutorial fabricates
   * cards. This is not a hack: a CLASS deck already ships duplicate rank+suit with distinct ids (`7D#24`), the
   * art is keyed `rank+suit` with the id only as a fallback, and `EFFECTS` is read by suit+rank — so a copy
   * renders, names and plays exactly like the original. Verified before building: a fabricated trio of 2s
   * detects as `trio`, a pair of 2s beats a pair of Aces, and 222+33 is a `fullhouse` of value 2.
   * EVERY CARD EITHER SIDE WILL DRAW IS LISTED HERE. The hand math is exact — you spend 10 cards over three
   * rounds and are dealt exactly 10 — so nothing may be left to the shuffle. */
  function tutCard(rank, suit, tag){ return { rank:rank, suit:suit, id:rank+suit+'#'+tag }; }
  /* Remove from `deck` any card whose rank+suit a fabricated `hand` card already occupies, so a later draw can
   * never put a visible duplicate in front of the player. */
  function tutDropDupes(deck, hand){
    var used={}; hand.forEach(function(c){ used[c.rank+c.suit]=1; });
    return deck.filter(function(c){ return !used[c.rank+c.suit]; });
  }
  function tutRigTwos(st){
    var me=st.players[0], foe=st.players[1];

    /* ---- YOU. R1: lead an Ace, activate the boost, play your 2. R2: lead a pair of Aces.
     *      R3: the full house that out-ranks their 2s. Drawn cards complete it exactly. */
    /* THE BOOST CARD MUST NOT BE AN ACE. The cheapest boost in the game is A♥ Imbue with Power — and this
     * lesson asks you to "lead your Ace" and later "lead your pair of Aces", so handing you a fourth Ace that
     * is really the boost makes both instructions ambiguous and can spend the boost as a jab. Same trap that
     * bit the Rival's opening lead; it belongs to whoever is provisioning, not to whoever is playing. */
    var boost=null, bcost=99;
    me.hand.concat(me.deck).forEach(function(c){ var e=E.effectOf(c);
      if(c.rank===1) return;
      if(e && e.impl && !e.quick && e.kind==='valueBoost'){ var k=E.activationCost(c); if(k<bcost){ bcost=k; boost=c; } } });
    if(!boost) boost=tutCard(3,'C','tb');                      // 3♣ Brilliant Tactic (+2) — cheapest that is not an Ace
    tutTwoId='2S#t0'; tutBoostId=boost.id; tutAceId='1S#t1'; tutPairIds=['1D#t2','1C#t3'];
    /* EVERYTHING IS DEALT UP FRONT — ten cards, exactly what the lesson spends, and `MAX_HAND` is 10 so none of
     * it is trimmed. An earlier version put the last four on top of the deck for rounds 2 and 3 to draw, and
     * they never arrived: LOSING A ROUND MILLS YOUR OWN DECK INTO ENERGY (the catch-up), and you lose round 2 of
     * this lesson by design — so the catch-up ate the very cards the finale needed. Draws and catch-up both take
     * from the top, so no ordering survives both. Holding it all from the start depends on neither. */
    me.hand=[ tutCard(1,'S','t1'), boost, tutCard(2,'S','t0'),                    // round 1: lead, boost, win
              tutCard(1,'D','t2'), tutCard(1,'C','t3'),                           // round 2: the pair of Aces
              tutCard(5,'D','t4'), tutCard(5,'H','t5'), tutCard(5,'C','t6'),      // round 3: the full house that
              tutCard(7,'D','t7'), tutCard(7,'H','t8') ];                         //          out-ranks their 2s
    tutFhIds=['5D#t4','5H#t5','5C#t6','7D#t7','7H#t8'];
    /* STRIP THE REALS THAT THE FABRICATIONS DUPLICATE. Every fabricated card copies a rank+suit that already
     * exists in the seat's 52, so the original is still in the deck and gets DRAWN — Aj saw his own hand holding
     * two 5♦ and two 5♥. The deck is illegal on purpose; the player's HAND should never look it. */
    me.deck=tutDropDupes(me.deck, me.hand);
    me.energy=[]; for(var q=0;q<12;q++) me.energy.push({ rank:4, suit:'CDHS'[q%4], id:'t2Y'+q });   // the boost must be affordable

    /* ---- THE RIVAL. Six 2s: one answers your Ace, two take the round back, three build the full house.
     *      The pair that completes it arrives on round 2's draw. */
    /* ORDERED SO EVERY INDIVIDUAL PLAY USES DISTINCT SUITS. Six 2s cannot come from four suits without repeats,
     * but the pilot takes them in hand order — one, then two, then three — so 2♥ / 2♠+2♣ / 2♦+2♥+2♠ means no
     * single play on the table ever shows the same card twice. The deck is illegal; the board is not. */
    foe.hand=[ tutCard(2,'H','r1'),                                               // round 1: answers your Ace
               tutCard(2,'S','r2'), tutCard(2,'C','r3'),                           // round 2: the pair
               tutCard(2,'D','r4'), tutCard(2,'H','r5'), tutCard(2,'S','r6'),      // round 3: the trio
               tutCard(3,'D','r7'), tutCard(3,'C','r8') ];                         // the pair its full house rides on
    foe.deck=tutDropDupes(foe.deck, foe.hand);
    foe.energy=[]; for(var e2=0;e2<12;e2++) foe.energy.push({ rank:4, suit:'CDHS'[e2%4], id:'t2E'+e2 });

  }

  /* NOTHING IS SCRIPTED HERE ANY MORE. Two preps used to force the Rival's boosted answer and its full-house
   * lead; both are deleted. They could not work: the framework defers a GATED step's prep until the player's
   * turn, so they fired after the AI had already acted — and forcing the lead meant `state.pile=null`, which let
   * the Rival replace its OWN jab while the message still read "Rival played a Jab." Aj caught that from the
   * board. The rig puts the cards in hand and a knight-tier opponent plays them in the right order by itself
   * (measured: boost 20/20, full-house lead 20/20, Ace opening 25/25). */
  /* THE PILOT for "The 2" — deterministic, and the whole reason the lesson can promise what it shows.
   * It answers three situations and passes otherwise, mirroring the AI's own log shape:
   *   { play:'BOOST', card }  ·  { fight:'play', combo }  ·  { fight:'pass', result }
   * so `buildOppBeats` paces and narrates it exactly like a real opponent's turn.
   * Boost-then-play is ONE turn here on purpose: the AI's version suspends on the counterable Technique's
   * response window and then passes, wasting the card (a real bug, filed). The pilot activates and plays in the
   * same breath, which is what a competent opponent would do and what the lesson's text claims happened. */
  /* THE PILOT for "The 2" — a situation table, deterministic, reading the HAND only (the rig owns the cards).
   * The sequence it produces is the lesson, in Aj's order:
   *   R1  you lead an Ace  ->  it answers with a 2        (the 2 is the top single)
   *       you boost and play your 2 -> it passes           (…but a boost still tops it) — you take the lead
   *   R2  you lead a pair of Aces -> it answers with a PAIR OF 2s  (still apex at two cards) — it takes the lead
   *   R3  it leads 222 + a pair    -> you beat it          (…and at five cards the 2 is the LOWEST)
   * Emits the AI's own log shapes so `buildOppBeats` paces and narrates it like any opponent turn. */
  function tutPilotTwos(st, p){
    var log=[], pl=st.players[p], cur=st.pile ? st.pile.combo : null;
    function play(cards){ var r=E.play(st, p, cards); if(r && r.ok!==false){ log.push({ fight:'play', combo:r.combo }); return true; } return false; }
    function twos(n){ return pl.hand.filter(function(c){ return c.rank===2; }).slice(0, n); }
    /* ANY rank but the 2 — INCLUDING ACES. This scanned 3..13 and so could not see a pair of Aces, which by
     * round 3 is often the only pair the Rival holds; it then had no full house to lead and passed forever.
     * The baggage on a full house is just baggage: 222+AA is as small a full house as 222+33, because the shape
     * is ranked by its TRIO. */
    function pairOf(skip){ var by={}, order=[1], r;
      for(r=3;r<=13;r++) order.push(r);
      pl.hand.forEach(function(c){ if(c.rank!==skip) by[c.rank]=(by[c.rank]||[]).concat([c]); });
      for(r=0;r<order.length;r++){ var k=order[r]; if(by[k] && by[k].length>=2) return by[k].slice(0,2); }
      return null; }

    if(!cur){
      /* LEADING — only ever happens in round 3, after its pair of 2s took the round back. */
      var t3=twos(3), pr=pairOf(2);
      if(t3.length===3 && pr && play(t3.concat(pr))) return log;
    } else if(cur.size===1 && cur.cards[0].rank!==2){
      /* ANY single, not just the Ace. The step asks you to lead your Ace, but its gate takes any single — and a
       * player who leads something else must still see the 2 answer it, because the 2 beats ANY single. Keyed
       * to the Ace, the lesson silently stalled whenever the lead was a 5. */
      var t1=twos(1);
      if(t1.length===1 && play(t1)) return log;
    } else if(cur.size===2 && cur.cards[0].rank===1){
      var t2=twos(2);                                    // your pair of Aces — answer with a pair of 2s
      if(t2.length===2 && play(t2)) return log;
    }
    /* Anything else — notably your BOOSTED 2, which nothing it holds can beat, since ties never win. */
    var pres=E.pass(st, p);
    log.push({ fight:'pass', result:pres });
    return log;
  }

  var rulesPanelOpen=null;   // opts of the live ⚗️ panel, so an incoming suggestion can repaint it in place

  function showRules(opts){

     * lobby) writes THIS DEVICE's picks and sends them to the host as a suggestion — the controls always edit
     * your own opinion, and when you are the one setting the rules your opinion IS the rule. `readonly`
     * (mid-game) writes nothing. */
    var sug=!!opts.suggest && !ro, src=sug?MY_RULES:RULES;

     * became four. The row keeps no chip at all. */
    function scopeOf(keys){
      var d=RULE_DEFS.filter(function(x){ return keys.indexOf(x.key)>=0; })[0];
      return '<span class="ruleScope">'+(d && d.duel ? 'all player counts' : '3–6 players')+'</span>';
    }
    /* READING IS NEVER DISABLED — not even mid-game, and not for a client. Every other control in this panel is
     * dead in read-only mode; the whole point of the note is to explain the rules you are playing under, so the

    function qMark(d){ return '<span class="ruleQ" role="button" tabindex="0" aria-expanded="false" data-note-for="'+
                              d.key+'" title="What does this do?">?</span>'; }
    /* `needsAny` — inert while none of its group is on (Aj: "this option should uncheck if chops were not
     * available"). A checked box that cannot do anything is worse than a greyed one, so the control is dead
     * until it means something, and the handler clears it when the last of the group goes off. */
    /* `deadIf` — the MIRROR of needsAny: inert while the named rule IS on, because the answer it gives has
     * stopped meaning anything. `highTwos` asks where the 2 RANKS inside a chain; `noSeqTwos` removes the 2
     * from chains, so there is nothing left to rank. Same treatment either way: dead rather than checked-and-
     * powerless, and cleared when it goes dead so a stale tick cannot travel in `rulesKey()`. */
    function depOk(d){
      if(d.deadIf && src[d.deadIf]) return false;

    function rowHTML(d){

       * whole point of the mode (see RULE_DEFS). It still carries data-rule so the suites enumerate it. */
      /* In suggest mode the row shows what is IN PLAY when it differs from your pick, so an editable control
       * can never be mistaken for the rules of the game — the one real misreading risk in this whole feature. */
      var liveTag = (sug && src[d.key]!==RULES[d.key])
        ? '<span class="ruleLive">in play: '+esc(valLabel(d,RULES[d.key]))+'</span>' : '';
      var voteTag = voteHTML(d,votes);

                 ' data-mode-for="'+d.key+'" data-mode-v="'+m.v+'" role="radio" aria-checked="'+
                 (src[d.key]===m.v?'true':'false')+'">'+m.label+'</button>';

        return '<div class="settingRow modeSetting'+(ruleOnIn(src,d)?' on':'')+(ro?' ro':'')+'" data-rule="'+d.key+'" data-mode="1">'+
          '<span class="settingBody"><span class="settingLbl">'+d.label+qMark(d)+'</span>'+
          '<span class="settingNote">'+d.note+'</span>'+liveTag+voteTag+'</span>'+
          '<span class="segToggle" role="radiogroup" aria-label="'+d.label+'">'+segs+'</span></div>';
      }

      return '<button type="button" class="settingRow'+(on?' on':'')+((ro||dead)?' ro':'')+'" data-rule="'+d.key+'"'+
        ((ro||dead)?' disabled':'')+' role="switch" aria-checked="'+(on?'true':'false')+'">'+
        '<span class="settingBox">'+(on?'✓':'')+'</span>'+
        '<span class="settingBody"><span class="settingLbl">'+d.label+qMark(d)+'</span>'+

     * desktop. because really you can fit more with all this real estate"). Scoped to this panel by class, NOT
     * applied to `.modal`, which every dialog in the game shares. */
    function presetsHTML(){
      return '<span class="ruleBulk"><span class="bulkLbl">Presets</span>'+RULE_PRESETS.map(function(pr){
        return '<button type="button" class="bulkBtn'+(presetActive(pr,src)?' active':'')+'" data-preset="'+pr.key+
               '" title="'+esc(pr.title)+'"'+(ro?' disabled':'')+'>'+esc(pr.label)+'</button>';
      }).join('')+'</span>';
    }
    function sectionsHTML(){
      var claimed={}, out='';
      RULE_SECTIONS.forEach(function(sec){
        var rows=sec.keys.map(function(k){ return RULE_DEFS.filter(function(d){ return d.key===k; })[0]; })
                         .filter(function(d){ return !!d; });
        if(!rows.length) return;
        rows.forEach(function(d){ claimed[d.key]=1; });
        out+=(sec.presets?presetsHTML():'')+
             '<div class="ruleSect"><span class="sectName">'+esc(sec.title)+'</span>'+scopeOf(sec.keys)+'</div>'+
             rows.map(rowHTML).join('');
      });
      var left=RULE_DEFS.filter(function(d){ return !claimed[d.key]; });
      if(left.length) out+='<div class="ruleSect"><span class="sectName">Uncategorised</span></div>'+left.map(rowHTML).join('');
      return out;
    }
    showModal('<h2>⚗️ '+(sug?'Rules &amp; suggestions':'Custom rules')+'</h2>'+
      /* NO ROW COUNTING. This sentence said "the first four … the last three", then four, then five — it went
       * stale every time a rule was added, and twice shipped wrong. Every row already carries its own scope
       * tag, which is asserted, so point at those instead of restating them positionally. */
      '<p class="ruleIntro">Mostly not the default or intended way to play — but certainly <i>a</i> way to play. '+
        '<b>Each section says which player counts its rules affect.</b></p>'+
      (sug ? '<div class="netmsg">The <b>host</b> sets the rules for the table. What you pick here is a '+
             '<b>suggestion</b> — everyone can see it, including the host, who decides.</div>' : '')+
      (ro ? '<div class="netmsg">'+(opts.why||'These are the rules this game is using. Rules are chosen before a game starts.')+'</div>' : '')+
      '<div class="settings">'+sectionsHTML()+'</div>'+
      /* Deliberately unspecific (Aj: "no need to say which ones haha"). Naming the decks and their win rates is
       * developer detail, and it pre-judges a deck for the player. The measured figures live in the changelog
       * and PATCHNOTES, where they are actually useful. */
      '<p class="ruleWarn">⚠ The Rival is tuned for the default rules and will not adapt — and some decks are '+
        'much better suited to these rules than others.</p>'+
      /* Clear all sits with Done because both act on the whole panel — and because a lone button above the
       * sections, once the presets moved down, read like a section heading of its own. */
      '<div class="ruleFoot">'+
        '<button type="button" class="bulkBtn clear" id="ruleClear"'+
          ((ro||!RULE_DEFS.some(function(d){ return ruleOnIn(src,d); }))?' disabled':'')+'>Clear all</button>'+
        '<button id="ruleDone">Done</button></div>', 'rulesPanel');
    /* THE BULK ROW IS DERIVED STATE, so any single change has to refresh it — otherwise a preset button stays
     * lit after you toggle one more rule, which is a lie about what is in play, and Clear all stays greyed out
     * after the first rule goes on. The rows patch themselves in place, so this is the one shared touch-up. */
    function syncBulk(){
      Array.prototype.forEach.call(document.querySelectorAll('.bulkBtn[data-preset]'), function(b){
        var p=RULE_PRESETS.filter(function(x){ return x.key===b.getAttribute('data-preset'); })[0];
        b.classList.toggle('active', !!p && presetActive(p,src));
      });
      var c=$('ruleClear'); if(c) c.disabled = !RULE_DEFS.some(function(d){ return ruleOnIn(src,d); });
    }
    /* THE IN-PLAY CHIP IS DERIVED STATE TOO, and the rows patch themselves in place — so without this a
     * suggestion you have just made shows no "in play" line until the host's echo re-renders the panel, and
     * shows none at all if you are not connected. Same bug as the bulk row, one row lower. */
    function syncLive(){
      if(!sug) return;
      RULE_DEFS.forEach(function(d){
        var row=document.querySelector('.settingRow[data-rule="'+d.key+'"]'); if(!row) return;
        var body=row.querySelector('.settingBody'); if(!body) return;
        var el=body.querySelector('.ruleLive'), differs=(src[d.key]!==RULES[d.key]);
        if(differs){

                   body.insertBefore(el, body.querySelector('.ruleVotes')); }

        } else if(el && el.parentNode) el.parentNode.removeChild(el);
      });
    }
    /* ONE commit path. In suggest mode nothing is applied to the engine — the rules in play are the host's —
     * it is saved as this device's preference and sent up the wire. Otherwise your picks are the rules. */
    function commit(){
      if(sug){ saveRules(); netSendSuggest(); }
      else { applyRules(); ownRules(); }
      /* THE APEX 2's CARD TEXT IS DERIVED FROM THE LIVE RULES, so a reader left open while someone toggles
       * `noSeqTwos` or `highTwos` would keep showing the old sentence until they tapped another card — the card
       * quietly lying about the game being played, which is the exact failure the derivation exists to avoid.
       * `showCard` is not part of `render()`, so it has to be re-run here. Aj spotted this while it was being
       * built: "we'll also update the card text when people switch the custom rules in and out."
       * THE REACHABLE CASE IS NARROW AND WORTH NAMING, so this is not later deleted as dead: the panel is
       * read-only while `state && !state.finished`, so it cannot happen mid-game. It happens AFTER a game ends —
       * the finished board and its open reader are still on screen, and ⚙️ Settings → Custom rules becomes
       * editable again. Not covered by a suite (a finished game plus an open reader is expensive to stage);
       * one line, and the derivation it protects IS covered, by `lessontest_twos`. */
      if(typeof cvCard!=='undefined' && cvCard) showCard(cvCard);
    }
    if(!ro) Array.prototype.forEach.call(document.querySelectorAll('.segBtn[data-mode-for]'), function(seg){
      seg.addEventListener('click', function(){
        var k=this.getAttribute('data-mode-for'), v=this.getAttribute('data-mode-v');
        src[k]=v; commit();
        var row=this.closest('.settingRow');
        Array.prototype.forEach.call(row.querySelectorAll('.segBtn[data-mode-for="'+k+'"]'), function(o){
          var act=o.getAttribute('data-mode-v')===v;
          o.classList.toggle('active', act); o.setAttribute('aria-checked', act?'true':'false');
        });
        row.classList.toggle('on', ruleOnIn(src, RULE_DEFS.filter(function(d){ return d.key===k; })[0]));
        syncBulk(); syncLive();
        if(opts.onChange) opts.onChange();
      });
    });
    if(!ro) Array.prototype.forEach.call(document.querySelectorAll('button.settingRow[data-rule]'), function(btn){
      btn.addEventListener('click', function(){
        var k=this.getAttribute('data-rule'), def=RULE_DEFS.filter(function(d){ return d.key===k; })[0];
        src[k]=!src[k];
        /* A dependency moves OTHER rows, so re-open the panel rather than patching this one — the per-row
         * handlers only know how to update themselves (same reason a bulk action re-renders). */
        var moved=false;
        if(src[k] && def && def.needs && !src[def.needs]){ src[def.needs]=true; moved=true; }
        if(!src[k]) RULE_DEFS.forEach(function(o){ if(o.needs===k && src[o.key]){ src[o.key]=false; moved=true; } });
        /* A member of a `needsAny` group moved, so the dependent row's own live/dead state changed — and if the
         * group is now empty the dependent rule is cleared. Either way other rows move, so re-render. */
        RULE_DEFS.forEach(function(o){
          /* `deadIf`: the dependent row's live/dead state flips whichever way this rule moved, so the panel must
           * re-render EITHER WAY — `moved` is not only about a value changing. Clearing the tick without
           * setting it left the row looking on and enabled, which is exactly the "checked but powerless"
           * state the dependency exists to prevent. */
          if(o.deadIf===k){ if(src[k] && src[o.key]) src[o.key]=false; moved=true; }
          if(!o.needsAny || o.needsAny.indexOf(k)<0) return;
          if(!o.needsAny.some(function(x){ return !!src[x]; }) && src[o.key]) src[o.key]=false;
          moved=true;
        });
        commit();
        if(moved){ if(opts.onChange) opts.onChange(); showRules(opts); return; }
        this.classList.toggle('on', !!src[k]);
        this.setAttribute('aria-checked', src[k]?'true':'false');
        this.querySelector('.settingBox').textContent=src[k]?'✓':'';
        syncBulk(); syncLive();
        if(opts.onChange) opts.onChange();
      });
    });
    /* A bulk action moves every row, so re-open the panel instead of patching nine rows in place — the
     * per-row handlers above only know how to update themselves. opts is passed through unchanged, so the
     * read-only flag and the Back target survive. */
    if(!ro){
      Array.prototype.forEach.call(document.querySelectorAll('.bulkBtn[data-preset]'), function(btn){
        btn.addEventListener('click', function(){
          var k=this.getAttribute('data-preset');
          var p=RULE_PRESETS.filter(function(x){ return x.key===k; })[0];
          if(!p) return;
          applyPreset(p,src); commit();
          if(opts.onChange) opts.onChange();
          showRules(opts);
        });
      });
      var clr=$('ruleClear');
      if(clr) clr.addEventListener('click', function(){
        if(!RULE_DEFS.some(function(d){ return ruleOnIn(src,d); })) return;
        clearAllRules(src); commit();
        if(opts.onChange) opts.onChange();
        showRules(opts);
      });
    }
    function closePanel(){ rulesPanelOpen=null; back(); }
    /* Wired unconditionally — see qMark(). Click, not hover: this panel is used on a phone, where hover does
     * not exist. Keyboard gets Enter as well; Space is left alone because inside a <button> row the browser
     * uses it to activate the row itself. */
    Array.prototype.forEach.call(document.querySelectorAll('.ruleQ[data-note-for]'), function(q){
      function toggleNote(e){
        e.preventDefault(); e.stopPropagation();          // never toggle the rule underneath
        var row=q.closest('.settingRow'); if(!row) return;
