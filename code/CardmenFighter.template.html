<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#1a1020" />
<title>Cardmen Fighter</title>
<style>
  :root{
    --headerH:56px;   /* the desktop header. The landscape band overrides it — #disconBar hangs off this. */
    --bg:#160e1e; --bg2:#241633; --line:rgba(255,255,255,.12); --gold:#e8c37a;
    --red:#ff5a5a; --txt:#f2ecf6; --panel:rgba(0,0,0,.3); --good:#43c06a; --bad:#e2624a;
    --nrg:#5ac8fa; --shield:#e8c37a; --pick:#c98bff;
    --cs:1;   /* card scale — grows on wider viewports so cards don't look tiny on big monitors */
    --pm:1;   /* PILE multiplier on top of --cs: the pile shows at most 5 cards, so it can run larger */
  }
  /* Adaptive card sizing: scale playing cards up on large screens (base tuned for laptops/tablets) */
  /* Card scale steps. Playtester on a large screen: "the cards look smol". Measured, they were: at 1920x1080
     a card was 65x94px — 3.4% of the width — with ~970px of board above it mostly empty, because 1920 falls
     just UNDER the old 2000px step. Steps are now denser and gated on min-height as well as min-width, so a
     wide-but-short window (a laptop, a half-height window) does not get cards too tall for its hand row. */
  @media (min-width:560px){  :root{ --pm:1.2; } }
  @media (min-width:1000px){ :root{ --pm:1.45; } }
  @media (min-width:1200px){ :root{ --cs:1.18; --pm:1.6; } }
  /* 1200-1439 is the tightest band: with the battle log open the centre is ~640px wide, and after the rail
     reservation a 5-card pile at --pm:1.6 wrapped. Ease the pile scale here only — these are small screens,
     and the "cards look smol" complaint was about large ones. */
  @media (min-width:1200px) and (max-width:1439px){ :root{ --pm:1.35; } }
  @media (min-width:1440px) and (min-height:800px){ :root{ --cs:1.32; } }
  @media (min-width:1600px) and (min-height:860px){ :root{ --cs:1.5; --pm:1.75; } }
  @media (min-width:1800px) and (min-height:900px){ :root{ --cs:1.68; } }
  @media (min-width:2200px) and (min-height:1000px){ :root{ --cs:1.9; } }
  @media (min-width:2560px) and (min-height:1200px){ :root{ --cs:2.1; } }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--txt); background:radial-gradient(130% 120% at 50% -10%,var(--bg2),var(--bg) 70%);
    display:flex; flex-direction:column; min-height:100dvh; overflow:hidden;}
  header{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px solid var(--line); background:rgba(0,0,0,.25); flex:0 0 auto;}
  header h1{font-size:17px; margin:0; letter-spacing:.5px; color:var(--gold); font-weight:900; white-space:nowrap;}
  header h1 small{color:var(--txt); opacity:.55; font-weight:600; font-size:11px; margin-left:6px;}
  header .spacer{flex:1;}
  header button{font:inherit; font-size:13px; font-weight:700; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 11px; cursor:pointer;}
  header button.primary{background:var(--gold); color:#3a2a08; border-color:transparent;}
  header .diffWrap{display:flex; align-items:center; gap:6px; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.8; color:var(--txt); white-space:nowrap;}
  header select{font:inherit; font-size:13px; font-weight:700; color:var(--txt); background:var(--panel); border:1px solid var(--line); border-radius:9px; padding:7px 9px; cursor:pointer; color-scheme:dark;}
  header select:focus{outline:1px solid var(--gold);}
  header h1, header #helpBtn, header #cheatBtn, header #sfxBtn, header #hintsBtn, header #settingsBtn, header #newBtn{flex:0 0 auto;}   /* title + buttons never shrink or clip */
  header #cheatBtn, header #sfxBtn, header #settingsBtn{font-size:16px; line-height:1;}
  header #sfxBtn.muted{opacity:.5;}
  header #hintsBtn{font-size:12px;}
  header #hintsBtn.on{background:rgba(240,200,80,.18); border-color:var(--gold); color:var(--gold);}
  /* Play-hint classes on hand groups (only when Hints is on) */
  #hand .group.hdead{opacity:.34; filter:grayscale(.5);}
  #hand .group.hbreak{outline:2px dashed rgba(240,200,80,.7); outline-offset:2px; border-radius:10px;}
  #hand .group.hplay{}   /* playable as-is: left normal (no extra emphasis needed) */
  /* Tutorial READ step holds the board: dim the hand (except any spotlighted card) so players read the tip, not tap cards */
  #hand.tutlock .group{ opacity:.32; pointer-events:none; transition:opacity .18s; }
  #hand.tutlock .group.tut-spot{ opacity:1; }
  #newBtn.conceding{ background:#7d2b2b; border-color:#a94848; color:#ffe7e7; }  /* mid-duel the button forfeits — tint it as a danger action */
  .matchupTag{flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}  /* the matchup truncates instead of pushing New Duel off-screen */
  @media (max-width:560px){ header h1 small{display:none;} header .diffWrap{font-size:0; gap:0;} .matchupTag{display:none;} }
  /* narrow phones: the fixed single-row header pushed New Duel off-screen — let it wrap, shrink the title, and
     collapse the wordy Hints toggle to its 💡 icon (its on/off state still reads via the gold highlight). */
  @media (max-width:480px){
    header{flex-wrap:wrap; justify-content:flex-end; gap:6px 8px; padding:8px 12px;}
    /* let the title shrink and wrap to two lines (CARDMEN / FIGHTER) when the button row gets crowded */
    header h1{font-size:15px; white-space:normal; line-height:1.04; flex:0 1 auto; min-width:0;}
    header #hintsBtn{font-size:0; padding:7px 10px;}
    header #hintsBtn::before{content:'💡'; font-size:16px; line-height:1;}
  }

  main{flex:1 1 auto; display:flex; flex-direction:column; min-height:0; padding:8px 10px 0; gap:8px;}
  .fighter{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:8px 12px; display:flex; align-items:center; gap:12px; flex:0 0 auto; flex-wrap:wrap;}
  .fighter.turn{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,195,122,.3);}
  /* --- N-player opponents strip (3–6 players) --- */
  #opponents{display:none; gap:8px; flex:0 0 auto; flex-wrap:wrap; justify-content:center;}
  #opponents.show{display:flex;}
  .oppPanel{flex:1 1 0; min-width:130px; max-width:230px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:6px 9px; display:flex; flex-direction:column; gap:3px; font-size:11px; position:relative; transition:box-shadow .15s,border-color .15s;}
  .oppPanel.turn{border-color:var(--gold); box-shadow:0 0 0 2px rgba(232,195,122,.35);}
  .oppPanel.dead{opacity:.4; filter:grayscale(1);}
  .oppPanel.targetable{cursor:pointer; border-color:var(--pick); box-shadow:0 0 12px rgba(201,139,255,.8); animation:tgtPulse .9s ease-in-out infinite;}
  .fighter.targetable{cursor:pointer; border-radius:12px; outline:2px solid var(--pick); box-shadow:0 0 12px rgba(201,139,255,.8); animation:tgtPulse .9s ease-in-out infinite;}   /* duel: rival panel as a tap-target */
  .oppPanel .oppTop{display:flex; align-items:center; gap:6px; justify-content:space-between;}
  .oppPanel .oppName{font-weight:800; font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .oppPanel .oppSeat{font-size:9px; opacity:.6; font-weight:700;}
  .oppPanel .oppShields{display:flex; gap:3px; flex-wrap:wrap;}
  .oppPanel .oppShields .s{width:12px;height:15px;border-radius:2px 2px 4px 4px; background:var(--shield); box-shadow:inset 0 -2px 0 rgba(0,0,0,.15);}
  .oppPanel .oppShields .s.lost{background:transparent; border:1px solid rgba(255,255,255,.2);}
  .oppPanel .oppStats{display:flex; gap:8px; flex-wrap:wrap; opacity:.9;}
  .oppPanel .oppStats .red{color:var(--bad);}
  .oppPanel .oppGear{font-size:9.5px; opacity:.85; min-height:11px; display:flex; gap:5px; flex-wrap:wrap;}
  .oppPanel .oppGear .g{color:var(--good);} .oppPanel .oppGear .d{color:var(--bad);} .oppPanel .oppGear .f{color:var(--gold);}
  .oppPanel .oppTag{position:absolute; top:5px; right:8px; font-size:9px; font-weight:800; color:var(--gold);}
  .oppPanel .oppDead{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-weight:900; letter-spacing:2px; color:var(--bad); font-size:13px; text-shadow:0 1px 4px rgba(0,0,0,.7);}
  .fighter .who{font-weight:800; font-size:14px; min-width:44px;}
  .shields{display:flex; gap:4px;}
  .shields .s{position:relative; width:16px;height:20px;border-radius:3px 3px 5px 5px; background:var(--shield); box-shadow:inset 0 -3px 0 rgba(0,0,0,.15);}
  .shields .s.lost{background:transparent; border:1.5px solid rgba(255,255,255,.2);}
  /* --- shield shatter + damage shake --- */
  .shields .s.shatter{ background:var(--shield)!important; border:none!important; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15); z-index:1; animation:shieldBreak .64s ease-out forwards; }
  @keyframes shieldBreak{ 0%{transform:scale(1) rotate(0); opacity:1; filter:brightness(1.7);} 18%{transform:scale(1.2) rotate(-4deg); filter:brightness(2.1);} 100%{transform:scale(.35) rotate(10deg); opacity:0;} }
  .shields .s .shards{ position:absolute; inset:0; pointer-events:none; z-index:2; }
  .shields .s .shards i{ position:absolute; left:50%; top:50%; width:5px; height:6px; margin:-3px 0 0 -2px; background:var(--shield); border-radius:1px; opacity:0; animation:shardFly .64s ease-out forwards; }
  .shields .s .shards i:nth-child(1){ --dx:-16px; --dy:-20px; --rot:140deg; }
  .shields .s .shards i:nth-child(2){ --dx:16px;  --dy:-18px; --rot:-120deg; }
  .shields .s .shards i:nth-child(3){ --dx:-14px; --dy:14px;  --rot:90deg; }
  .shields .s .shards i:nth-child(4){ --dx:15px;  --dy:16px;  --rot:-80deg; }
  .shields .s .shards i:nth-child(5){ --dx:0px;   --dy:-25px; --rot:200deg; }
  @keyframes shardFly{ 0%{opacity:1; transform:translate(0,0) rotate(0) scale(1);} 15%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.55);} }
  @keyframes shieldShake{ 0%,100%{transform:translateX(0);} 15%{transform:translateX(-4px);} 30%{transform:translateX(4px);} 45%{transform:translateX(-3px);} 60%{transform:translateX(3px);} 78%{transform:translateX(-2px);} }
  .shields.shake-shield{ animation:shieldShake .46s ease-in-out; }
  @media (prefers-reduced-motion: reduce){ .shields .s.shatter{animation:none;} .shields.shake-shield{animation:none;} .shields .s .shards{display:none;} }
  .stat{font-size:12px; opacity:.9; display:flex; align-items:center; gap:4px; white-space:nowrap;}
  .stat b{color:var(--nrg); font-weight:800;}
  .stat.deck b{color:var(--gold);}
  /* REWORK Forms & Rides Zone — on-table, left edge (rival top-left, you bottom-left) */
  .formZone{position:absolute; left:8px; display:none; flex-direction:column; gap:5px; align-items:flex-start; z-index:3; pointer-events:none; max-width:min(46%,188px);}
  #rivalFormZone{top:30px;} #youFormZone{bottom:4px;}
  .formZone .zoneLbl{font-size:.62rem; letter-spacing:.09em; text-transform:uppercase; opacity:.5; font-weight:700; padding-left:3px;}
  .formZone .formRow{pointer-events:auto; display:flex; flex-wrap:wrap; gap:5px;}
  .formZone .card.formMini{width:40px; min-width:40px; height:56px; border-radius:7px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,.45); border:1.5px solid rgba(140,130,235,.65);}
  .formZone .card.formMini.ride{border-color:rgba(255,196,60,.7);}
  .formZone .card.formMini .idx{font-size:.62rem;}
  .formZone .card.formMini.targetable{border-color:var(--bad); box-shadow:0 0 0 2px var(--bad), 0 0 12px rgba(226,98,74,.5); animation:superPulse 1.1s ease-in-out infinite;}
  .formZone .formStrip{pointer-events:auto; cursor:pointer; display:flex; flex-wrap:wrap; gap:4px; align-items:center;}
  .formZone .formChip{font-size:.72rem; font-weight:800; line-height:1; padding:3px 7px; border-radius:6px; background:linear-gradient(180deg,rgba(120,110,220,.22),rgba(20,18,32,.9)); border:1px solid rgba(140,130,235,.6); box-shadow:0 1px 4px rgba(0,0,0,.4);}
  .formZone .formChip.ride{border-color:rgba(255,196,60,.65); background:linear-gradient(180deg,rgba(255,196,60,.2),rgba(20,18,32,.9));}
  .formZone .formChip .sr{color:#ff9a9a;}
  .formZone .formStrip .superBadge.mini{cursor:pointer; align-self:flex-start; padding:3px 9px; font-size:.66rem;}
  .superBadge{align-self:stretch; text-align:center; font-weight:800; font-size:.72rem; letter-spacing:.06em; color:#1a1330; background:linear-gradient(90deg,#ffd24a,#ffb020); border-radius:8px; padding:3px 8px; box-shadow:0 0 12px rgba(255,196,60,.6); animation:superPulse 1.4s ease-in-out infinite;}
  .superLine{display:block; margin-top:6px; font-weight:800; letter-spacing:.04em; color:#ffd24a; text-shadow:0 0 10px rgba(255,196,60,.55);}
  @keyframes superPulse{0%,100%{opacity:1;}50%{opacity:.6;}}
  /* on-board equipment zones (top = Rival, bottom = You) */
  /* equipment sits out of the way on the RIGHT edge (rival top-right, you bottom-right), stacking downward */
  .equipZone{position:absolute; right:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; z-index:3; pointer-events:none; max-width:min(48%,180px);}
  #rivalEquipZone{top:4px;} #youEquipZone{bottom:4px;}
  .equipZone .eq{pointer-events:auto; cursor:pointer; position:relative; overflow:hidden; display:flex; flex-direction:column; align-items:center; gap:2px; min-width:104px; max-width:168px; padding:7px 12px; border-radius:11px; background-color:var(--panel); background-size:cover; background-position:center 30%; border:1px solid var(--line); box-shadow:0 2px 6px rgba(0,0,0,.3);}
  .equipZone .eq.buff:not(.hasArt){border-color:rgba(67,192,106,.7); background-image:linear-gradient(180deg,rgba(67,192,106,.16),rgba(20,18,32,.9));}
  .equipZone .eq.debuff:not(.hasArt){border-color:rgba(226,98,74,.7); background-image:linear-gradient(180deg,rgba(226,98,74,.16),rgba(20,18,32,.9));}
  .equipZone .eq.buff.hasArt{border-color:rgba(67,192,106,.85);}
  .equipZone .eq.debuff.hasArt{border-color:rgba(226,98,74,.85);}
  .equipZone .eq.hasArt{border-width:1.5px;}
  .equipZone .eq.hasArt .eqName, .equipZone .eq.hasArt .eqEff, .equipZone .eq.hasArt .eqCtr{text-shadow:0 1px 3px rgba(0,0,0,.95), 0 0 6px rgba(0,0,0,.7);}
  .equipZone .eqName{font-size:13.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; color:#fff;}
  .equipZone .eqEff{font-size:11.5px; opacity:.92; white-space:nowrap; color:#e8edf5;}
  .equipZone .eqCtr{font-size:12px; font-weight:800; opacity:.95; letter-spacing:.5px;}
  .equipZone .eqCtr b{font-size:13.5px;}
  .equipZone .eq.eqFlash{ box-shadow:0 0 0 3px var(--gold), 0 0 22px 6px rgba(255,196,60,.85) !important; transform:scale(1.06); transition:transform .18s ease, box-shadow .18s ease; z-index:5; }   /* counter changed — hold a bright glow so the eye catches it */
  .equipZone .eq.eqSpent{ opacity:.72; filter:grayscale(.35); }
  .equipZone .eq.eqSpent .eqGone{ color:#c9b58a; font-weight:800; letter-spacing:.5px; text-transform:uppercase; font-size:10px; }
  .equipZone .eq.buff .eqCtr{color:var(--good);} .equipZone .eq.debuff .eqCtr{color:var(--bad);}
  .equipZone .eq.targetable{cursor:pointer; outline:2px solid var(--pick); box-shadow:0 0 12px rgba(201,139,255,.75); animation:tgtPulse .9s ease-in-out infinite;}
  .equip{display:flex; gap:5px; flex-wrap:wrap;}
  .equip .e{font-size:10px; font-weight:800; padding:2px 6px; border-radius:10px; border:1px solid var(--line);}
  .equip .e.targetable{cursor:pointer; outline:2px solid var(--pick); box-shadow:0 0 10px rgba(201,139,255,.7); animation:tgtPulse .9s ease-in-out infinite;}
  @keyframes tgtPulse{0%,100%{box-shadow:0 0 6px rgba(201,139,255,.5);}50%{box-shadow:0 0 14px rgba(201,139,255,.9);}}
  .equip .e.buff{color:var(--good); border-color:rgba(67,192,106,.5);}
  .equip .e.debuff{color:var(--bad); border-color:rgba(226,98,74,.5);}

  /* desktop = 3 columns: collapsible log LEFT · fight table CENTER · card description RIGHT */
  /* desktop grid: log (left, full height of the play area) · table · description; hand full-width below */
  #board{flex:1 1 auto; min-height:0; display:grid; gap:10px;
    grid-template-columns:auto minmax(0,1fr) clamp(240px,28vw,380px);
    grid-template-rows:minmax(0,1fr) auto;}
  #board > #logWrap{grid-column:1; grid-row:1;}
  #board > #table{grid-column:2; grid-row:1;}
  #board > #side{grid-column:3; grid-row:1;}
  #board > #handWrap{grid-column:1 / span 3; grid-row:2;}
  #table{flex:1 1 auto; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; min-height:0; position:relative;}
  #pileLabel{font-size:12px; text-transform:uppercase; letter-spacing:.5px; opacity:.7; min-height:15px;}
  #pile{display:flex; gap:6px; min-height:70px; align-items:center; justify-content:center; flex-wrap:wrap;}
  /* The play area's LEFT rail holds the rival's forms (top), the "last played" stash (middle) and your forms
     (bottom); the RIGHT rail holds the equipment zones. The pile is centred in the whole area, so as it grew it
     started colliding with the stash — worst when the battle log is open and the area is narrow. Reserve both
     rails so the pile centres in the clear band instead. Desktop only: the rails are laid out differently below
     1200px, and phones need every pixel. */
  /* Asymmetric on purpose: the stash is a fixed-width strip on the LEFT (5 x 30px tiny cards + gaps ~176px),
     while the right rail's equip zones sit top/bottom and never met the vertically-centred pile (measured
     267px+ of slack). Reserving both sides squeezed the band enough to wrap the pile at 1440 with the log
     open, so only the left is reserved, and by a fixed amount rather than a vw that grows past its need. */
  /* Keep the pile CENTRED with its label and message, but stop it reaching the rails: narrow the BOX and
     centre it, rather than padding it (padding shifts the content, which put a 1-card pile off-centre — Aj
     caught both). The stash is slimmed to 3-per-row below so this reservation still leaves room for 5 big
     cards even at 1440 with the battle log open. */
  @media (min-width:1200px){ #pile{ width:100%; box-sizing:border-box; max-width:calc(100% - 260px); margin-inline:auto; } }
  #pile .empty{opacity:.4; font-style:italic; font-size:13px;}
  #stackView{display:none; flex-direction:column; gap:3px; align-items:center; margin:3px 0;}
  #stackView .stk{font-size:11px; padding:2px 9px; border-radius:8px; border:1px solid var(--line); background:rgba(255,255,255,.05); opacity:.9;}
  #stackView .stk.top{border-color:var(--gold); box-shadow:0 0 8px rgba(232,195,122,.4);}
  #stackView .stk.countered{text-decoration:line-through; opacity:.5;}
  #stackView .stk .who{opacity:.6;}
  #message{font-size:13.5px; text-align:center; min-height:20px; padding:0 8px; max-width:520px;}
  #message b{color:var(--gold);}
  #roundTag{position:absolute; top:6px; left:12px; font-size:11px; font-weight:800; letter-spacing:.4px; opacity:.6;}

  /* --- right column: card description (image on top, text below; fills the column, scrolls long text) --- */
  #side{flex:0 0 clamp(240px,28vw,380px); display:flex; flex-direction:column; gap:8px; min-height:0;
    border-left:1px solid var(--line); padding-left:10px; position:relative;}
  /* big card face on TOP, description text BENEATH (a scrolling column) */
  #cardView{flex:1 1 auto; background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px;
    display:flex; flex-direction:column; align-items:stretch; gap:12px; min-height:120px; overflow-y:auto;}
  #cardView .cvEmpty{opacity:.45; font-size:13.5px; font-style:italic; margin:auto; text-align:center;}
  #cardView .card.big{flex:0 0 auto; align-self:center;}
  #cardView .cvBigFace{flex:0 0 auto; width:100%; aspect-ratio:375/523; background-size:contain; background-repeat:no-repeat; background-position:top center; border-radius:12px;}
  #cardView .cvBigArt{flex:0 0 auto; width:100%; aspect-ratio:3/2; background-size:cover; background-position:center; border-radius:12px;}   /* raw illustration (layouts retired) */
  #cardView .cvText{flex:0 0 auto; width:100%; min-width:0; text-align:left;}
  #cardView .cvName{font-weight:800; font-size:18px; line-height:1.25;}
  #cardView .cvType{font-size:12px; text-transform:uppercase; letter-spacing:.4px; opacity:.7; margin:4px 0 7px;}
  #cardView .cvType .cost{color:var(--nrg); font-weight:800;}
  #cardView .cvCost{font-size:13.5px; margin:0 0 8px;} #cardView .cvCost b{color:var(--nrg);} #cardView .cvCost .costSpell{opacity:.72; font-size:12.5px;}
  .matchupTag{font-size:12px; opacity:.82; margin-right:8px; white-space:nowrap;}
  .basicsTag{color:#8fd8ff; letter-spacing:.5px;}   /* Basics-mode badge in the matchup line */
  /* ---- Guided tutorial: coach panel + spotlight ---- */
  #tutPanel{position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:80; width:min(500px,calc(100vw - 24px)); background:linear-gradient(180deg,#241533,#1a0f28); border:1px solid var(--gold); border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.6), 0 0 0 1px rgba(240,200,80,.15); padding:14px 16px; display:none; animation:tutIn .25s ease; max-height:calc(100vh - 28px); max-height:calc(100dvh - 28px); overflow-y:auto; overscroll-behavior:contain;}   /* uncapped it grew to 565px and hung 247px off the top of a 320px-tall landscape viewport */
  #tutPanel.show{display:block;}
  @keyframes tutIn{from{opacity:0; transform:translate(-50%,12px);} to{opacity:1; transform:translate(-50%,0);}}

  .nrgGain{ position:absolute; left:50%; bottom:100%; transform:translateX(-50%); margin-bottom:1px; font-size:11px; font-weight:900; color:#8fd8ff; text-shadow:0 1px 3px #000, 0 0 6px rgba(90,200,250,.6); pointer-events:none; white-space:nowrap; animation:nrgFloat 1s ease forwards; }

  /* --- Activate: appears when a single card with an effect is selected --- */

  /* Disconnect / reconnect banner (netplay) — amber alert strip pinned to the top of the table */
  #disconBar{display:none; position:fixed; top:calc(var(--headerH) - 2px); left:50%; transform:translateX(-50%); z-index:400; max-width:92vw;
    background:linear-gradient(180deg,#3a2a08,#241a06); border:1px solid var(--gold); border-radius:12px; box-shadow:0 8px 26px rgba(0,0,0,.55);
    padding:10px 14px; display:none; align-items:center; gap:14px; font-size:14px; color:#ffe9b8;}

  @keyframes dcSpin{to{transform:rotate(360deg);}}

  @keyframes transformPulse{ 0%,100%{ filter:drop-shadow(0 0 4px rgba(255,196,60,.75)); } 50%{ filter:drop-shadow(0 0 10px rgba(255,196,60,1)); } }

  /* one context-aware button — normal when usable, greyed when not (no special highlight) */
  #ctxBtn.off{background:var(--panel); color:var(--txt); opacity:.5; border-color:var(--line); cursor:not-allowed;}

  /* z-index ABOVE #netroot (99999) and its Leave button. A modal is the topmost UI by definition, and while a
   * netplay lobby is on screen netroot covers everything — so at z-index 30 the Custom rules modal opened
   * correctly and was simply invisible behind it. Nothing in the DOM looked wrong, which is exactly why
   * nettest_rules passed: it asserted the modal's DOM, and DOM existence cannot see a stacking bug. */
  .overlay{position:fixed; inset:0; background:rgba(10,4,16,.8); backdrop-filter:blur(3px); display:none; align-items:center; justify-content:center; z-index:100000; padding:20px;}
  .overlay.show{display:flex;}
  /* A modal taller than the viewport used to be CENTRED with no cap and no overflow, so it hung off the top AND
   * the bottom and the top half was unreachable — there was nothing to scroll. Measured on the setup dialog,
   * which is 812px tall: it clipped at 568x320 (top -246), at 844x390, at 667x375 AND at desktop 1280x800.
   * Capping the height lets it scroll INSIDE itself, so centring stays correct at every size. `dvh` second so
   * it wins where supported (mobile browser chrome) and `vh` covers the rest. */
  .modal{background:linear-gradient(180deg,#2a1840,#1b1026); border:1px solid var(--gold); border-radius:18px; padding:24px; max-width:470px; width:100%; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.55);
         max-height:calc(100vh - 40px); max-height:calc(100dvh - 40px); overflow-y:auto; overscroll-behavior:contain;}
  .modal h2{margin:0 0 8px; color:var(--gold); font-size:26px;}
  .modal p{font-size:14px; line-height:1.55; margin:6px 0;}
  .modal .rules{text-align:left; font-size:12.5px; line-height:1.5; opacity:.95; max-height:56dvh; overflow:auto; margin:10px 0;}
  .modal .rules li{margin:5px 0;}
  .modal .rules h3{font-size:13px; color:var(--gold); margin:14px 0 4px; padding-bottom:3px; border-bottom:1px solid var(--line); letter-spacing:.3px;}
  .modal .rules h3:first-child{margin-top:2px;}
  .modal .rules .rIntro{margin:2px 0 8px; opacity:.95;}
  .modal .rules .rNote{font-weight:400; opacity:.7; font-size:11.5px;}
  .modal .rules .modePill{display:inline-block; margin-left:6px; padding:1px 8px; border-radius:10px; font-size:11px; font-weight:800; background:rgba(143,216,255,.16); border:1px solid rgba(143,216,255,.5); color:#8fd8ff; letter-spacing:.4px; vertical-align:middle;}
  .modal button{font:inherit; font-weight:800; font-size:16px; padding:12px 22px; border-radius:12px; border:none; cursor:pointer; background:var(--gold); color:#3a2a08; margin-top:8px;}
  .modal .dataBox{text-align:left; border-top:1px solid var(--line); margin-top:10px; padding-top:10px; font-size:12.5px;}
  .modal .dataBox>b{color:var(--gold);}
  .modal .logSum{opacity:.85; margin:5px 0 9px; line-height:1.5;}
  .modal .logBtns{display:flex; gap:8px; flex-wrap:wrap;}
  .modal .logBtns button{font:inherit; font-weight:700; font-size:13px; padding:8px 12px; margin-top:0; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--txt);}
  .modal .logNote{opacity:.55; font-size:11px; margin-top:8px; line-height:1.45;}
  /* --- Card Codex (browse-all gallery) --- */

  .modal .ghostBtn.tutStart:hover{background:linear-gradient(180deg,rgba(240,200,80,.32),rgba(240,200,80,.16));}

  /* --- Tutorials landing page --- */
  .modal .lessons{display:flex; flex-direction:column; gap:8px; margin:6px 0 4px; max-height:46dvh; overflow-y:auto; padding-right:4px;}
  .modal .lsnSec{font-size:11px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; opacity:.6; margin-top:8px;}

  .modal .lessonRow{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin:0; padding:11px 13px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer; font:inherit;}
  .modal .lessonRow:hover{border-color:var(--gold); background:rgba(240,200,80,.06);}

  .modal .lsnNum{flex:0 0 auto; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; background:rgba(240,200,80,.16); color:var(--gold); border:1px solid rgba(240,200,80,.35);}
  .modal .lessonRow.done .lsnNum{background:rgba(120,200,120,.16); color:#8fd8a0; border-color:rgba(120,200,120,.45);}

  .modal .lsnGo{flex:0 0 auto; font-size:11.5px; font-weight:800; color:var(--gold); white-space:nowrap;}

  /* --- Specials cheat sheet --- */

  .modal .cheatTbl{width:100%; border-collapse:collapse; font-size:13px; margin:0 0 10px;}
  .modal .cheatTbl th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.5px; opacity:.6; padding:4px 8px; border-bottom:1px solid var(--line);}
  .modal .cheatTbl td{padding:6px 8px; border-bottom:1px solid rgba(255,255,255,.06); vertical-align:top;}
  .modal .cheatTbl td:first-child{white-space:nowrap; color:var(--gold);}
  .modal .cheat .cheatNote{font-size:12.5px; line-height:1.5; opacity:.85; margin:6px 0 0;}
  .modal .ladderBox{background:rgba(240,200,80,.07); border:1px solid rgba(240,200,80,.3); border-radius:12px; padding:10px 12px; margin:0 0 12px;}
  .modal .ladderLbl{font-size:10.5px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; opacity:.6; margin-bottom:7px;}
  .modal .ladderRow{display:flex; gap:5px; flex-wrap:wrap; align-items:center; margin-bottom:8px;}
  .modal .ladderRow span{flex:0 0 auto; min-width:26px; text-align:center; padding:5px 4px; border-radius:7px; background:var(--panel); border:1px solid var(--line); font-weight:800; font-size:13px;}
  .modal .ladderRow .trump{background:rgba(240,200,80,.18); border-color:rgba(240,200,80,.5); color:var(--gold);}
  .modal .ladderRow .apex{background:var(--gold); border-color:var(--gold); color:#3a2a08;}
  .modal .ladderNote{font-size:12.5px; line-height:1.5;}
  .modal .ladderNote .apexT{color:var(--gold); font-weight:900;}
  .modal .ladderNote .trumpT{color:var(--gold); font-weight:900;}
  .modal .rollRow{display:flex; gap:8px; align-items:stretch; margin-top:8px;}
  .modal .rollRow #rollBtn{flex:1 1 auto; margin-top:0;}
  .modal .rollRow .sideBtn{flex:0 0 auto; width:auto; margin-top:0; padding:12px 14px; white-space:nowrap;}
  .modal .confirmBtns{display:flex; gap:8px; margin-top:14px;}
  .modal .confirmBtns button{flex:1 1 0; min-width:0; margin-top:0;}
  .modal .setupReset{text-align:right; margin:3px 0 0; min-height:18px;}
  .modal .verRow{text-align:center; margin:10px 0 0; font-size:12px; opacity:.5;}
  .modal .ruleIntro{margin:2px 0 10px; font-size:13px; line-height:1.45; opacity:.85;}
  .modal .ruleWarn{margin:10px 0 0; font-size:12px; line-height:1.45; color:#f2b8b8;}
  .modal .settingRow.ro{opacity:.72; cursor:default;}
  .modal .settingRow.modeSetting{display:flex; flex-direction:column; align-items:stretch; gap:8px; cursor:default;}
  .modal .settingRow.modeSetting .segToggle{min-width:0;}
  .modal .ruleScope{display:inline-block; margin-left:7px; padding:0 6px; border-radius:999px; font-size:10px;
    font-weight:700; letter-spacing:.02em; text-transform:uppercase; background:#2b2440; color:#b6a8d8;
    border:1px solid #453a63; vertical-align:1px; white-space:nowrap;}
  .ruleChip{display:inline-block; margin-left:6px; padding:1px 7px; border-radius:999px; font-size:11px;
    font-weight:700; background:#3a2d55; color:#d8c9ff; border:1px solid #52407a; white-space:nowrap;}
  .modal .verRow .verStamp{font-variant-numeric:tabular-nums;}
  .modal .linkBtn{background:none; border:none; color:var(--txt); opacity:.5; font:inherit; font-size:12px; font-weight:700; cursor:pointer; padding:2px 3px; margin:0; text-decoration:underline;}
  .modal .linkBtn:hover{opacity:.9;}
  .modal .galFilters{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin:6px 0 12px;}
  .modal .galChip{font:inherit; font-weight:700; font-size:13px; padding:6px 13px; margin:0; border-radius:20px; border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer;}
  .modal .galChip.on{background:var(--gold); color:#3a2a08; border-color:var(--gold);}
  .modal .gallery{display:flex; flex-wrap:wrap; gap:12px 13px; justify-content:center; max-height:54dvh; overflow:auto; padding:6px 2px 2px;}
  .modal .galCell{position:relative; cursor:pointer; transition:transform .12s ease;}
  .modal .galCell:hover{transform:translateY(-3px);}
  .modal .galMult{position:absolute; top:-7px; right:-7px; background:var(--gold); color:#3a2a08; font-size:11px; font-weight:900; padding:1px 6px 2px; border-radius:10px; box-shadow:0 1px 3px rgba(0,0,0,.55);}
  .modal .galCount{display:block; font-size:12.5px; opacity:.72; margin:11px 0 2px;}
  .modal .galCount b{color:var(--gold);}
  .modal .galDetail{display:flex; gap:18px; align-items:flex-start; text-align:left; margin:4px 0 2px;}
  .modal .galFaceWrap{flex:0 0 auto; width:300px; max-width:52%; display:flex; justify-content:center;}
  .modal .galFace{width:100%; aspect-ratio:3/2; background-size:cover; background-position:center; border-radius:12px;}   /* raw illustration (layouts retired) */
  .modal .galFaceWrap .card.big{width:132px; height:190px;}
  .modal .galFaceWrap .card.big .r,.modal .galFaceWrap .card.big .s{font-size:42px;}
  .modal .galFaceWrap .card.big .c{font-size:76px;}
  .modal .galDetail .cvText{flex:1 1 0; min-width:0;}
  .modal .cvName{font-weight:800; font-size:18px; line-height:1.25;}
  .modal .cvType{font-size:12px; text-transform:uppercase; letter-spacing:.4px; opacity:.7; margin:5px 0 8px;}
  .modal .cvType .cost{color:var(--nrg); font-weight:800;}
  .modal .cvCost{font-size:13.5px; margin:0 0 8px;} .modal .cvCost b{color:var(--nrg);} .modal .cvCost .costSpell{opacity:.72; font-size:12.5px;}
  .modal .cvBody{font-size:14.5px; line-height:1.55; opacity:.95;}
  @media(max-width:560px){ .modal .galDetail{flex-direction:column; align-items:center; text-align:left;} .modal .galFaceWrap{width:62%; max-width:210px;} .modal .galDetail .cvText{width:100%;} }
  .modal .respOpts{display:flex; flex-direction:column; gap:8px; margin-top:12px;}
  .modal .respOpts button{margin-top:0; text-align:left; display:flex; flex-direction:column; gap:2px; line-height:1.3;}
  .modal .respQuick{background:var(--gold); color:#3a2a08;}
  .modal .respQuick .respTxt{font-weight:600; font-size:11.5px; opacity:.85;}
  .modal .respLet{background:var(--panel); color:var(--txt); border:1px solid var(--line); text-align:center !important;}
  /* the hand Outbalance let you look at — wraps, and scrolls rather than overflowing a short viewport */
  .modal .revealHand{display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0; max-height:40vh; overflow-y:auto;}
  .modal .respIncoming{margin-top:10px; padding:9px 11px; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px; font-size:12.5px; line-height:1.45; opacity:.92;}
  /* inline "what's on the table" context + the peek-at-the-board control (decision & game-over modals) */
  .modal .ctxBox{margin-top:10px; padding:8px 11px; background:rgba(255,255,255,.04); border:1px solid var(--line); border-radius:10px; font-size:12.5px; display:flex; flex-direction:column; gap:6px;}
  .modal .ctxRow{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .modal .ctxRow .ctxLbl{opacity:.5; font-weight:800; text-transform:uppercase; letter-spacing:.4px; font-size:10px; min-width:74px;}
  .modal .ctxCard{display:inline-block; padding:0 5px; margin:0 1px; border-radius:5px; background:#fbfbf7; color:#1c1c1c; font-weight:800; font-size:12px; line-height:1.6;}
  .modal .ctxCard.red{color:#c62828;}
  .modal .peekBtn{margin-top:8px; background:transparent; color:var(--txt); border:1px solid var(--line); opacity:.85; font-weight:700;}
  .overlay.peeking{background:rgba(10,4,16,.14); backdrop-filter:none;}
  .overlay.peeking .modal{display:none;}
  /* while peeking: lift the log, hand, and description panel above the overlay so they stay reviewable (inspect-only) */
  body.peeking-board #logWrap, body.peeking-board #handWrap, body.peeking-board #cardView{position:relative; z-index:35;}
  body.peeking-board #hand.disabled, body.peeking-board #hand{pointer-events:auto; opacity:1;}   /* re-enable hover/tap to read cards, even at game over */
  body.peeking-board #actions{pointer-events:none; opacity:.4;}   /* but the action buttons (Sort/Clear/Pass/Fight/Activate) stay disabled while peeking */
  .peekBar{position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:60; font:inherit; font-weight:800; font-size:14px; color:#3a2a08; background:var(--gold); border:none; border-radius:22px; padding:11px 22px; cursor:pointer; box-shadow:0 6px 18px rgba(0,0,0,.5);}

  /* --- last-beaten corner --- */
  .card.tiny{width:30px;height:43px;} .card.tiny .r{font-size:11px;} .card.tiny .s{font-size:11px;} .card.tiny .c{font-size:15px;}
  #beaten{position:absolute; top:50%; transform:translateY(-50%); left:12px; display:flex; flex-direction:column; gap:3px; z-index:2; pointer-events:none;}   /* center-left: clears the rival Forms zone (top-left) and your Forms zone (bottom-left) */
  #beaten:empty{display:none;}
  #beaten .bLabel{font-size:9.5px; text-transform:uppercase; letter-spacing:.4px; opacity:.5; font-weight:800;}
  #beaten .bCards{display:flex; gap:3px; flex-wrap:wrap; max-width:99px;}   /* 3 tiny cards per row (30px each) — a narrow column, so the centred pile has room */
  #beaten .card{opacity:.7; box-shadow:0 1px 3px rgba(0,0,0,.45);}

  /* --- Fighter Kick finisher --- */
  #kick{position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; pointer-events:none; overflow:hidden;}
  #kick.show{display:flex;}
  #kick .flash{position:absolute; inset:0; opacity:0;
    background:radial-gradient(circle at 50% 45%, rgba(255,255,255,.95), rgba(255,220,150,.25) 28%, transparent 60%);
    animation:kickFlash 1.6s ease-out forwards;}
  #kick.lose .flash{background:radial-gradient(circle at 50% 45%, rgba(255,120,120,.9), rgba(140,25,25,.25) 32%, transparent 60%);}
  #kick .rays{position:absolute; width:230vmax; height:230vmax; opacity:0;
    background:repeating-conic-gradient(from 0deg, rgba(232,195,122,0) 0deg, rgba(232,195,122,.20) 3deg, rgba(232,195,122,0) 7deg);
    animation:kickSpin 1.6s linear forwards;}
  #kick.lose .rays{background:repeating-conic-gradient(from 0deg, rgba(255,90,90,0) 0deg, rgba(255,90,90,.18) 3deg, rgba(255,90,90,0) 7deg);}
  #kick .word{position:relative; text-align:center; font-weight:900; line-height:.98; color:#fff; transform:scale(.2);
    font-size:min(15vw,116px); letter-spacing:2px; text-shadow:0 0 26px rgba(232,195,122,.95),0 6px 0 rgba(0,0,0,.4);
    animation:kickWord 1.6s cubic-bezier(.2,1.25,.3,1) forwards;}
  #kick.lose .word{text-shadow:0 0 26px rgba(255,90,90,.95),0 6px 0 rgba(0,0,0,.4);}
  #kick .word .sub{display:block; font-size:.30em; letter-spacing:5px; opacity:.92; margin-top:.18em; color:var(--gold);}
  #kick.lose .word .sub{color:var(--red);}
  @keyframes kickFlash{0%{opacity:0;} 7%{opacity:1;} 30%{opacity:.35;} 100%{opacity:0;}}
  @keyframes kickSpin{0%{opacity:0; transform:rotate(0deg) scale(.55);} 12%{opacity:1;} 100%{opacity:0; transform:rotate(130deg) scale(1.25);}}
  @keyframes kickWord{0%{transform:scale(.2) rotate(-8deg); opacity:0;} 12%{opacity:1;} 22%{transform:scale(1.14) rotate(2deg);} 34%{transform:scale(1) rotate(0);} 82%{transform:scale(1) rotate(0); opacity:1;} 100%{transform:scale(1.06); opacity:0;}}
  @keyframes shake{10%,90%{transform:translate(-2px,1px);}20%,80%{transform:translate(4px,-2px);}30%,50%,70%{transform:translate(-6px,2px);}40%,60%{transform:translate(6px,-1px);}}
  body.kicking main{animation:shake .5s ease-in-out;}
  @media (prefers-reduced-motion: reduce){
    #kick .flash,#kick .rays,#kick .word{animation:none;}
    body.kicking main{animation:none;}
  }

  /* --- card flash on effect activation (the whole card face pops center-stage, then fades) --- */
  #artFlash{ position:fixed; inset:0; z-index:40; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #artFlash.show{ display:flex; }
  #artFlash .afStage{ position:relative; display:inline-flex; }   /* holds the art (or fallback card) with the caption overlaid on its bottom */
  #artFlash.show .afStage{ animation:artPop var(--flashdur,1.15s) cubic-bezier(.2,.8,.2,1) both; }   /* duration set by flashArt so the fade-out aligns with the (longer) two-phase reveal */
  #artFlash .af{ width:min(88vw,680px); max-height:74vh; aspect-ratio:512/341; border-radius:16px; background-size:cover; background-repeat:no-repeat; background-position:center;
    box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 2px rgba(232,195,122,.5), 0 0 46px rgba(232,195,122,.55); }
  #artFlash.you .af{ box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 2px rgba(90,200,250,.45), 0 0 46px rgba(90,200,250,.5); }
  #artFlash .flashCard{ zoom:2.8; border-radius:14px; box-shadow:0 24px 70px rgba(0,0,0,.65); }   /* fallback flash: the drawn card, scaled up */
  #artFlash.you .flashCard{ box-shadow:0 24px 70px rgba(0,0,0,.65), 0 0 0 2px rgba(90,200,250,.45), 0 0 46px rgba(90,200,250,.5); }
  /* caption ON the art — value/suit + name over a bottom scrim, so it reads as part of the card */
  #artFlash .afCap{ position:absolute; left:0; right:0; bottom:0; z-index:2; padding:26px 16px 12px; text-align:center; line-height:1.12; pointer-events:none;
    border-radius:0 0 16px 16px; background:linear-gradient(to top, rgba(0,0,0,.9), rgba(0,0,0,.55) 55%, transparent); }
  #artFlash .afCap:empty{ display:none; }
  #artFlash .afCap .afSym{ font-size:clamp(22px,4.2vw,34px); font-weight:900; color:#fff; margin-right:9px; text-shadow:0 2px 8px rgba(0,0,0,.9); }
  #artFlash .afCap .afSym.red{ color:#ff6b8a; }
  #artFlash .afCap .afName{ font-size:clamp(16px,3vw,24px); font-weight:800; color:var(--gold); text-shadow:0 2px 8px rgba(0,0,0,.9); }
  /* beat 2: the effect text rises in on top of the art after a beat */
  #artFlash .afCap .afText{ max-height:0; opacity:0; overflow:hidden; transform:translateY(6px); margin-top:0;
    font-size:clamp(14px,2.5vw,20px); font-weight:600; line-height:1.4; color:#f4eff9; text-shadow:0 2px 8px rgba(0,0,0,.95); max-width:min(84vw,620px); margin-left:auto; margin-right:auto;
    transition:opacity .38s ease, transform .38s ease, max-height .38s ease, margin-top .38s ease; }
  #artFlash .afCap.showText .afText{ max-height:40vh; opacity:1; transform:none; margin-top:9px; }
  @keyframes flashCardFade{ 0%{opacity:0;} 15%{opacity:1;} 80%{opacity:1;} 100%{opacity:0;} }
  @keyframes artPop{ 0%{opacity:0; transform:scale(.82) translateY(8px);} 12%{opacity:1; transform:scale(1.04);} 26%{transform:scale(1);} 76%{opacity:1; transform:scale(1);} 100%{opacity:0; transform:scale(1.05);} }
  @media (prefers-reduced-motion: reduce){ #artFlash.show .afStage{ animation:artFade var(--flashdur,.9s) ease-out both; } @keyframes artFade{ 0%{opacity:0;} 8%{opacity:1;} 88%{opacity:1;} 100%{opacity:0;} } }
  /* --- center-stage shield break / form FX (a mini Fighter Kick) --- */
  .shields .s.forming{ animation:shieldForm .46s cubic-bezier(.2,1.4,.3,1); }
  @keyframes shieldForm{ 0%{transform:scale(0) rotate(-28deg); opacity:0;} 60%{transform:scale(1.22);} 100%{transform:scale(1); opacity:1;} }
  /* round-announcement ceremony — dimmed backdrop + a center-stage label per beat, then the Round N plate
     (styled to sit next to the shield-shatter banner it plays alongside) */
  #roundfx{ position:absolute; inset:0; z-index:7; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #roundfx.show{ display:flex; pointer-events:auto; cursor:pointer;
    background:radial-gradient(ellipse at 50% 46%, rgba(9,5,18,.72), rgba(5,2,10,.88));   /* dim + vignette the board behind */
    backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); animation:rfBackdrop .26s ease-out both; }
  @keyframes rfBackdrop{ from{opacity:0;} to{opacity:1;} }
  #roundfx .rfInner{ position:relative; text-align:center; opacity:0; padding:14px 30px; }
  #roundfx .rfInner::before{                                     /* soft glow halo behind the label, echoing the shield flash */
    content:''; position:absolute; left:50%; top:50%; width:150%; height:220%; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,255,255,.09), transparent 62%); z-index:-1; pointer-events:none; }
  #roundfx .rfInner.in{ animation:rfIn .40s cubic-bezier(.2,1.35,.35,1) both; }
  #roundfx .rfBeat{ font-size:clamp(21px,4.6vw,32px); font-weight:900; letter-spacing:.4px; line-height:1.18; color:var(--txt); text-shadow:0 2px 16px rgba(0,0,0,.78); }
  #roundfx .rfInner.good .rfBeat{ color:#8fdcff; text-shadow:0 0 24px rgba(120,210,255,.5), 0 2px 10px rgba(0,0,0,.7); }
  #roundfx .rfInner.bad  .rfBeat{ color:#ff8aa3; text-shadow:0 0 24px rgba(255,120,150,.46), 0 2px 10px rgba(0,0,0,.7); }
  #roundfx .rfInner.dim  .rfBeat{ color:var(--txt); opacity:.92; }
  #roundfx .rfRound{ font-size:clamp(42px,9vw,66px); font-weight:900; letter-spacing:3px; color:var(--gold); text-shadow:0 0 32px rgba(232,195,122,.42), 0 3px 16px rgba(0,0,0,.72); line-height:1; }
  #roundfx .rfCard .rfSub{ display:inline-block; margin-top:12px; padding-top:11px; font-size:clamp(13px,3vw,18px); font-weight:800; letter-spacing:2px; text-transform:uppercase; color:var(--txt); opacity:.9; border-top:1px solid rgba(232,195,122,.4); }
  #roundfx .rfInner.fizzle .rfSub{ color:#ffcf6b; opacity:1; border-top-color:rgba(255,207,107,.5); }
  @keyframes rfIn{ 0%{ opacity:0; transform:translateY(11px) scale(.9); } 60%{ opacity:1; } 100%{ opacity:1; transform:none; } }
  @media (prefers-reduced-motion: reduce){ #roundfx.show{ animation:none; backdrop-filter:none; -webkit-backdrop-filter:none; } #roundfx .rfInner.in{ animation:none; opacity:1; } }
  /* Emote bar (netplay only). Bottom-LEFT so it never sits under the hand's right-side action cluster, and
   * collapsed behind one 💬 tap on short/narrow screens where seven buttons would cost real board height. */
  #emoteBar{position:fixed; left:10px; bottom:10px; z-index:99998; display:flex; align-items:flex-end; gap:6px;}
  #emoteBar #emoteToggle{font:inherit; font-size:17px; line-height:1; padding:8px 10px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer;}
  #emoteBar #emoteList{display:none; flex-wrap:wrap; gap:5px; max-width:min(62vw,420px);}
  #emoteBar.open #emoteList{display:flex;}
  #emoteBar .emoteBtn{font:inherit; font-size:13px; font-weight:700; padding:7px 9px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--txt); cursor:pointer; display:flex; align-items:center; gap:5px;}
  #emoteBar .emoteBtn:hover{border-color:var(--gold);}
  @media (max-width:720px), (max-height:520px){ #emoteBar .emoteBtn span{display:none;} #emoteBar .emoteBtn{font-size:16px; padding:7px 8px;} }
  /* Center-stage interrupt flash — the QUICK cue lives here (it began as the STOPPER cue, which the rework retired) */
  #stopfx{ position:absolute; inset:0; z-index:8; display:none; align-items:center; justify-content:center; pointer-events:none; }
  #stopfx.show{ display:flex; }
  #stopfx .stx{ position:relative; text-align:center; opacity:0; padding:12px 26px; }
  #stopfx .stx::before{ content:''; position:absolute; left:50%; top:50%; width:150%; height:230%; transform:translate(-50%,-50%);
    background:radial-gradient(ellipse at center, rgba(255,120,150,.16), transparent 62%); z-index:-1; pointer-events:none; }
  #stopfx.you .stx::before{ background:radial-gradient(ellipse at center, rgba(120,210,255,.16), transparent 62%); }
  #stopfx.show .stx{ animation:stxPop 1.15s ease-out both; }
  #stopfx .stxMain{ font-size:clamp(26px,5.6vw,42px); font-weight:900; letter-spacing:1px; line-height:1.1; text-shadow:0 2px 14px rgba(0,0,0,.7); }
  #stopfx.rival .stxMain{ color:#ff8aa3; text-shadow:0 0 26px rgba(255,120,150,.5), 0 2px 10px rgba(0,0,0,.7); }
  #stopfx.you .stxMain{ color:#8fdcff; text-shadow:0 0 26px rgba(120,210,255,.55), 0 2px 10px rgba(0,0,0,.7); }
  #stopfx .stxSub{ font-size:clamp(13px,3vw,18px); font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--txt); opacity:.9; margin-top:8px; }
  @keyframes stxPop{ 0%{opacity:0; transform:translateY(10px) scale(.82);} 13%{opacity:1; transform:none;} 76%{opacity:1;} 100%{opacity:0;} }
  /* Quick-response cue — #stopfx; gold "⏩ QUICK" for the rival, cyan for you */
  #stopfx.quick .stx::before{ background:radial-gradient(ellipse at center, rgba(232,195,122,.18), transparent 62%); }
  #stopfx.quick.you .stx::before{ background:radial-gradient(ellipse at center, rgba(120,210,255,.16), transparent 62%); }
  #stopfx.quick .stxMain{ color:#f0c85a; text-shadow:0 0 26px rgba(232,195,122,.55), 0 2px 10px rgba(0,0,0,.7); }
  #stopfx.quick.you .stxMain{ color:#8fdcff; text-shadow:0 0 26px rgba(120,210,255,.55), 0 2px 10px rgba(0,0,0,.7); }
  @media (prefers-reduced-motion: reduce){ #stopfx{ display:none!important; } }
  #stagefx{ position:absolute; left:50%; top:48%; transform:translate(-50%,-50%); z-index:6; display:none; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  #stagefx.show{ display:flex; }
  #stagefx .sfFlash{ position:absolute; left:50%; top:34px; width:200px; height:200px; transform:translate(-50%,-50%); border-radius:50%; opacity:0; }
  #stagefx.brk  .sfFlash{ background:radial-gradient(circle, rgba(255,120,120,.5), transparent 62%); animation:sfFlash .5s ease-out; }
  #stagefx.form .sfFlash{ background:radial-gradient(circle, rgba(90,220,150,.45), transparent 62%); animation:sfFlash .6s ease-out; }
  @keyframes sfFlash{ 0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;} }
  #stagefx .sfRing{ position:absolute; left:50%; top:34px; width:58px; height:70px; transform:translate(-50%,-50%); border-radius:14px; border:3px solid rgba(90,220,150,.85); opacity:0; }
  #stagefx.brk .sfRing{ display:none; }
  #stagefx.form .sfRing{ animation:sfRing .6s ease-out forwards; }
  @keyframes sfRing{ 0%{opacity:.9; transform:translate(-50%,-50%) scale(.4);} 100%{opacity:0; transform:translate(-50%,-50%) scale(2.4);} }
  #stagefx .sfShield{ width:56px; height:68px; background:linear-gradient(180deg,#f4d488,#d9a441); clip-path:polygon(50% 0,100% 18%,100% 62%,50% 100%,0 62%,0 18%); box-shadow:0 4px 12px rgba(0,0,0,.4); }
  #stagefx.brk  .sfShield{ animation:sfBreak .72s cubic-bezier(.3,.7,.3,1) forwards; }
  #stagefx.form .sfShield{ animation:sfForm .6s cubic-bezier(.2,1.3,.3,1) forwards; }
  @keyframes sfBreak{ 0%{transform:scale(.6);opacity:0;} 16%{transform:scale(1.16);opacity:1;filter:brightness(1.7);} 40%{transform:scale(1.04) rotate(-4deg);} 100%{transform:scale(.5) rotate(12deg);opacity:0;} }
  @keyframes sfForm{ 0%{transform:scale(0) rotate(-24deg);opacity:0;} 60%{transform:scale(1.14);opacity:1;filter:brightness(1.5);} 100%{transform:scale(1);opacity:0;} }
  #stagefx .sfShards{ position:absolute; left:50%; top:34px; width:0; height:0; }
  #stagefx.form .sfShards{ display:none; }
  #stagefx .sfShards i{ position:absolute; left:0; top:0; width:11px; height:13px; margin:-6px 0 0 -5px; background:#e9c37a; clip-path:polygon(50% 0,100% 42%,78% 100%,12% 82%,0 32%); opacity:0; animation:sfShard .72s ease-out forwards; }
  #stagefx .sfShards i:nth-child(1){ --dx:-72px; --dy:-54px; --r:190deg; }
  #stagefx .sfShards i:nth-child(2){ --dx:70px;  --dy:-48px; --r:-160deg; }
  #stagefx .sfShards i:nth-child(3){ --dx:-64px; --dy:44px;  --r:120deg; }
  #stagefx .sfShards i:nth-child(4){ --dx:66px;  --dy:52px;  --r:-130deg; }
  #stagefx .sfShards i:nth-child(5){ --dx:-8px;  --dy:-80px; --r:220deg; }
  #stagefx .sfShards i:nth-child(6){ --dx:12px;  --dy:78px;  --r:-90deg; }
  @keyframes sfShard{ 0%{opacity:0; transform:translate(0,0) rotate(0) scale(1);} 16%{opacity:1;} 100%{opacity:0; transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.6);} }
  #stagefx .sfLabel{ font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:1px; opacity:0; text-shadow:0 1px 3px rgba(0,0,0,.6); }
  #stagefx.brk  .sfLabel{ color:var(--bad); }
  #stagefx.form .sfLabel{ color:var(--good); }
  #stagefx.show .sfLabel{ animation:sfLabel .78s ease-out; }
  @keyframes sfLabel{ 0%{opacity:0; transform:translateY(6px);} 28%{opacity:1;} 74%{opacity:1;} 100%{opacity:0;} }
  @media (prefers-reduced-motion: reduce){ #stagefx{ display:none!important; } .shields .s.forming{ animation:none; } }
  /* REWORK: transform-threshold ceremony — fires center-stage when the table's shield losses unlock a tier */
  #thresholdfx{ position:absolute; left:50%; top:42%; transform:translate(-50%,-50%); z-index:8; display:none; flex-direction:column; align-items:center; gap:5px; pointer-events:none; text-align:center; }
  #thresholdfx.show{ display:flex; animation:thBanner 1.9s ease-out forwards; }
  #thresholdfx .thName{ font-size:clamp(24px,6vw,44px); font-weight:900; letter-spacing:.06em; text-transform:uppercase; color:#ffd24a; text-shadow:0 0 18px rgba(255,196,60,.75), 0 2px 10px rgba(0,0,0,.7); }
  #thresholdfx .thSub{ font-size:clamp(12px,2.6vw,17px); font-weight:800; letter-spacing:1.5px; text-transform:uppercase; color:var(--txt); text-shadow:0 2px 8px rgba(0,0,0,.8); }
  #thresholdfx .thGlow{ position:absolute; left:50%; top:50%; width:340px; height:200px; transform:translate(-50%,-50%); border-radius:50%; background:radial-gradient(ellipse, rgba(255,196,60,.32), transparent 68%); z-index:-1; }
  @keyframes thBanner{ 0%{opacity:0; transform:translate(-50%,-50%) scale(.7);} 12%{opacity:1; transform:translate(-50%,-50%) scale(1.06);} 22%{transform:translate(-50%,-50%) scale(1);} 80%{opacity:1;} 100%{opacity:0; transform:translate(-50%,-50%) scale(1);} }
  @media (prefers-reduced-motion: reduce){ #thresholdfx.show{ animation:none; } }

  /* --- phone: ONE fixed screen. The pile stays up top and the hand stays pinned at the bottom;
         only the card panel and the battle log scroll internally (the whole board never scrolls). --- */
  @media (max-width:720px){
    /* phone: log sits beside the play area only (bounded height, scrolls); hand + description span FULL width below it */
    /* the play area sizes to its CONTENT (min-content floor) so #message can never collapse and spill onto the hand;
       if the whole board can't fit a short viewport, main scrolls instead of overlapping (the description row is what scrolls off, never the hand). */
    main{overflow-y:auto; overscroll-behavior:contain; -webkit-overflow-scrolling:touch;}
    #board{grid-template-columns:auto minmax(0,1fr); grid-template-rows:minmax(min-content,1fr) auto auto;}
    #board > #logWrap{grid-column:1; grid-row:1;}          /* just the play-area row — never runs alongside the hand/description */
    #board > #table{grid-column:2; grid-row:1;}
    #board > #handWrap{grid-column:1 / span 2; grid-row:2;}   /* full width */
    #board > #side{grid-column:1 / span 2; grid-row:3;}       /* full width */
    #logWrap:not(.collapsed){width:clamp(160px,42vw,230px);}  /* expanding only narrows the play area now, not the hand/description */
    /* collapsed rail is short on phones — a vertical "Battle Log" clips to "…LE LOG", so shorten it to "LOG" here */
    #logWrap.collapsed #logHead > span:first-child{font-size:0;}
    #logWrap.collapsed #logHead > span:first-child::before{content:'LOG'; font-size:10px; letter-spacing:1.5px;}
    #table{min-height:96px; padding:4px 0;}
    .equipZone{max-width:min(54%,150px);} .equipZone .eq{min-width:0; padding:5px 9px;} .equipZone .eqName{font-size:12px; max-width:128px;} .equipZone .eqEff{font-size:10px;} .equipZone .eqCtr{font-size:11px;} .equipZone .eqCtr b{font-size:12px;}
    #side{height:clamp(132px,20vh,172px); flex-direction:row; align-items:stretch; border-left:none; border-top:1px solid var(--line); padding-left:0; padding-top:8px;}
    #cardView{flex:1 1 auto; flex-direction:row; align-items:flex-start; gap:10px; padding:10px 12px;}   /* image left, text right (strip) */
    #cardView .cvBigFace{display:none;}                                  /* mobile: hide the full layout (its printed text is unreadable at strip size) */
    #cardView .cvBigArt{display:block; flex:0 0 auto; align-self:stretch; height:100%; width:auto; aspect-ratio:3/2; background-size:cover; background-position:center; border-radius:10px;}   /* show the raw art on the left, text to the right */
    #cardView .card.big{width:46px;height:66px;} #cardView .card.big .r{font-size:15px;} #cardView .card.big .s{font-size:15px;} #cardView .card.big .c{font-size:24px;}
    #cardView .cvText{flex:1 1 0; width:auto; min-width:0;}
    #cardView .cvName{font-size:14.5px;} #cardView .cvType{font-size:11px; margin:2px 0 5px;} #cardView .cvBody{font-size:12.5px; line-height:1.45;}
    #cardActivate{left:12px; top:12px; bottom:auto; width:32px; height:32px;}   /* corner badge on the strip image */
    #handWrap{border-top:1px solid var(--line);}
    #actions{flex-wrap:wrap;}
    #hint{flex:1 0 100%; order:-1; margin:0 0 6px;}
    #hand{max-height:22dvh;}
  }
  @media (max-width:480px){
    #actions button{padding:9px 12px; font-size:14px;}
    #sortBtn{padding:9px 11px;}
  }
  @media (max-width:380px){ .card{width:40px;height:58px;} .card .c{font-size:20px;} .card.big{width:52px;height:76px;} }
  /* really tight (short) phones + landscape: the inline description strip eats scarce vertical space, so drop it and
     offer a "🔍 View card" button that opens the full-screen reader instead (the whole page becomes the description box). */
  @media (max-width:720px) and (max-height:800px){
    #board{grid-template-rows:minmax(min-content,1fr) auto;}   /* no description row — reclaim its height */
    #board > #side{display:none;}
    #viewCardBtn{display:inline-block;}
  }

  /* --- LANDSCAPE / SHORT VIEWPORT ------------------------------------------------------------------------
     A phone held sideways is ~844x390, which MISSES the phone branch above entirely (that gate needs
     max-width:720px) and therefore got the full DESKTOP layout inside 390px of height. Measured at 844x390
     before this block: header 56 + hand region 213 left the play area **57px** tall — and a card is 66px, so
     the pile could not render a single card. On a 667x375 SE it was worse: the hand and the whole action bar
     sat **136px BELOW the viewport**, unreachable, because the phone branch's `minmax(min-content,1fr)` let
     the hand force its own minimum and push everything down.
     Height is the scarce axis in landscape and width is abundant, so this block buys height back from the
     chrome instead of rescaling the page: a slimmer header, tighter gaps, shorter action buttons, and a hand
     capped by dvh. Cards shrink via --cs, but --pm is raised to compensate so the PILE stays near full size —
     that is the thing you actually read mid-play, and it is the part that had no room at all.
     Comes AFTER the phone branch on purpose: at 667x375 both match, and this one must win. */
  @media (orientation:landscape) and (max-height:520px){
    :root{ --headerH:37px; }        /* measured: the landscape header is 37px, so a hardcoded 54px floated 17px low */
    :root{ --cs:.82; --pm:1.15; }                              /* pile = .82 x 1.15 = .94, near full size */
    header{padding:3px 10px; gap:6px;}
    header h1{font-size:13px;}
    header h1 small{display:none;}
    header button{padding:4px 8px; font-size:12px;}
    header select{padding:4px 7px; font-size:12px;}
    header .diffWrap{font-size:10px;}
    main{padding:4px 8px 0; gap:4px;}
    #board{gap:6px; grid-template-rows:minmax(0,1fr) auto;}    /* minmax(0,...) — min-content was the SE overflow */
    #handWrap{padding:4px 8px 5px;}
    /* #handMeta (your name, shields, energy, deck, shuffle pile) measured 67px — it WRAPS to two rows on a
       narrow landscape phone, and it was the single biggest consumer of the height the play area needed.
       The inner .fighter span carries an inline padding, hence the !important. */
    #handMeta{font-size:11px; gap:5px; margin:0 3px 4px;}
    #handMeta .fighter{padding:2px 5px !important; gap:6px !important;}
    #handMeta .stat, #handMeta .deckName{font-size:10.5px;}
    #handMeta .shields{gap:3px;}
    #handMeta .shields .s{width:11px; height:14px;}
    #hand{max-height:32dvh; padding:13px 6px 4px; gap:5px;}    /* 13px top still clears the hover lift */
    #actions{margin-top:4px; gap:6px;}
    #actions button{padding:6px 11px; font-size:13px; border-radius:9px;}
    #hint{font-size:11.5px; min-height:13px;}
    #pileLabel{font-size:11px; min-height:13px;}
    #pile{min-height:56px;}
    #message{font-size:12px; min-height:15px;}
    #roundTag{font-size:10px;}
    #table{gap:4px;}
  }
  /* Roomier landscape (>=380px tall: the common 844x390 and 932x430 iPhones). The 360-375px devices need
     every pixel, but these have slack in the play area once the chrome is slimmed — measured 140px and 263px
     of play area at --cs:.82 — so spend it on card size. Same "cards look smol" reasoning as the desktop
     steps, applied to the axis that is actually free here. */
  @media (orientation:landscape) and (min-height:380px) and (max-height:520px){
    :root{ --cs:.9; --pm:1.35; }
  }
  /* The FLOOR: 568x320 — iPhone 5/5s/SE-1st and the iPod touch 7th gen (sold until 2022) are all this size
     in landscape. Aj: "no phone is that thin" — 640x360 does pass, but these do exist, and at 320px tall the
     hand region wanted 206px of it (64%) and the pile drew 34px over the hand. Everything here is a straight
     trade of detail for reachability; below this we stop claiming support. */
  /* Also below the floor: NARROW and short. 640x360 was left with 2px of pile-to-hand clearance and no
     honest way to buy more — every candidate (inlining the hint, growing the row, min-content tracks) was
     measured and made something else worse. 800x360 is equally short but WIDE, and fits with 13px to spare,
     so the rule is narrow-and-short, not just short. */
  @media (orientation:landscape) and (max-height:364px) and (max-width:720px){
    #board{grid-template-rows:auto auto; overflow-y:auto; overscroll-behavior:contain;}
  }
  @media (orientation:landscape) and (max-height:340px){
    /* At 568px wide BOTH #handMeta and #actions wrap to two rows, so the hand region wanted 199px of a 320px
       viewport and the play area's 1fr track collapsed to 32px for 96px of content — the pile drew over the
       hand. Making it genuinely fit would mean hiding real controls (the ♻ shuffle-pile button, the stat
       readouts), which is the wrong trade for a 2016 device.
       So below 340px we stop fighting for a single screen and DEGRADE GRACEFULLY: the rows go content-sized
       and the board scrolls. Nothing is ever drawn on top of anything, everything stays reachable, and the
       same fallback covers a desktop window dragged to any absurd height — which is otherwise unbounded. */
    #board{grid-template-rows:auto auto; overflow-y:auto; overscroll-behavior:contain;}
    #handMeta{font-size:10px; gap:4px; margin:0 2px 2px;}
    #handMeta .shields .s{width:9px; height:11px;}
    #actions{margin-top:3px;}
    #actions button{padding:4px 7px; font-size:11.5px;}
    #pileLabel{font-size:10px; min-height:11px;}
    #pile{min-height:40px;}
    #table{gap:3px;}
  }
  /* Narrow AND short — a small phone sideways (667x375 SE). Below 721px the action bar loses its desktop
     spacer and WRAPS to two rows, which cost 25px and pushed a 5-card pile into the hand with the battle log
     open. Shrink the buttons enough to keep one row. */
  @media (orientation:landscape) and (max-height:520px) and (max-width:720px){
    #actions{gap:4px;}
    #actions button{padding:5px 8px; font-size:12px; border-radius:8px;}
    /* The hint takes its OWN line, pinned to one line. All three arrangements were measured: inline-and-
       wrapping gave a 63px bar, inline-and-clipped still gave 63px (it squeezes the buttons), own-line gives
       55px. Own line wins, and `nowrap` keeps it from ever becoming two. */
    #hint{font-size:11px; flex:1 1 100%; order:9; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
    /* And pin #message to one line for the same reason. It renders 26px instead of 13px whenever its text
       wraps, the text depends on game state, and at 640x360 there were only 8px of clearance — so the wrap
       was an intermittent overlap (1 failure in 8 suite runs). Removing the VARIABILITY is cheaper than
       absorbing it: making the row grow instead (minmax(min-content,1fr) + a scrolling board) was measured
       and put the action bar 11-117px below the fold on every device, which is far worse than an ellipsis on
       the one screen size where a long message does not fit. The full text is always in the battle log. */
    #message{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;}
    /* Five opponent panels at min-width:130px need 690px+ and so WRAPPED to two rows at 667px — measured a
       172px opponents strip in a 6-player game, which put the action bar 60px below the viewport. Compact
       them enough that a full table fits one row (5 x 88 + gaps = ~484 of 667). */
    /* With a 6-player strip (69px even compacted) the play area is only 96px, and the pile's own column
       measured 109px of content — it overflowed the grid track into the hand. Ease the pile back to its
       unmultiplied size here; 667x375 is the smallest landscape device we support and it cannot afford the
       bigger pile the roomier sizes get. */
    :root{ --pm:1; }
    #pile{min-height:44px;}
    #message{font-size:11px; min-height:13px;}
    #opponents{gap:4px;}
    .oppPanel{min-width:88px; max-width:150px; padding:4px 6px; gap:2px; font-size:10px; border-radius:9px;}
    .oppPanel .oppName{font-size:11px;}
    .oppPanel .oppSeat{display:none;}                                   /* the name already identifies the seat */
    .oppPanel .oppShields{gap:2px;}
    .oppPanel .oppShields .s{width:9px; height:12px;}
    .oppPanel .oppStats{gap:5px;}
    /* 667x375 with SIX players is the hardest case in the game: the opponents strip (69px even compacted)
       left the play-area grid track 49px for 96px of content, so the pile drew over the hand. Lay each panel
       out as a single ROW — name + shields — and drop the per-seat stat line. The detail is still one tap
       away: tapping a panel expands it (the B1 zone-targeting work). Nothing else is small enough to cut. */
    .oppPanel{flex-direction:row; align-items:center; justify-content:space-between; flex-wrap:wrap;}
    .oppPanel .oppStats{display:none;}
    .oppPanel .oppTop{flex:1 1 auto; min-width:0;}
  }
</style>

<body>
<header>
