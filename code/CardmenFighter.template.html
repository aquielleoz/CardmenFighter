<script>
/* ==== ENGINE (inlined) ==================================================== */
__ENGINE__
/* ==== AI (inlined) ======================================================== */
__AI__
/* ==== CARD ART (inlined; cardId -> illustration data URI) ================== */
__ART__
/* ==== CARD FACES (inlined; cardId -> full card-face data URI) ============== */
__FACES__
/* ==== NETVIEW (inlined; per-seat redacted snapshots for netplay) =========== */
__NETVIEW__
__QR__
/* ==== UI =================================================================== */
(function(){
  'use strict';
  var E=window.CardmenEngine, AI=window.CardmenAI;
  E.setDeferRoundDraw(true);   // the UI draws the new round's cards AFTER the end-of-round hand-limit trim (see resolveRoundCeremony)
  E.setShieldCards(true);      // CATCH-UP M1: shields are cards — a broken shield returns to its owner's hand (the trailing player refuels)
  E.setLoserMill(true);        // CATCH-UP M2: the round's loser mills (winning-play size) cards into their Energy Pile (energy parity; deck-out guarded)
  E.setSpecialLossMode('chosen'); // MP: on a Special win the victor strips ONE chosen rival's shield (not the whole table). No-op at 2p.
  E.setMillScope('targeted');     // MP: only the struck rival(s) mill catch-up cards, not every non-winner. No-op at 2p. (Cutthroat combo — flattens 3–6p balance; see CARD-STATS.md.)
  /* The build stamp. Substituted by build.js from README.md's `**Status:**` line — see the note there. It
   * exists because a downloaded single-file game is otherwise indistinguishable from a stale copy of itself:
   * Aj reported a missing name field that had shipped two versions earlier, and nothing on screen could have
   * told him. Shown where a bug report is actually taken from — the setup dialog and the netplay lobby bar. */
  var GAME_VERSION='__VERSION__';
  function verTag(){ return '<span class="verStamp" title="Build version — quote this in a bug report">'+GAME_VERSION+'</span>'; }
  var YOU=0, RIVAL=1;
  var SUIT_SYMBOL={C:'♣',D:'♦',H:'♥',S:'♠'};
  var TYPE={single:'Jab',pair:'Pair',trio:'Trio',straight:'Straight',flush:'Flush',fullhouse:'Full House',kit:'Kits',twopair:'Two Pair',quadro:'Quadro'};
  /* Kits are the first VARIABLE-LENGTH shape, so a fixed name is not enough — a run of two pairs and a run of
   * three are different plays. Where the combo object is in hand, say which ("2 Kits"); the bare TYPE entry
   * covers the call sites that only carry a type string. */
  function comboName(combo){
    if(!combo) return 'Special';
    if(combo.type==='kit') return (combo.size/2)+' Kits';        // "2 Kits", "3 Kits" — the table's own name
    return TYPE[combo.type]||'Special';
  }
  var REWORK_LABEL={1:'A',11:'J',12:'Q',13:'K'};                                // REWORK playtest: ranks show as A/J/Q/K on the 2-as-apex ladder
  function rankLabel(r){ return REWORK_LABEL[r]||r; }
  function cardSym(c){ return rankLabel(c.rank)+SUIT_SYMBOL[c.suit]; }          // deck reads 3..10,J,Q,K,A,2 under REWORK (else 1..10)
  function energyChips(pl){ var s=E.SUITS.map(function(su){ var n=E.countSuit(pl.energy,su); return n?('<span class="nrgS'+(red(su)?' red':'')+'">'+n+SUIT_SYMBOL[su]+'</span>'):''; }).join(''); return s || '<span class="nrgS nrgZero">0</span>'; }
  function energyBreakdown(pl){ return 'Energy by suit — '+E.SUITS.map(function(s){ return E.countSuit(pl.energy,s)+SUIT_SYMBOL[s]; }).join('  '); }
  function cardSymList(cards){ return cards.map(cardSym).join(', '); }         // "5♠, 6♥, 7♠"
  function kindLabel(t){ return t==='single' ? 'Jab' : 'Special '+TYPE[t]; }   // short label for the corner tag / hints
  function kindPhrase(t){ return t==='single' ? 'a Jab' : 'a Special - '+TYPE[t]; }  // sentence form for the center announcement

  // fight play → phrase after "played ":  "a Jab - 4♥"  /  "a Special - Straight (5♠, 6♥, 7♠, 8♥, 9♦)"
  function playPhrase(combo){
    if(combo.type==='single') return 'a Jab - '+cardSym(combo.cards[0]);
    return 'a Special - '+comboName(combo)+' ('+cardSymList(combo.cards)+')';
  }
  // effect activation → phrase after "played ", from the card: "a Technique - 2♦ Book Smarts — Draw 3 cards"
  function effPhrase(card){
    var eff=card?E.effectOf(card):null;
    if(!eff) return 'a Technique'+(card?' - '+cardSym(card):'');
    var art=/^[AEIOU]/i.test(eff.type)?'an':'a';   // "an Equipment", "a Technique"
    return art+' '+eff.type+' - '+cardSym(card)+' '+eff.name+' — '+(eff.text||'').replace(/\.$/,'');
  }
  var state=null, selected={}, busy=false, gen=0, boostArmed=false, fullLog=[];
  var enterDelayBase=0;              // ms offset added to drawn-card deal-in, so a round's new cards arrive on the "Round N" beat
  var ROUND_BEAT=750, ROUND_HOLD=1350;   // ceremony timing (ms): each pre-card beat, and the Round-N card hold
  var handOrder=[];            // UI display order of card ids (Sort reorders this)
  var layout=[], gidSeq=0, drag=null, tapTimer=null, tapPendingGid=null, justDragged=false;   // hand shown as draggable groups (combos)
  var sortState='unsorted';   // current hand arrangement; the Sort button label reflects THIS. Reverts to 'unsorted' when a fresh card is drawn.
  var SORT_NEXT={ unsorted:'singles', singles:'pairs', pairs:'straights', straights:'singles' };   // click cycles among the three sorts
  var SORT_TITLE={ unsorted:'Sort: Unsorted', singles:'Sort: Singles', pairs:'Sort: Pairs', straights:'Sort: Straights' };
  var HINTS_KEY='cmf_hints_v1';
  var hintsOn=false; try{ hintsOn = localStorage.getItem(HINTS_KEY)==='1'; }catch(e){}   // play hints — DEFAULT OFF (opt-in guidance)
  var PULSE_KEY='cmf_pulse_detail_v1';
  var pulseDetail=false; try{ pulseDetail = localStorage.getItem(PULSE_KEY)==='1'; }catch(e){}   // detailed energy pulses — DEFAULT OFF (net delta); Settings toggles it
  var pick=null;               // active selection: {kind:'discard'|'top', cardId, need, chosen:{}}
  var formsOpen=null;          // which Forms & Rides zone is expanded to full cards — a seat key like 'p0'/'p2', or null (collapsed to chips)
  var oppOpen=null;            // which opponent PANEL is expanded to real zones in a free-for-all (seat index, or null)
  function zoneKeyFor(seat){ return 'p'+seat; }
  function collapseForms(){ if(formsOpen!==null){ formsOpen=null; render(); } }
  var targeting=null;          // {cardId} while choosing an equipment to remove
  var pileSig=null;            // signature of the pile currently rendered (skip rebuild/re-animate)
  var flipFrom=null;           // {cardId: DOMRect} captured from the hand for a play-to-pile FLIP
  var pendingEnter={};         // ids of freshly-drawn hand cards to deal-in on next renderHand
  var lastPileData=[];         // [{id,rank,suit}] of the pile as last rendered (for the beaten-sweep)
  var lastPileOwner=null;      // who owned that pile
  var pendingKick=false;       // set when a round resolved as a Fighter Kick, consumed by endGame
  var prevShields={};          // last-rendered shield count per player (to detect damage)
  var prevNrg={};              // last-rendered energy count per player (to signal the pile growing)
  var prevNrgSuit={}, prevShufSuit={}, prevDeckN={}, prevHandN={};   // per-suit energy + per-suit shuffle + deck + hand counts, to reconstruct the real energy movements (cost spent / gained / milled) for the pulse display
  var prevTurn=null;      // last-rendered turn seat — a chime fires when control returns to the local human
  var inCeremony=false;   // true during the round-resolution ceremony — suppresses the render-diff deck-mill float there (the catch-up mill fires its own explicit −N) so a normal end-of-round draw isn't mistaken for a mill
  var announcedThresh={};      // REWORK: which transform tiers have had their unlock ceremony this duel
  var pendingThreshold=null;   // a threshold unlock waiting for its OWN beat (so it doesn't overlap the round-win banner)
  var holdShields=false;       // when a round strips a shield, defer the shatter to the ceremony's "loses a shield" beat
  var difficulty='fighter';    // 'minion' | 'fighter' | 'demon' — persists across New Duel
  var youDeck='full', rivalDeck='full';   // RESOLVED concrete decks in play; 'full' or an E.DECKS key
  // ---- N-player (3–6) ----
  var mpCount=2;                          // chosen player count (2 = duel)
  var gameBasics=false;                   // Basics mode: deck has no J/Q/K transform layer
  /* HOMEBREW RULES (v1.31.22). Aj: "it's not the default or intended way to play the game, but it certainly is A
   * way to play the game." The engine already had every one of these behind a setter — this surfaces them.
   *
   * EVERY DEFAULT IS OFF, deliberately: that makes "is this game customised?" a plain `.some()` rather than a
   * comparison against a defaults map, and it is why `flatDraw` is phrased as the NEGATIVE of the shipped rule
   * (draw-scales-with-table ships ON, so the toggle turns it off).
   *
   * All four are MULTIPLAYER-ONLY in effect, which the panel says out loud: the engine's own comment marks the
   * first two as no-ops at 2 players, `startShieldsFor(2)` is 2+2=4 (the flat default), and `drawCountFor` at 2
   * players is max(2,2)=2 (also the default). A duel plays identically with all four ticked. Kits and the apex
   * pair would be the first duel-relevant rules. */
  var RULES_KEY='cmf_rules_v1';
  var RULE_DEFS=[
    /* GAME MODE, moved out of the setup dialog in v1.31.32 (Aj: "move this choice to the custom rules. full
     * game is of course the default"). It is a MODE row, and 'full' is its first value, so it is "off" by the
     * panel's own definition and Basics reads as a customised game — which it is. Note this is the one row that
     * is NOT homebrew: Basics is the supported way to learn, so its note says so rather than leaning on the
     * panel's "not the intended way to play" framing.
     * Moving it here also FIXED a real gap: hostStartRealN used to hardcode gameBasics=false, so choosing
     * Basics was silently ignored in every online game. Rules travel to clients, so now it does not. */
    { key:'basics',      duel:true, label:'Game mode',
      mode:[{v:'full',label:'Full game'},{v:'basics',label:'Basics'}],
      note:'“Full game” is the whole thing, J/Q/K Rides &amp; Form Changes included. “Basics” drops the transform layer for a clean 3–10 + A + 2 game — the way to learn the ladder, effects and energy first.' },
    { key:'lossAll',     mp:true,  label:'Special fights destroy a shield for each rival',
      note:'Normally the winner picks one rival to strike.' },
    { key:'millAll',     mp:true,  label:'All round losers send cards to their Energy Pile',
      note:'Normally only the rival whose shield you strike does.' },
    { key:'shieldScale', mp:true,  label:'Shields scale with the table (2 + players)',
      note:'Normally 4 shields at every player count.' },
    { key:'flatDraw',    mp:true,  label:'Draw does not scale with the table',
      note:'Every round draws a flat 2 cards instead of one per player.' },
    /* The first two toggles that change a DUEL. Measured 2026-08-26 (PATCHNOTES 0m) and each carries a real
     * cost, stated qualitatively — numbers and deck names belong in the docs, not in a player's face. They are
     * independent flags: no-strip stopped requiring infinity the same day, because a 2 that deals no damage but
     * CAN still be beaten is the contestable version of the idea, and the measurements say that is the one that
     * actually plays the way the proposal imagines. */
    { key:'apexInf',     duel:true, label:'The 2 cannot be beaten — not even by a boost',
      note:'Normally a boosted Ace can out-value the apex 2. No card can out-value it at all — the only answers left are the chops, below.' },
    { key:'apexNoStrip', duel:true, label:'Fights won with a 2 destroy no shields',
      note:'The 2 becomes a way to seize the lead without dealing damage, and rivals can still beat it — unless the rule above is also on. Makes 6-player games much longer.' },
    /* THE DOUBLE-PAIR SLOT IS A MODE. Poker's two pair is a SUPERSET of a 2-kit at the same size, so as two
     * checkboxes they could never beat each other and a four-card play would be ambiguously classified. One
     * segmented row means exactly one classification is ever live. `kits3` is a plain boolean because 3+ runs
     * are size 6 and never collide — and mode 'off' with kits3 ON is the Dou Dizhu form (3+ pairs only). */
    { key:'dblPair',     duel:true, label:'Four-card double pairs',
      mode:[{v:'off',label:'Off'},{v:'kits',label:'2 Kits'},{v:'poker',label:'Poker'}],
      note:'“2 Kits” needs the two pairs CONSECUTIVE (4s+5s). “Poker” allows any two pairs (4s+9s) and compares the high pair first. They are alternatives, not both.' },
    { key:'kits3',       duel:true, label:'3 Kits and up — longer runs of consecutive pairs',
      note:'Three pairs of consecutive values, or more. Independent of the row above, so you can play the family\u2019s original form \u2014 runs of three or more only.' },
    /* QUADRO is off by default for a COGNITIVE-LOAD reason, not a balance one (Aj: "new players will just
     * break"). It is also a plain shape here — it beats a lower quadro and nothing else. A quadro beating a
     * shape it does not match is the CHOP, a separate rule that needs cross-shape overrides in beats(). */
    { key:'quadro',      duel:true, label:'Quadro — four of a kind',
      note:'All four copies of one value. On its own it beats a lower Quadro and nothing else — switch on The chop below to give it a job.' },
    /* THE CHOP is a modifier on the shapes above it, so it is last and its note says outright that it does
     * nothing without them. It is also the only rule that makes the apex 2 answerable, which is why the note
     * names the conflict with "The 2 cannot be beaten" rather than leaving two rules to contradict each other. */
    /* THREE INDEPENDENT CHOPS, not a mode. They are distinguishable shapes, so nothing forces a choice — you
     * can take one, or all of them — and each toggle enables its own shape, so no setting is ever dead. The
     * ladder between them is 3 Kits < Quadro < same-suit straight < 4+ Kits. */
    { key:'chopQuadro',  duel:true, label:'The chop: a Quadro beats the 2',
      note:'Four of a kind beats a 2 it does not match — a lone 2 or a pair of them. A chop answers by SHAPE, so it works even on a 2 that cannot be beaten. Switching this on makes Quadros playable by itself.' },
    { key:'chopKits',    duel:true, label:'The chop: 3+ Kits beat the 2',
      note:'A run of three or more Kits does the same, and 4+ Kits reach a trio of 2s and outrank the other chops. Switching this on makes those runs playable by itself.' },
    { key:'chopSflush',  duel:true, label:'The chop: five in a row, one suit, beats the 2',
      note:'Same reach, and it outranks a Quadro. This is <b>only</b> a chop: a same-suit run is an ordinary straight the rest of the time and never beats a higher straight. Single-suit class decks make these far more easily than mixed ones.' }
  ];
  /* TWO STORES, and the split is what makes suggestions possible (v1.31.31). RULES is what is IN PLAY — on a
   * netplay client the host overwrites it wholesale, so anything kept there is not yours. MY_RULES is THIS
   * DEVICE's own picks: it is what localStorage holds, it is what a client suggests to the table, and it is
   * never touched by an incoming host key. When you are the one setting the rules, your picks ARE the rules,
   * so the panel writes both. */
  var RULES={}, MY_RULES={};
  RULE_DEFS.forEach(function(d){ RULES[d.key]= d.mode ? d.mode[0].v : false; MY_RULES[d.key]=RULES[d.key]; });
  function ruleOff(d){ return d.mode ? d.mode[0].v : false; }              // this rule's "not on" value
  function ruleOnIn(src,d){ return d.mode ? (src[d.key]!==ruleOff(d)) : !!src[d.key]; }
  function ruleOn(d){ return ruleOnIn(RULES,d); }
  /* PRESETS ARE AN EXACT STATE, NOT AN ADDITIVE ONE — Aj named Chikicha Specials as "kits + quadro and NOTHING
   * else", so applying one must also turn off whatever else was on. That is what makes a preset button able to
   * read as active: "these are exactly the rules" is a claim you can check, "at least these" is not.
   * More presets arrive as their shapes do — Dou Dizhu needs trio+single, four+two and the airplane first, so
   * offering it now would name a rule set the build cannot actually play. */
  var RULE_PRESETS=[
    { key:'chikicha', label:'Chikicha Specials', title:'The Kits and Quadro shapes, with the chop that gives them a job — and nothing else',
      rules:{ dblPair:'kits', kits3:true, quadro:true, chopQuadro:true } }
  ];
  function presetValue(p,d){ return p.rules[d.key]!==undefined ? p.rules[d.key] : ruleOff(d); }
  function presetActive(p,src){ src=src||RULES; return RULE_DEFS.every(function(d){ return src[d.key]===presetValue(p,d); }); }
  function applyPreset(p,src){ RULE_DEFS.forEach(function(d){ src[d.key]=presetValue(p,d); }); }
  function clearAllRules(src){ RULE_DEFS.forEach(function(d){ src[d.key]=ruleOff(d); }); }
  function customRules(){ return RULE_DEFS.some(ruleOn); }
  /* Self-describing, like the custom-deck key: netplay and the playtest export carry the RULES, not a name the
   * other end would have to recognise. '' means "the shipped game". */
  function keyOf(src){
    var on=RULE_DEFS.filter(function(d){ return ruleOnIn(src,d); })
                    .map(function(d){ return d.mode ? (d.key+'='+src[d.key]) : d.key; });
    return on.length?on.join(','):'';
  }
  function rulesKey(){ return keyOf(RULES); }
  function myRulesKey(){ return keyOf(MY_RULES); }
  /* Parses a key into a RULES-shaped object, DROPPING anything this build does not know — unknown rule names
   * and invalid mode values both fall back to off. That is the whole sanitiser for an untrusted client's
   * suggestion (`keyOf(rulesFromKey(k))` round-trips it clean), and it is the same path a saved key takes, so
   * there is only one place where a key is interpreted. */
  function rulesFromKey(k){
    var want={}, modes={}, out={};
    String(k||'').split(',').forEach(function(x){
      if(!x) return;
      var eq=x.indexOf('=');
      if(eq>0) modes[x.slice(0,eq)]=x.slice(eq+1); else want[x]=1;
    });
    /* MIGRATION: v1.31.24 shipped a single boolean `kits` meaning "consecutive runs of any length". That is now
     * a mode plus a boolean, so an old saved key (or one arriving from an older peer) maps to both halves rather
     * than silently turning the rule off. */
    if(want.kits){ modes.dblPair='kits'; want.kits3=1; }
    RULE_DEFS.forEach(function(d){
      if(d.mode){
        var v=modes[d.key], ok=d.mode.some(function(m){ return m.v===v; });
        out[d.key]= ok ? v : d.mode[0].v;
      } else out[d.key]=!!want[d.key];
    });
    return out;
  }
  function setRulesFromKey(k){                     // the rules IN PLAY — never touches MY_RULES
    var o=rulesFromKey(k); RULE_DEFS.forEach(function(d){ RULES[d.key]=o[d.key]; }); applyRules();
  }
  function setMyRulesFromKey(k){                   // this device's own picks, and the game to play solo
    var o=rulesFromKey(k);
    RULE_DEFS.forEach(function(d){ MY_RULES[d.key]=o[d.key]; RULES[d.key]=o[d.key]; });
    applyRules();
  }
  function applyRules(){
    if(E.setSpecialLossMode) E.setSpecialLossMode(RULES.lossAll ? 'all' : 'chosen');
    if(E.setMillScope)       E.setMillScope(RULES.millAll ? 'universal' : 'targeted');
    if(E.setShieldsPerPlayer) E.setShieldsPerPlayer(!!RULES.shieldScale);
    if(E.setDrawPerPlayer)    E.setDrawPerPlayer(!RULES.flatDraw);     // NOTE the inversion
      if(E.setApexInfinity)     E.setApexInfinity(!!RULES.apexInf);
      if(E.setApexNoStrip)      E.setApexNoStrip(!!RULES.apexNoStrip);
      if(E.setDoublePair)       E.setDoublePair(RULES.dblPair);

  // N-player: a compact panel per opponent, in seat order (next-after-you leftmost → before-you rightmost).

  var equipFx={}, equipFxClear=null;   // zoneKey:id -> { counters, flashUntil, name, good, card, gone } — drives the counter-change / spent flash

  function buildEqBox(e, info, opts){
    opts=opts||{};
    var box=document.createElement('div'); box.className='eq '+(info.good?'buff':'debuff')+(opts.flash?' eqFlash':'')+(opts.ghost?' eqSpent':'');
    var art=e.card && window.CardArt && (window.CardArt[e.card.rank+e.card.suit] || window.CardArt[e.card.id]);

  function renderEquipZone(el, pl, mine, seat){
    if(!el) return;
    el.innerHTML='';

    var zk=zoneKeyFor(seat)+':', now=Date.now(), live={}, flashing=false;   // per-SEAT fx key: 'rival' collided across opponents
    (pl.equipment||[]).forEach(function(e){
      var info=equipInfo(e, mine, seat), key=zk+e.id, prev=equipFx[key];
      var flashUntil=prev?prev.flashUntil:0;
      if(prev && e.counters<prev.counters) flashUntil=now+1300;                          // a counter just dropped → flash the box
      equipFx[key]={ counters:e.counters, flashUntil:flashUntil, name:e.name, good:info.good, card:e.card, gone:false };
      live[key]=true;
      var flash=now<flashUntil; if(flash) flashing=true;
      el.appendChild(buildEqBox(e, info, { flash:flash }));
    });
    for(var key in equipFx){                                                             // a tracked equip that vanished = spent to 0 & retired → brief "spent" ghost
      if(!equipFx.hasOwnProperty(key) || key.indexOf(zk)!==0 || live[key]) continue;
      var f=equipFx[key];
      if(!f.gone){ f.gone=true; f.flashUntil=now+1300; }
      if(now<f.flashUntil){ el.appendChild(buildEqBox({ id:key, name:f.name, counters:0, card:f.card }, { good:f.good }, { ghost:true, flash:true })); flashing=true; }
      else delete equipFx[key];
    }
    if(flashing) scheduleEquipFxClear();

  /* ---- pile entrance: FLIP played cards from the hand (you) or slide from above (rival) ---- */
  function animatePileEntrance(byPlayer){
    var pileEl=$('pile'), kids=pileEl.children;
    if(reduceMotion()){ flipFrom=null; return; }
    var n=kids.length;
    Array.prototype.forEach.call(kids, function(el, i){
      var id=el.dataset.id; if(!id) return;
      var last=el.getBoundingClientRect();
      var from=flipFrom && flipFrom[id];
      var dx, dy, sc, fadeFrom;
      if(from){                                   // true FLIP from the card's slot in your hand
        dx=from.left-last.left; dy=from.top-last.top; sc=from.width/last.width || 1; fadeFrom=1;
      } else {                                    // rival (or dealt) card slides in from their side
        dy=(byPlayer===RIVAL?-1:1)*130; dx=(i-(n-1)/2)*10; sc=.62; fadeFrom=0;
      }
      el.style.transition='none';
      el.style.opacity=fadeFrom;
      el.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
      var delay=i*60;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        el.style.transition='transform .42s cubic-bezier(.2,.8,.25,1) '+delay+'ms, opacity .32s '+delay+'ms';
        el.style.transform=''; el.style.opacity='1';
      }); });
    });
    flipFrom=null;
  }

  /* ---- sweep the beaten cards to the top-left "last beaten" corner ---- */
  function sweepBeaten(cards, ownerLabel){
    var zone=$('beaten'); zone.innerHTML='';

    var row=document.createElement('div'); row.className='bCards';
    cards.forEach(function(c){ row.appendChild(cardEl(c,'tiny')); });
    zone.appendChild(row);
    if(reduceMotion()) return;
    Array.prototype.forEach.call(row.children, function(el, i){
      var last=el.getBoundingClientRect(), from=cards[i].rect;
      var dx=from.left-last.left, dy=from.top-last.top, sc=(from.width/last.width)||1;
      el.style.transformOrigin='top left';
      el.style.transition='none';
      el.style.transform='translate('+dx+'px,'+dy+'px) scale('+sc+')';
      var delay=i*35;
      requestAnimationFrame(function(){ requestAnimationFrame(function(){
        el.style.transition='transform .5s cubic-bezier(.3,.7,.2,1) '+delay+'ms';
        el.style.transform='';
      }); });
    });
  }

  // Spell out an activation cost in words, e.g. "1 diamond energy" or "3 diamond + 3 any energy".
  function spellCost(card, delta){
    var total=Math.max(0, E.activationCost(card)+(delta||0));

    var req=E.costReq(card), parts=[], colored=0;
    for(var s in req){ var n=req[s]; if(!n) continue; colored+=n; parts.push(n+' '+SUIT_WORD[s]+(n>1?'s':'')); }

  // A dedicated, spelled-out "Cost:" line for the description box.

  function cardTextHTML(card){

  // ===== HAND GROUPING + DRAG (drag cards together into a combo, drag up into the play area to play) =====

  function groupKindKF(cards){

  // Sync layout to the engine hand: drop played cards, split now-invalid groups, add new draws (in hand order).
  function reconcileLayout(){
    var byId={}; state.players[YOU].hand.forEach(function(c){ byId[c.id]=c; });
    var seen={}, out=[];
    layout.forEach(function(g){
      var remaining=g.cards.filter(function(c){ return byId[c.id] && !seen[c.id]; }).map(function(c){ return byId[c.id]; });
      remaining.forEach(function(c){ seen[c.id]=true; });

      else out.push({id:g.id, cards:remaining});

  function mergeGroups(aGid, bGid){

  }
  function breakGroup(gid){
    var g=groupById(gid); if(!g||g.cards.length<2) return;

  function breakAllGroups(){

  // REWORK: glow a hand card whose effect a Form in your zone is currently empowering.

  function renderHand(yourTurn){

    hand.className=((pick||yourTurn)?'':'disabled')+(lockedRead?' tutlock':'');
    var canEnter=!reduceMotion(), enterIdx=0;
    if(pick){                                          // pick mode: flat individual cards, no grouping/drag

  // The single context-aware action for the current selection: Activate (default) or Phantasm.
  function ctxAction(){
    var sel=selectedCards();
    // a staged target waits on an explicit confirm — the button IS the confirm
    if(targetPick && targetPick.chosen!=null)
      return {mode:'activate', label:'⚡ Activate', ok:true, reason:'', gold:true, run:function(){ confirmTargetPick(); }};
    if(targetPick)

      var eff=E.effectOf(sel[0]);
      if(eff && eff.kind==='phantasm'){

  function activate(cardId, _opts){

    var card=cardById(cardId); var eff=card?E.effectOf(card):null;

    if(eff.kind==='removeEquip'){                          // needs a target — Equipment, and (boosted) a zone Ride/Form

      if(!tgts.length){ setMessage('No Equipment or zone card on the board to target.'); return; }

  /* Pandora's Outbalance promises "look at the target's hand", so show it. `seat` is in the LOCAL frame (a
   * netplay client rotates before calling). Shared by the local path and the netplay one so the two cannot
   * drift apart. `next` runs once you dismiss. */
  /* Open across mirror updates: the reveal is deliberately NOT on state, and applyMirrorNow() closes any
   * overlay that state does not vouch for — so without this flag the host's very next broadcast wipes the
   * modal, and a netplay caster sees their hand read flash for a frame and vanish. */
  var revealOpen=false;
  function showRevealModal(seat, cards, next){
    next = next || function(){};
    if(!cards || !cards.length){ next(); return false; }
    showModal('<h2>👁 '+logName(seat)+'’s hand</h2>'+
      '<p class="subtle">Outbalance lets you look before they pitch. Remember what you can — you only see it once.</p>'+
      '<div class="revealHand" id="revealHand"></div>'+
      '<button id="revOk">Got it</button>');
    var box=$('revealHand');
    cards.forEach(function(c){ box.appendChild(cardEl(c, 'sm')); });
    revealOpen=true;
    $('revOk').addEventListener('click', function(){ hideOverlay(); next(); });
    return true;
  }
  /* The LOCAL pickup (solo, local MP, and the host's own casts). The engine hands the cards over exactly once
   * and seat-checked (E.takeReveal) and never puts them on state — a revealed hand on `st` would ride along in
   * every netplay snapshot, i.e. back to the player whose hand it is. A netplay CLIENT gets its reveal pushed
   * by the host instead (t:'reveal'), because the host is where the effect actually resolves. */
  function showRevealIfAny(next){
    var rv = (E.takeReveal ? E.takeReveal(YOU) : null);
    if(!rv){ if(next) next(); return false; }
    return showRevealModal(rv.seat, rv.cards, next);

  // After one of YOUR actions resolves, deal with any forced discard it created:

    if(d.ok) logMsg('<b>Rival</b> discarded '+d.discarded.length+' card'+(d.discarded.length>1?'s':'')+'.', 'rival');
    return false;

  function finishPassRound(r){
    if(r.roundWinner!=null){
      var g=gen;
      if(typeof NET!=='undefined' && NET.hostLive && NET.hostLive() && MP() && r.needsLossTarget){ return NET.hostResolveWin(r, g, function(fr){ NET.hostSettleRoundThenCeremony(fr, g); }); }   // netplay: a remote winner picks its target, then the ceremony
      announceRoundWin(r);
      if(state.finished){ render(); return endGame(); }              // Fighter Kick — terminal, no round card
      if(typeof NET!=='undefined' && NET.sendCeremony && NET.hostLive && NET.hostLive()) NET.sendCeremony(r);   // netplay: client replays this ceremony too
      resolveRoundCeremony(r, g, function(){ if(g===gen) afterHumanAction(); });
      return;
    }
    if(r.forcedSkip){ setMessage('Locked out — turn skipped.'); logMsg('<b>You</b> are locked out (Back Stab) — turn skipped.', 'you'); }
    else { setMessage('You passed.'); logMsg('<b>You</b> passed.', 'you'); }
    if(state.finished){ render(); return endGame(); }

  }
  // Reactive shield-guard window for YOU: spring your immunity card (Leyline) to save the threatened

  function openShieldGuardModal(r, cont){

  // Direction 1: YOU cast a destroyShield technique (Critical Hit / Ultima Attack). If the Rival
  // holds a guard (Leyline), let its AI decide to spring it or take the hit — resolved inline.
  function rivalMayGuard(){
    if(!state.shieldResponse || state.shieldResponse.q!==RIVAL) return;
    var rpl=state.players[RIVAL];
    var gcard=rpl.hand.filter(function(c){return c.id===state.shieldResponse.guardId;})[0];
    var fr=(rpl.shields<=2) ? E.shieldGuard(state, RIVAL, state.shieldResponse.guardId) : E.shieldGuardPass(state, RIVAL);

  // COUNTERFEIT: choose a card from the Rival's current play to copy into your hand.

    uniq.sort(function(a,b){ return E.fightValue(b)-E.fightValue(a); });
    var html='<h2>Counterfeit</h2><p>Copy a card from the Rival’s current play — the copy enters your hand and must be played in a fight this round.</p><div class="respOpts">';
    uniq.forEach(function(c){ html+='<button class="respQuick cfPick" data-id="'+c.id+'">'+cardSym(c)+'</button>'; });
    html+='<button id="cfCancel" class="respLet">Cancel</button></div>';
    showModal(html);
    Array.prototype.forEach.call(document.querySelectorAll('.cfPick'), function(btn){
      btn.addEventListener('click', function(){ hideOverlay(); doCounterfeit(cardId, btn.getAttribute('data-id')); });
    });

  }
  function doCounterfeit(cardId, copyId){
    var card=cardById(cardId), eff=card?E.effectOf(card):null;
    var src=state.pile?state.pile.combo.cards.filter(function(c){return c.id===copyId;})[0]:null;
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ NET.clientSend({op:'activate', id:cardId, copyId:copyId}); selected={}; busy=true; render(); return; }

  // PHANTASMAL ILLUSION (fight action): is it available, and can it beat the current play?
  function phantInfo(){
    if(state.turn!==YOU || !state.pile || state.finished || busy) return null;
    var you=state.players[YOU];
    var pc=you.hand.filter(function(c){ var ef=E.effectOf(c); return ef && ef.kind==='phantasm'; })[0];
    if(!pc) return null;                                              // no button unless you hold it
    if(state.pile.combo.size<2) return { show:true, ok:false, reason:'Phantasmal Illusion copies a Special — not a jab.' };
    if(!E.canAfford(you, pc)) return { show:true, ok:false, reason:'Not enough ♦ energy to cast Phantasmal Illusion.' };
    if(you.hand.length-2<1 && (you.deck.length+you.shuffle.length)===0) return { show:true, ok:false, reason:'Keep a card to lead — not enough cards to spend on the illusion.' };
    // v1.31.6: the swap is OPTIONAL. A bare copy takes the play's base values and then your boosts, Equipment
    // and Odysseus's +1 apply — so it can already beat without spending a card. Only fall back to the swap search.
    var bare=phantasmBare(pc.id);
    var solvable=bare || you.hand.some(function(c){ return c.id!==pc.id && phantasmSolve(c, pc.id)>=0; });
    if(!solvable) return { show:true, ok:false, reason:'A bare copy only ties, and no card in your hand completes a higher Special over this play.' };
    return { show:true, ok:true, cardId:pc.id, bare:!!bare };
  }
  // Would a copy with NO swap already beat? Same math the engine runs: base values + applyEquip + Odysseus.
  function phantasmBare(phantId){
    var base=state.pile.combo.cards, plain=[];
    for(var i=0;i<base.length;i++) plain.push({rank:base[i].rank, suit:base[i].suit});
    var cand=E.detectCombo(plain); if(!cand) return false;
    var phCard=state.players[YOU].hand.filter(function(c){return c.id===phantId;})[0];
    var pp=(phCard && E.effectFor)?(E.effectFor(state, YOU, phCard).phantasmPlus||0):0;
    var eff=E.applyEquip?E.applyEquip(cand, YOU, state):cand;
    if(pp) eff={type:eff.type,size:eff.size,value:eff.value+pp,key:[eff.key[0]+pp].concat(eff.key.slice(1)),cards:eff.cards};
    return E.beats(eff, state.pile.combo);
  }
  // find the remove-index that lets `addCard` form a higher Special over the current pile.
  function phantasmSolve(addCard, phantId){
    var base=state.pile.combo.cards;
    var phCard=state.players[YOU].hand.filter(function(c){return c.id===phantId;})[0];
    var pp=(phCard && E.effectFor)?(E.effectFor(state, YOU, phCard).phantasmPlus||0):0;   // Odysseus: +value on the illusion
    for(var ri=0; ri<base.length; ri++){
      var phantom=[]; for(var i=0;i<base.length;i++){ if(i!==ri) phantom.push({rank:base[i].rank,suit:base[i].suit}); }
      var cand=E.detectCombo(phantom.concat([{rank:addCard.rank,suit:addCard.suit}]));
      if(cand && E.applyEquip) cand=E.applyEquip(cand, YOU, state);      // your Equipment/boosts reach the illusion
      if(cand && pp) cand={type:cand.type,size:cand.size,value:cand.value+pp,key:[cand.key[0]+pp].concat(cand.key.slice(1)),cards:cand.cards};
      if(cand && E.beats(cand, state.pile.combo)) return ri;
    }
    return -1;
  }
  function doPhantasm(e){
    if(busy||pick||targeting||targetPick) return;
    var info=phantInfo(); if(!info) return;
    if(!info.ok){ showTip($('ctxBtn'), info.reason); if(e&&e.stopPropagation) e.stopPropagation(); return; }
    pick={ kind:'phantasm', need:1, chosen:{}, cardId:info.cardId, bare:!!info.bare };   // the swap is OPTIONAL
    selected={};
    setMessage(info.bare ? 'Your illusion already beats this play — Confirm to conjure it, or add one card first.'
                         : 'Choose one card from your hand to add to the illusion — it must complete a higher Special.');
    render();
  }
  // End of your turn: if you're over the hand cap, discard down before the Rival acts.
  // Single chokepoint for "hand control to the opponent seat(s)". Netplay-host overrides this to await the
  // remote player's move from the wire instead of running the local AI; single-player behaviour is unchanged.
  function driveRival(){
    if(NET && NET.isHost && NET.isHost()) return MP() ? NET.driveN() : NET.awaitRival();   // 2p → awaitRival; 3–6p → the N-player driver
    return MP()?runOpponents():runRival();
  }
  function afterHumanAction(){
    if(state.finished) return endGame();
    if(state.turn!==YOU) driveRival(); else render();
  }

  // Log the win itself (win / shield strip / prevented / kick / jab). The "Round N — draws" line is logged
  // LATER by logRoundDraw(), after the end-of-round discard + the deferred draw.
  function announceRoundWin(res){
    var w=res.roundWinner, who=logName(w), cls=(w===YOU?'you':'rival');
    var spec = res.comboType ? (TYPE[res.comboType]||'Special') : 'Special';
    /* WHO lost the shield now comes from res.struck (engine, v1.29.6). It used to be "whoever was eliminated,
     * else the string 'a rival'" — so in a free-for-all almost every line read "a rival lost a shield" even
     * though the game knew perfectly well which seat it was. */
    var struck=(res.struck||[]).filter(function(q,i,a){ return a.indexOf(q)===i; });
    var foeList = struck.length ? struck.map(logName).join(' & ') : null;
    var foe = foeList || (MP() ? 'a rival' : (w===YOU?'Rival':'You'));
    var lostVerb = (struck.length===1 && struck[0]===YOU) ? 'lose' : (foe==='You' ? 'lose' : 'lost');
    if(res.kick){
      pendingKick=true; lastEndType='kick';
      setMessage('💥🦵 <b>'+who+'</b> land'+(w===YOU?'':'s')+' the FIGHTER KICK — '+foe+' explode'+(foe==='You'?'':'s')+'!');
      say(w, '💥 {who} land'+(w===YOU?'':'s')+' the FIGHTER KICK — '+foe+' is out!', cls);
    }
    else if(res.prevented && !res.shieldStripped){
      setMessage('🛡 The loss was prevented!');
      say(w, '{who} won with a '+spec+' - but the loss was prevented.', cls);
    }
    else if(res.shieldStripped){
      setMessage('<b>'+foe+'</b> '+lostVerb+' a shield.');
      say(w, '{who} won with a <b>'+spec+'</b> - '+foe+' '+lostVerb+' a shield.', cls);
    }
    else if(res.wonWithCombo){
      // A Special won but nothing was stripped (no valid target, or every strike was blanked). Saying
      // "won the round of Jabs" here was simply wrong — Aj saw exactly this after striking P3's shield.
      setMessage('<b>'+who+'</b> won with a <b>'+spec+'</b> — no shield lost.');
      say(w, '{who} won with a <b>'+spec+'</b> - no shield was lost.', cls);
    }
    else {
      setMessage('<b>'+who+'</b> won the round of Jabs.');
      say(w, '{who} won the round of Jabs.', cls);
    }
    logCatchUp(res, w, struck);
    TUT.note('roundWin', res);
  }
  // Catch-up (M1 shields-as-cards + M2 loser-mill): surface the round loser's refuel. Skipped on a Kick
  // (the loser is out). Every seat is named from res.milled / res.struck — the old version derived the loser
  // as "whichever of YOU/RIVAL didn't win", which in a free-for-all told the WRONG player they lost a shield.
  function logCatchUp(res, w, struck){
    if(res.kick) return;
    if(res.shieldToHand && struck && struck.length){
      struck.forEach(function(q){
        say(q, '🛡→✋ The broken shield returns to {who}’s hand.', q===YOU?'you':'rival');
      });
    }
    if(res.milled){
      Object.keys(res.milled).forEach(function(k){
        var q=parseInt(k,10), mn=res.milled[k];
        say(q, '{who} move'+(q===YOU?'':'s')+' '+mn+' card'+(mn>1?'s':'')+' from '+(q===YOU?'your':'their')+' deck into Energy — catch-up.', q===YOU?'you':'rival');
      });
    }
  }
  function logRoundDraw(res){
    var rn = res.newRound || (state && state.round);      // never render "Round undefined" (Aj saw it)
    if(!rn) return;
    /* One neutral line for everyone (Aj's wording), instead of "You draw 2, Rival draws 2" — which could not
     * be phrased for 3-6 seats and named the wrong player in a free-for-all. Per-seat detail that actually
     * matters (your own fizzle) still follows. */
    // The per-round draw SCALES with the table (= numPlayers since v1.31.3), so ask the engine.
    // E.DRAW_PER_ROUND is the DUEL value and would announce "draws 2" at a six-player table drawing 6.
    var per=(E.drawCountFor&&state)?E.drawCountFor(state):((E.DRAW_PER_ROUND!=null)?E.DRAW_PER_ROUND:2);
    say(null, '<b>Round '+rn+'</b> begins. Each player draws '+per+'.', 'round');
    if(res.draws && res.draws[YOU]===0) logMsg('Draw fizzled — your deck &amp; shuffle pile are empty. Spend energy on effects to recycle cards back into your deck.', 'warn');
  }
  function logDeckout(res){
    // The engine records the decked-out seat in res.eliminated for N-player games; only a duel can safely
    // infer it as "whoever didn't win". Deriving it that way in a free-for-all named the wrong player.
    var elim = (res && res.eliminated && res.eliminated.length) ? res.eliminated[res.eliminated.length-1] : null;
    var loserSeat = (elim!=null) ? elim : (MP() ? null : (state.winner===YOU ? RIVAL : YOU));
    var loser = (loserSeat!=null) ? logName(loserSeat) : 'A rival';
    var youWin = state.winner===YOU;
    lastEndType='deckout';
    setMessage('<b>'+loser+'</b> decked out — '+(youWin?'you win!':(logName(state.winner)+' wins.')));
    say(loserSeat!=null?loserSeat:state.winner, (loserSeat!=null?'{who} decked out!':(loser+' decked out!')), 'warn');
  }

  /* ---- Round-announcement ceremony ----------------------------------------------------------
     A round resolves in beats: win → (special: loser loses a shield) → seize the initiative. THEN the
     end-of-round hand-limit trim runs (before any draw), THEN the new round's cards are drawn and the
     "Round N" card flies them in. Terminal rounds (Fighter Kick) never reach here — they finish on the win. */
  function roundSubtitle(res){
    if(res.opening) return 'Jabs only';
    if(res.draws && res.draws[YOU]===0) return 'Deck empty — spend energy to recycle';
    if(res.newRound===2) return 'Specials unlocked!';
    var nDraw=(E.drawCountFor&&state)?E.drawCountFor(state):2;   // scales with the table — never hardcode it
    return 'Each player draws '+nDraw+(nDraw===1?' card':' cards');
  }
  /* The between-rounds ceremony beats. This was the THIRD site deriving the loser as "whichever of YOU/RIVAL
   * didn't win" (Aj caught it after v1.29.6 fixed the other two): with P2 beating P3, `youWon` is false, so
   * `foe` became 'You' and the ceremony announced "You lose a shield" to a player who lost nothing — while the
   * battle log, already fixed, correctly said "P3 lost a shield". Now reads res.struck like announceRoundWin. */
  function buildPreDrawBeats(res){
    var w=res.roundWinner, youWon=(w===YOU), who=logName(w), cls=youWon?'good':'bad';
    var struck=(res.struck||[]).filter(function(q,i,a){ return a.indexOf(q)===i; });
    var youStruck=struck.indexOf(YOU)>=0;
    var foe = struck.length ? struck.map(logName).join(' & ') : (MP() ? 'a rival' : (youWon?'Rival':'You'));
    var lostVerb = youStruck ? 'lose' : (struck.length ? 'loses' : (foe==='You'?'lose':'loses'));
    var isSpecial=res.comboType && res.comboType!=='single';
    var label=isSpecial ? (TYPE[res.comboType]||'Special') : 'Jab';
    var beats=[{ html:'<b>'+who+'</b> won the round with a <b>'+label+'</b>!', cls:cls }];
    if(res.shieldStripped) beats.push({ html:'<b>'+foe+'</b> '+lostVerb+' a shield 🛡', cls:(youStruck?'bad':cls), shield:true });
    else if(res.prevented) beats.push({ html:foe+'’s shield held — loss prevented 🛡', cls:'dim' });
    beats.push({ html:'<b>'+who+'</b> '+(youWon?'seize':'seizes')+' the initiative!', cls:cls });
    return beats;
  }
  function clearRoundfx(){ var fx=$('roundfx'); if(!fx) return; fx.className=''; fx.onclick=null; var inner=fx.querySelector('.rfInner'); if(inner){ inner.className='rfInner'; inner.innerHTML=''; } }
  function snapDrawnCards(){ Array.prototype.forEach.call(document.querySelectorAll('#hand .card.enter'), function(el){ el.classList.remove('enter'); el.style.animationDelay=''; }); }

  // Phase 1: the pre-draw beats. Reveals the deferred shield shatter on the shield beat. Leaves the banner
  // showing the final beat (so the Round card can swap in, or the trim can hide it).
  function playPreBeats(res, done){
    var fx=$('roundfx'), inner=fx&&fx.querySelector('.rfInner'), g=gen, shieldShown=false;
    function revealShields(){ if(shieldShown) return; shieldShown=true; holdShields=false; if(g===gen && state){ animateShields($('rivalShields'), state.players[RIVAL].shields, RIVAL); animateShields($('youShields'), state.players[YOU].shields, YOU); } }
    if(!fx || reduceMotion()){ revealShields(); setTimeout(function(){ if(g===gen) done(); }, reduceMotion()?200:0); return; }
    var beats=buildPreDrawBeats(res), i=0, timers=[], ended=false;
    function fin(){ if(ended) return; ended=true; timers.forEach(clearTimeout); revealShields(); if(g===gen) done(); }
    function step(){
      if(g!==gen){ fin(); return; }
      if(pendingThreshold){                                            // the shield just broke and unlocked a tier — give it its OWN beat, right here
        var info=pendingThreshold; pendingThreshold=null;
        inner.className='rfInner'; inner.innerHTML=''; fx.className='';  // clear the round banner so the unlock stands alone
        showThreshold(info);
        timers.push(setTimeout(function(){ if(g!==gen){ fin(); return; } fx.className='show'; step(); }, reduceMotion()?1450:2050));
        return;
      }
      if(i>=beats.length){ fin(); return; }
      var b=beats[i++];
      if(b.shield) revealShields();                                    // shatter → checkThresholds() queues pendingThreshold for the next step()
      inner.className='rfInner'+(b.cls?' '+b.cls:''); inner.innerHTML='<div class="rfBeat">'+b.html+'</div>';
      void inner.offsetWidth; inner.classList.add('in');
      timers.push(setTimeout(step, ROUND_BEAT));
    }
    fx.className='show'; fx.onclick=function(){ i=beats.length; timers.forEach(clearTimeout); timers=[]; fin(); };   // tap to skip the beats
    step();
  }
  // Phase 2: the "Round N" card (drawn cards fly in here). res.draws must be populated by now.
  function playRoundCardBeat(res, done){
    var fx=$('roundfx'), inner=fx&&fx.querySelector('.rfInner'), g=gen, ended=false, t;
    if(!fx || reduceMotion()){ setTimeout(function(){ if(g===gen) done(); }, reduceMotion()?200:0); return; }
    function fin(){ if(ended) return; ended=true; clearTimeout(t); fx.className=''; fx.onclick=null; inner.className='rfInner'; inner.innerHTML=''; snapDrawnCards(); if(g===gen) done(); }
    var fizzle=!!(res.draws && res.draws[YOU]===0);
    inner.className='rfInner rfCard'+(fizzle?' fizzle':''); inner.innerHTML='<div class="rfRound">Round '+res.newRound+'</div><div class="rfSub">'+roundSubtitle(res)+'</div>';
    void inner.offsetWidth; inner.classList.add('in');
    fx.className='show'; fx.onclick=fin;
    t=setTimeout(fin, ROUND_HOLD);
  }
  // End-of-round hand-limit trim — runs BEFORE the new draw. Over the cap? prompt the human to pitch
  // (to Energy); confirmPick calls `cb` when done. Otherwise proceed immediately.
  function endOfRoundTrimThen(cb){
    /* Clean-up Phase: everyone discards down to hand size (to Energy), no priority. Opponents auto-trim; you
     * pick. This used to trim and announce seat 1 ONLY — so at a six-player table seats 2+ were never trimmed
     * here and their clean-up was invisible in the log. Narration goes through `say`, which renders {who} in
     * each reader's own frame and broadcasts in netplay. */
    for(var ci=0; ci<state.numPlayers; ci++){
      if(ci===YOU || state.players[ci].eliminated) continue;
      var cOver = state.players[ci].hand.length - E.MAX_HAND;
      if(cOver>0){ E.discardToLimit(state, ci); say(ci, '{who} discarded '+cOver+' to hand size → energy pile.', 'rival'); }
    }
    var over = state.players[YOU].hand.length - E.MAX_HAND;
    if(over>0){
      clearRoundfx();                                          // hide the banner so the hand + pick are visible
      pick={ kind:'handlimit', need:over, chosen:{}, resume:cb, resumeG:gen };
      setMessage('Clean-up — over the hand limit ('+E.MAX_HAND+'). Discard '+over+' to your Energy Pile.');
      render();
      return;
    }
    cb();
  }
  // Orchestrate a resolved round: pre-draw beats → end-of-round trim → draw → Round card → continuation.
  function resolveRoundCeremony(res, g, continuation){
    inCeremony=true;                                            // suppress the render-diff deck-mill float here; the catch-up mill fires its own explicit −N
    holdShields = !reduceMotion() && !!res.shieldStripped;      // defer the shatter to its beat
    render();                                                   // settle board; no fresh cards yet (draw deferred)
    playPreBeats(res, function(){
      if(g!==gen) return;
      flushThreshold(function(){                                // a transform tier that just unlocked gets its OWN beat here
      if(g!==gen) return;
      endOfRoundTrimThen(function(){
        if(g!==gen) return;
        E.roundDraw(state, res);                                // draw the new round's cards (held invisible for a beat)
        if(res.deckedOut){ inCeremony=false; logDeckout(res); render(); clearRoundfx(); busy=false; return endGame(); }
        logRoundDraw(res);
        enterDelayBase = reduceMotion()?0:340;                  // Round banner appears FIRST (round start), THEN the new cards fly in
        render(); enterDelayBase = 0;
        playRoundCardBeat(res, function(){ inCeremony=false; if(g===gen) continuation(); });
      });
      });
    });
  }

  /* Turn one seat's AI log into paced "beats" — the readable presentation layer: a dwell per action,
   * the card flashed or revealed, and a centre-stage message. SHARED by the duel driver (runRival) and
   * the N-player driver (runOpponents). It lived inline in runRival, and because the free-for-all driver
   * only logged, every bit of the v1.25.0/v1.26.0 readability work (rival dwells, the QUICK cue, the
   * two-phase art flash) was missing there — your play never breathed, the caption still read "You
   * played…" under an opponent's card, and their effects were invisible. Extracted so it cannot drift. */
  function buildOppBeats(log, seat){
    var who=logName(seat), beats=[];
      log.forEach(function(e){
        if(e.play){
          var eff=e.card?E.effectOf(e.card):null;
          beats.push({ dwell: revealDwell(e.card), run:function(){
            say(seat, '{who} played '+effPhrase(e.card)+'.', 'rival'); bumpEffect(seat, eff);
            if(e.card){ if(eff&&eff.kind==='transform'){ flashArt(e.card, who); } else { revealEffect(e.card, who); } setMessage('<b>'+who+' used '+(eff?eff.name:'a card')+'.</b>'); }   // Forms pop center-stage only; read them by hovering the Forms & Rides zone
          }});
        }
        else if(e.useEquip){ beats.push({ dwell:750, run:function(){ say(seat, '{who} spent a '+e.name+' counter — drew a card.', 'rival'); } }); }
        else if(e.fight==='play'){ bumpFight(seat, e.combo&&e.combo.type);   // opponents' fights were never counted — see recordGame
        beats.push({ dwell:1500, run:function(){ say(seat, '{who} played '+playPhrase(e.combo)+(e.boost?' with a <b>Brilliant Tactic</b> boost':'')+'.', 'rival'); bumpFight(RIVAL, e.combo.type); setMessage('<b>'+who+'</b> played '+kindPhrase(e.combo.type)+'.'); render(); } }); }
        else if(e.phantasm){ beats.push({ dwell:1300, run:function(){ say(seat, '{who} conjured a Phantasmal Illusion — a '+kindLabel(e.made)+' overtakes the pile.', 'rival'); setMessage('🎭 <b>Rival warped your play with a Phantasmal Illusion!</b>'); render(); } }); }
        else if(e.fight==='pass'){ beats.push({ dwell:950, run:function(){ say(seat, '{who} passed.', 'rival'); setMessage('<b>'+who+'</b> passed.'); render(); } }); }
        else if(e.discard){ beats.push({ dwell:600, run:function(){ say(seat, '{who} discarded '+e.discard+' to hand size.', 'rival'); } }); }
        else if(e.forcedDiscard){ beats.push({ dwell:750, run:function(){ say(seat, '{who} discarded '+e.forcedDiscard+' card'+(e.forcedDiscard>1?'s':'')+'.', 'rival'); } }); }
        else if(e.lockedSkip){ beats.push({ dwell:650, run:function(){ say(seat, '{who} is locked out — turn skipped.', 'warn'); setMessage('<b>'+who+'</b> is locked out — turn skipped.'); render(); } }); }
        else if(e.stuck){ beats.push({ dwell:650, run:function(){ say(seat, '{who} is out of cards!', 'warn'); setMessage('<b>'+who+'</b> is out of cards!'); render(); } }); }
      });
    return beats;
  }

  function runRival(){
    if(state.finished){ return; }
    busy=true; render(); $('rivalStatus').textContent='thinking…';
    var g=gen;
    setTimeout(function step(){
      if(g!==gen) return;
      if(state.finished || state.turn===YOU){ busy=false; $('rivalStatus').textContent=''; render(); return; }
      var log=AI.takeTurn(state, RIVAL, difficulty, [YOU]);   // [YOU] = suspend if you can answer a Quick
      $('rivalStatus').textContent='';
      var passed=log.filter(function(e){return e.fight==='pass';})[0];
      if(passed && passed.result && passed.result.roundWinner!=null){
        var pres=passed.result;
        if(pres.shieldResponsePending && state.shieldResponse){          // Rival's shield is threatened — it may spring its guard
          var q=state.shieldResponse.q, rpl=state.players[q];
          var rgcard=rpl.hand.filter(function(c){return c.id===state.shieldResponse.guardId;})[0];
          var fr=(rpl.shields<=2) ? E.shieldGuard(state, q, state.shieldResponse.guardId) : E.shieldGuardPass(state, q);
          if(fr.guarded){ if(rgcard) flashArt(rgcard, 'Rival'); quickFlash('Rival', fr.guardName, false); setMessage('🛡 <b>Rival sprang '+fr.guardName+' — its shield holds!</b>'); logMsg('<b>Rival</b> sprang '+fr.guardName+' in response — its shield holds.', 'rival'); }
          return finishStep(fr, g, log.filter(function(e){return e.play;}));   // finishStep renders (with the ceremony's held draw/shield)
        }
        return finishStep(pres, g, log.filter(function(e){return e.play;}));   // finishStep renders (with the ceremony's held draw/shield)
      }
      // Turn the Rival's actions into paced "beats". Effect activations reveal the card in the side
      // panel and dwell so you can read them; the fight/pass beats render the board.
      var beats=buildOppBeats(log, RIVAL);
      playBeats(beats, g, function(){
        if(g!==gen) return;
        render();                                                                 // settle the board to the final state
        if(state.preFightQ===YOU){ return promptHumanPreFight(g); }               // Rival is about to fight — you may spring Back Stab
        if(state.pending && state.respondFor===YOU){ return promptHumanResponse(g); }   // your turn to answer a Quick
        if(state.shieldResponse && state.shieldResponse.q===YOU){ return openShieldGuardModal(null, function(){ resumeRival(g); }); }   // Rival's destroyShield threatens you — spring a guard
        if(state.discardPending && state.discardPending.player===YOU){ return promptHumanDiscard(g); }   // Rival forced you to discard
        if(state.finished){ busy=false; return endGame(); }
        setTimeout(function(){ if(g===gen) step(); }, 480);
      });
    }, playHold());
  }
  // The Rival forced a discard on you: pause its turn, let you choose which cards to pitch, then resume.
  function promptHumanDiscard(g){
    var dp=state.discardPending;
    if(!dp || dp.player!==YOU){ return resumeRival(g); }
    busy=false;                                            // let the picker be interactive
    pick={ kind:'discard', need:dp.count, chosen:{}, resumeG:g, from:dp.from||null };
    setMessage(dp.from ? ('Choose '+dp.count+' of the cards you looked at to bank into Energy — keep the rest.') : ('Rival forces a discard — choose '+dp.count+' card'+(dp.count>1?'s':'')+' to send to your Shuffle Pile.'));
    render();
  }
  // Direction 2: the Rival cast a Technique you can answer. Pause the Rival's turn,
  // let you pick a Quick (or decline), then resume the rest of its turn.
  function eligibleQuicks(){
    var you=state.players[YOU], e=you.energy.length, pend=state.pending;
    return you.hand.filter(function(c){
      var ef=E.effectOf(c);
      if(!ef||!ef.impl||!ef.quick||!E.canAfford(you, c)) return false;
      if(ef.kind==='protect') return pend.eff.kind==='removeEquip' && you.equipment.length>0;
      return true;                                   // Counter Spell answers any Technique
    });
  }
  // Settle the response stack: the Rival's AI answers its own windows inline (recursively), and when
  // a window is YOURS you're prompted; when the stack settles, `done` runs. Used by both a Rival cast
  // (cont resumes its turn) and YOUR own cast (cont continues your turn) — handles Counter-a-Counter.
  function settleWindows(g, done){
    if(g!==gen) return;
    // NETPLAY HOST: the Rival is a remote human — route through NET so their response windows wait on the wire
    // (instead of the AI loop below), while the host's own windows still pop the normal modal.
    if(typeof NET!=='undefined' && NET.hostSettleActive && NET.hostSettleActive()){ return (MP() && NET.hostSettleN) ? NET.hostSettleN(g, done) : NET.hostSettle(g, done); }
    var guard=0, lastResp=null, lastQ=null;
    // Drain the window for ANY AI seat. This used to loop on `respondFor===RIVAL` only, and the branch
    // below handles `respondFor===YOU` — so in a free-for-all a window owed to seat 2+ was handled by
    // NEITHER: that seat never countered, and the undrained window left the turn parked. `respondDecision`
    // is seat-generic and always advances state (respond or decline), so this terminates.
    while(state.pending && state.respondFor!=null && state.respondFor!==YOU && !isHumanSeat(state.respondFor) && guard++<64){
      var q=state.respondFor;
      var resp=AI.respondDecision(state, q);
      if(!resp) break;
      if(resp.respondedWith){
        bumpEffect(q, {kind:resp.respondKind, id:resp.respondedWith});
        if(resp.countered) say(q, '{who} countered with '+resp.respondName+'!', 'rival');
        else say(q, '{who} answered at instant speed with '+resp.respondName+'.', 'rival');
        lastResp=resp; lastQ=q;
      }
    }
    if(lastResp){                                                  // the Rival sprang a Quick — flash a cue and DWELL so it's readable (it used to resolve instantly, log-only)
      setMessage(lastResp.countered ? ('🌀 <b>'+logName(lastQ)+' Countered with '+lastResp.respondName+'!</b>') : ('<b>'+logName(lastQ)+' answered with '+lastResp.respondName+'.</b>'));
      quickFlash(logName(lastQ), lastResp.respondName, !!lastResp.countered); render();
      return setTimeout(function(){
        if(g!==gen) return;
        if(state.pending && state.respondFor===YOU){ render(); return promptHumanResponse(g, function(){ settleWindows(g, done); }); }
        render(); done();
      }, reduceMotion()?300:1400);
    }
    if(state.pending && state.respondFor===YOU){ render(); return promptHumanResponse(g, function(){ settleWindows(g, done); }); }
    render(); done();
  }
  function promptHumanResponse(g, cont){
    cont = cont || function(){ resumeRival(g); };
    var pend=state.pending, rivalEff=E.effectOf(pend.card)||{}, rivalName=rivalEff.name||'a Technique';
    var quicks=eligibleQuicks();
    if(!quicks.length){ if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ NET.clientSend({op:'decline'}); busy=true; render(); return; } E.declineResponse(state, YOU); return cont(); }   // nothing to answer with — auto-pass
    /* WHO cast it and WHO it is aimed at were both missing — Aj: "who or what is being targetted? why should I
     * counter it? this lacks some vital information." In a free-for-all that decides the whole choice: a
     * Telekinesis aimed at P2 is none of your business, one aimed at YOU is worth a Counter Spell. */
    var caster=(typeof pend.p==='number') ? pend.p : null;
    var aimed=null;
    if(caster!=null && E.effectTarget && (E.HOSTILE_SINGLE && E.HOSTILE_SINGLE[rivalEff.kind]))
      aimed=E.effectTarget(state, caster, pend.opts||{});
    var casterTxt=(caster!=null) ? ('<b>'+logName(caster)+'</b>') : 'Someone';
    var aimTxt='';
    if(aimed!=null) aimTxt = (aimed===YOU) ? ' at <b class="respAtYou">YOU</b>' : (' at <b>'+logName(aimed)+'</b>');
    var lead='<p>'+casterTxt+' cast <b>'+rivalName+'</b>'+aimTxt+'. Play a Quick in response, or let it resolve.</p>';
    // when it is not aimed at you, say so plainly rather than leaving you to work it out
    if(aimed!=null && aimed!==YOU) lead+='<p class="respNotYou">It does not target you — countering only helps '+logName(aimed)+'.</p>';
    var incoming=(rivalEff.text?('<div class="respIncoming"><b>'+rivalName+'</b> ('+cardSym(pend.card)+') — '+rivalEff.text+'</div>'):'');
    var html='<h2>Respond?</h2>'+lead+incoming+tableContextHTML()+'<div class="respOpts">';
    quicks.forEach(function(c){ var ef=E.effectOf(c);
      html+='<button class="respQuick" data-id="'+c.id+'">'+ef.name+' · '+cardSym(c)+' ('+ef.cost+'⚡)<span class="respTxt">'+ef.text+'</span></button>'; });
    html+='<button id="respDecline" class="respLet">Let it resolve</button></div>'+peekBtnHTML();
    showModal(html); wirePeek();
    Array.prototype.forEach.call(document.querySelectorAll('.respQuick'), function(btn){
      btn.addEventListener('click', function(){ humanResponds(g, btn.getAttribute('data-id'), cont); });
    });
    $('respDecline').addEventListener('click', function(){ humanDeclines(g, cont); });
  }
  function humanResponds(g, quickId, cont){
    cont = cont || function(){ resumeRival(g); };
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ hideOverlay(); NET.clientSend({op:'respond', id:quickId}); busy=true; render(); return; }
    if(g!==gen){ hideOverlay(); return; }
    var qcard=state.players[YOU].hand.filter(function(c){return c.id===quickId;})[0];
    var qeff=qcard?E.effectOf(qcard):null;
    var pendName=(E.effectOf(state.pending.card)||{}).name||'the Technique';
    var r=E.respond(state, YOU, quickId);
    if(!r.ok){ setMessage(r.reason); return; }
    hideOverlay();
    if(qeff){ flashArt(qcard, 'You'); quickFlash('You', qeff.name, qeff.kind==='counter'); }
    if(qeff && qeff.kind==='counter'){ setMessage('🌀 You <b>Countered</b> '+pendName+'!'); logMsg('<b>You</b> Countered '+pendName+' with '+qeff.name+'!', 'you'); }
    else { setMessage('You answered with <b>'+qeff.name+'</b>.'); logMsg('<b>You</b> answered with '+qeff.name+' at instant speed.', 'you'); }
    bumpEffect(YOU, qeff);
    render(); cont();
    if(typeof TUT!=='undefined' && TUT.note){ tutAwaitCounter=false; TUT.note('respond', { countered: !!(qeff && qeff.kind==='counter') }); }   // Quicks lesson gates here
  }
  function humanDeclines(g, cont){
    cont = cont || function(){ resumeRival(g); };
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ hideOverlay(); NET.clientSend({op:'decline'}); busy=true; render(); return; }
    if(g!==gen){ hideOverlay(); return; }
    hideOverlay();
    E.declineResponse(state, YOU);
    say(YOU, '{who} let it resolve.', 'dim');
    render(); cont();
    if(tutAwaitCounter && typeof TUT!=='undefined' && TUT.isActive && TUT.isActive()){ tutAwaitCounter=false; setMessage('That one resolved — let’s try again. Counter the next one!'); setTimeout(function(){ if(gen===g) tutCastRivalTech(); }, 700); }   // lesson: don't brick if they let it resolve
  }
  // ---- PRE-FIGHT QUICK WINDOW (Back Stab): the NON-active player may spring a Quick before the active
  // player's Play Sub-Phase. Two directions: you spring it on the Rival (Case A), or the Rival on you (Case B). ----
  function eligiblePreFightQuicks(){
    var you=state.players[YOU];
    return you.hand.filter(function(c){ var ef=(E.effectFor?E.effectFor(state,YOU,c):E.effectOf(c)); return ef&&ef.impl&&ef.quick&&ef.kind==='lockout'&&E.canAfford(you,c); });   // effectFor: Hermes Mode makes Back Stab a Quick
  }
  // Case A — the Rival is about to fight and YOU hold Back Stab: offer to spring it and lock their turn.
  function promptHumanPreFight(g){
    var clientNet = (typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive());
    if(!clientNet && g!==gen) return;
    var quicks=eligiblePreFightQuicks();
    if(!quicks.length){ if(clientNet){ NET.clientSend({op:'prefightPass'}); busy=true; render(); return; } E.preFightPass(state, YOU); return resumeRival(g); }
    var html='<h2>Rival is about to fight</h2><p>They hold the initiative. Spring a Quick to lock their turn before they play?</p>'+tableContextHTML()+'<div class="respOpts">';
    quicks.forEach(function(c){ var ef=E.effectOf(c); html+='<button class="respQuick" data-id="'+c.id+'">'+ef.name+' · '+cardSym(c)+' ('+ef.cost+'⚡)<span class="respTxt">'+ef.text+'</span></button>'; });
    html+='<button id="pfDecline" class="respLet">Let them fight</button></div>'+peekBtnHTML();
    showModal(html); wirePeek();
    Array.prototype.forEach.call(document.querySelectorAll('.respQuick'), function(btn){
      btn.addEventListener('click', function(){ humanSpringsPreFight(g, btn.getAttribute('data-id')); });
    });
    $('pfDecline').addEventListener('click', function(){
      if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ hideOverlay(); NET.clientSend({op:'prefightPass'}); busy=true; render(); return; }
      hideOverlay(); E.preFightPass(state, YOU); logMsg('<b>You</b> let the Rival act.', 'dim'); resumeRival(g); });
  }
  function humanSpringsPreFight(g, cardId){
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){ hideOverlay(); NET.clientSend({op:'prefight', id:cardId}); busy=true; render(); return; }
    if(g!==gen){ hideOverlay(); return; }
    var card=state.players[YOU].hand.filter(function(c){return c.id===cardId;})[0];
    var r=E.preFightCast(state, YOU, cardId);
    if(!r.ok){ setMessage(r.reason); return; }
    hideOverlay();
    if(card) flashArt(card, 'You');
    setMessage('🗡 You spring <b>Back Stab</b> — the Rival is locked!');
    logMsg('<b>You</b> sprang Back Stab — the Rival is locked out of this turn.', 'you');
    bumpEffect(YOU, E.effectOf(card));
    render();
    settleWindows(g, function(){ resumeRival(g); });   // Rival may Counter it; then its turn resumes (now locked → forced skip)
  }
  // Case B — YOU are about to fight and the Rival holds Back Stab: give the Rival its pre-fight window first.
  // Synchronous (proceed immediately) unless the Rival actually springs Back Stab.
  function rivalPreFightThen(g, proceed){
    var pf=E.openPreFight(state);
    var q=pf.q;
    // ANY AI opponent can hold this window, not just seat 1 — `openPreFight` names whichever seat is next,
    // which in a free-for-all is often seat 2+. This used to test `pf.q!==RIVAL` and silently drop those,
    // so Back Stab (and every Form-granted pre-fight Quick) was dead for P3 and beyond. Your own window is
    // prompted elsewhere (promptHumanPreFight); a human seat's is driven by netplay (NET.hostPreFight).
    if(!pf.preFightPending || q==null || q===YOU || isHumanSeat(q)){ return proceed(); }
    var mv=AI.preFightMove(state, q, YOU, diffOf(q));
    if(mv.pass){ E.preFightPass(state, q); return proceed(); }
    var r=E.preFightCast(state, q, mv.cast);
    if(!r.ok){ E.preFightPass(state, q); return proceed(); }
    busy=true;
    setMessage('🗡 '+logName(q)+' springs <b>Back Stab</b> — your turn is locked!');
    say(q, '{who} sprang Back Stab — you are locked out of this turn.', 'rival');
    bumpEffect(q, E.effectOf(mv.card));
    render();
    settleWindows(g, function(){                       // you (active) may Counter the Back Stab
      if(g!==gen) return;
      if(E.isLocked(state, YOU)){ finishPassRound(E.pass(state, YOU)); }   // fight denied → forced skip
      else proceed();                                                       // you Countered it → fight as normal
    });
  }
  function resumeRival(g){
    if(g!==gen) return;
    if(state.finished){ busy=false; return endGame(); }
    return driveRival();                              // finish the Rival's suspended turn (netplay-aware)
  }
  // ---- N-player turn driver: play every AI seat until control returns to the human (seat 0) ----
  // logOppPlays was here: a log-only renderer for opponents' turns. Superseded by buildOppBeats, which
  // logs AND paces/flashes/messages. Deleted rather than left as a second path that could drift again.
  function mpResolveAIShieldWindows(){                 // auto-resolve any shield-guard windows that belong to AI seats
    var guard=0;
    while(state.shieldResponse && state.shieldResponse.q!==YOU && guard++<16){
      var q=state.shieldResponse.q, rpl=state.players[q];
      if(rpl.shields<=2 && state.shieldResponse.guardId) E.shieldGuard(state, q, state.shieldResponse.guardId); else E.shieldGuardPass(state, q);
    }
  }
  // A human occupies opponent seat p — the turn driver pauses here and waits for their input to arrive.
  // Today this is unreachable (every opponent seat is 'ai'); Phase 5 netplay resumes the driver via
  // applyRemoteInput() once the remote seat's move is broadcast in. The busy flag keeps the local UI locked.
  function awaitHumanSeat(p, g){
    busy=true; $('rivalStatus').textContent='Waiting for '+seatName(p)+'…'; render();
    if(!isHumanSeat(p)) console.warn('awaitHumanSeat called on a non-human seat', p, controllerOf(p));
    // no auto-resume: the transport (Phase 5) will call back into the driver when the remote input lands.
  }
  /* How long YOUR play sits on the table before an opponent answers. Aj: "my play also gets clobbered right
   * away by ai, i know they think fast… but can my play just linger a bit?" The duel driver had a 650ms opener;
   * the free-for-all driver had NONE and stepped straight into the first AI seat. One constant, both drivers. */
  var PLAY_HOLD = 1000;
  function playHold(){ return reduceMotion() ? 60 : PLAY_HOLD; }
  function runOpponents(){
    if(state.finished){ busy=false; render(); return endGame(); }
    busy=true; render();
    var g=gen;
    var firstStep=true;
    (function step(){
      if(firstStep){ firstStep=false; return setTimeout(function(){ if(g===gen) step(); }, playHold()); }   // let your play linger
      if(g!==gen) return;
      if(state.shieldResponse && state.shieldResponse.q===YOU){ return openShieldGuardModal(null, function(){ if(g===gen) step(); }); }   // your shield is threatened
      mpResolveAIShieldWindows();
      if(state.finished){ busy=false; $('rivalStatus').textContent=''; render(); return endGame(); }
      if(state.discardPending && state.discardPending.player===YOU){ return promptHumanDiscard(g); }  // a rival forced YOU to discard — prompt (resumes via resumeRival→runOpponents)
      if(state.preFightQ===YOU){ return promptHumanPreFight(g); }                                   // resumes via resumeRival→runOpponents
      if(state.pending && state.respondFor===YOU){ return promptHumanResponse(g); }                 // ditto
      if(state.turn===YOU){ busy=false; $('rivalStatus').textContent=''; render(); return; }        // back to the human
      var p=state.turn;
      if(isHumanSeat(p)){ return awaitHumanSeat(p, g); }   // a human occupies this opponent seat — pause for their input (unreachable today: all opponents are 'ai')
      $('rivalStatus').textContent=seatName(p)+' is playing…';
      var log=AI.takeTurn(state, p, diffOf(p), [YOU]);
      /* C1: play this seat's turn as paced BEATS, exactly like the duel. Previously this driver called
       * logOppPlays and rendered — no dwell, no flashArt/revealEffect, no setMessage, no bumpEffect — so
       * an opponent's turn was invisible: your play never breathed, the centre-stage caption still read
       * "You played…" under their card, and their effects never showed. The round-resolution branches
       * below must run AFTER the beats, so they moved inside the completion callback. */
      var beats=buildOppBeats(log, p);
      playBeats(beats, g, function(){
        if(g!==gen) return;
        var passed=log.filter(function(e){ return e.fight==='pass'; })[0];
        var res=passed && passed.result;
        if(res && res.roundWinner!=null){                                                             // a round resolved on this seat's pass
          if(res.needsLossTarget){                                                                    // YOU won with a Special → pick whose shield to strip
            return promptLossTarget(res, g, function(fr){ if(g!==gen) return;
              if(fr.shieldResponsePending && state.shieldResponse && state.shieldResponse.q===YOU){ announceRoundWin(fr); return openShieldGuardModal(null, function(){ if(g!==gen) return; if(state.finished){ busy=false; render(); return endGame(); } resolveRoundCeremony(fr, g, function(){ if(g===gen) step(); }); }); }
              mpResolveAIShieldWindows(); announceRoundWin(fr); if(state.finished){ busy=false; render(); return endGame(); } resolveRoundCeremony(fr, g, function(){ if(g===gen) step(); }); });
          }
          if(res.shieldResponsePending && state.shieldResponse && state.shieldResponse.q===YOU){
            announceRoundWin(res);
            return openShieldGuardModal(null, function(){ if(g!==gen) return; if(state.finished){ busy=false; render(); return endGame(); } resolveRoundCeremony(res, g, function(){ if(g===gen) step(); }); });
          }
          mpResolveAIShieldWindows();
          announceRoundWin(res);
          if(state.finished){ busy=false; render(); return endGame(); }
          return resolveRoundCeremony(res, g, function(){ if(g===gen) step(); });
        }
        render();
        setTimeout(step, reduceMotion()?40:460);
      });
    })();
  }
  function finishStep(res, g, effs){
    if(effs && effs.length) effs.forEach(function(e){ logMsg('<b>Rival</b> played '+effPhrase(e.card)+'.', 'rival'); bumpEffect(RIVAL, e.card?E.effectOf(e.card):null); });
    logMsg('<b>Rival</b> passed.', 'rival');
    announceRoundWin(res);
    if(state.finished){ render(); busy=false; return endGame(); }    // Fighter Kick — terminal, no round card
    resolveRoundCeremony(res, g, function(){
      if(g!==gen) return;
      if(state.turn===YOU){ busy=false; $('rivalStatus').textContent=''; render(); } else runRival();
    });
  }

  // Sort tidies the hand into sorted order. In normal play it breaks any built combos and clears selection;
  // during a pick (forced discard / hand-limit) it ONLY reorders — your picked cards stay picked.
  function fv(c){ return E.fightValue(c); }
  function bySortVal(a,b){ return fv(a)-fv(b) || E.SUITS.indexOf(a.suit)-E.SUITS.indexOf(b.suit); }
  // Group the hand into pairs/trios by rank (rank with 4 → two pairs), ordered low→high; singles interleave by rank.
  function sortIntoPairs(hand){
    var byV={}; hand.forEach(function(c){ (byV[fv(c)]=byV[fv(c)]||[]).push(c); });
    var groups=[];
    Object.keys(byV).map(Number).sort(function(a,b){return a-b;}).forEach(function(v){
      var cs=byV[v].slice().sort(bySortVal);
      if(cs.length===4){ groups.push(cs.slice(0,2)); groups.push(cs.slice(2,4)); }   // 4-of-a-kind → two playable pairs
      else groups.push(cs);                                                          // 1 single · 2 pair · 3 trio
    });
    return groups;
  }
  // Pull out runs of 5 consecutive values as straight groups (low→high), rest as singles.
  function sortIntoStraights(hand){
    var remaining=hand.slice(), groups=[], made=true;
    while(made){
      made=false;
      var byV={}; remaining.forEach(function(c){ var v=fv(c); if(!byV[v]) byV[v]=c; });   // one card per value
      var vals=Object.keys(byV).map(Number).sort(function(a,b){return a-b;});
      for(var s=0;s<vals.length;s++){
        var run=[vals[s]]; for(var k=1;k<5;k++){ if(vals.indexOf(vals[s]+k)>=0) run.push(vals[s]+k); else break; }
        if(run.length===5){
          var cards=run.map(function(v){ return byV[v]; });
          groups.push(cards.slice().sort(bySortVal));
          cards.forEach(function(cd){ remaining=remaining.filter(function(x){ return x!==cd; }); });
          made=true; break;
        }
      }
    }
    remaining.slice().sort(bySortVal).forEach(function(c){ groups.push([c]); });
    groups.sort(function(a,b){ return Math.min.apply(null,a.map(fv)) - Math.min.apply(null,b.map(fv)); });   // low→high by the group's lowest card
    return groups;
  }
  function updateSortLabel(){ var b=$('sortBtn'); if(b) b.textContent=SORT_TITLE[sortState]||'Sort'; }
  function applySortLayout(groups){
    withFlip(function(){
      handOrder=[]; groups.forEach(function(g){ g.forEach(function(c){ handOrder.push(c.id); }); });
      if(!pick){ layout=groups.map(function(g){ return {id:newGid(), cards:g}; }); selected={}; }
    });
  }
  function flipSort(){
    if(peeking) return;                               // no reordering while reviewing
    if(!state || state.finished) return;
    if(!pick && (state.turn!==YOU || busy)) return;   // during a forced discard/hand-limit pick the turn may be the rival's — Sort must still tidy
    var target=SORT_NEXT[sortState]||'singles';
    var hand=state.players[YOU].hand.slice();
    var groups = target==='pairs' ? sortIntoPairs(hand) : target==='straights' ? sortIntoStraights(hand) : E.sortHand(hand).map(function(c){ return [c]; });
    applySortLayout(groups);
    sortState=target; updateSortLabel();   // label shows the arrangement now applied
  }
