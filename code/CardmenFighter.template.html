    overlayDismiss=closePanel;
  }
  function showSettings(){
    function rowHTML(id, on, label, note){
      return '<button type="button" class="settingRow'+(on?' on':'')+'" id="'+id+'" role="switch" aria-checked="'+(on?'true':'false')+'">'+
        '<span class="settingBox">'+(on?'✓':'')+'</span>'+
        '<span class="settingBody"><span class="settingLbl">'+label+'</span><span class="settingNote">'+note+'</span></span></button>';
    }
    showModal('<h2>⚙️ Settings</h2>'+
      '<div class="settings">'+
        rowHTML('setPulse', pulseDetail, 'Show detailed energy pulses', 'Show each energy movement by suit — spent, gained, and milled from your deck — instead of just the net change.')+
        rowHTML('setSound', !SFX.isMuted(), 'Sound effects', 'Card, shield, and finisher sound cues.')+
        '<div class="settingSoon">🌐 Language options — coming later.</div>'+
      '</div>'+
      '<button id="setRules" class="ghostBtn">⚗️ Custom rules'+(customRules()?' · on':'')+'</button>'+
      '<button id="setDone">Done</button>');
    function repaint(btn, on){ btn.classList.toggle('on', on); btn.setAttribute('aria-checked', on?'true':'false'); btn.querySelector('.settingBox').textContent=on?'✓':''; }
    $('setPulse').addEventListener('click', function(){ pulseDetail=!pulseDetail; try{ localStorage.setItem(PULSE_KEY, pulseDetail?'1':'0'); }catch(e){} repaint(this, pulseDetail); });
    $('setSound').addEventListener('click', function(){ SFX.toggle(); paintSfxBtn(); repaint(this, !SFX.isMuted()); });
    $('setRules').addEventListener('click', function(){
      var live=!!(state && !state.finished);
      showRules({ readonly:live, back:showSettings,
                  why:'This game is already running, so its rules are fixed. Start a new game to change them.' });
    });
    $('setDone').addEventListener('click', hideOverlay);
    overlayDismiss=hideOverlay;
  }
  /* ---- Energy / Shuffle pile viewers -------------------------------------------------------------
   * Two views, one modal, ← / → between them (ENERGY-REORDER-DESIGN.md, decision 2).
   *  · ENERGY is ORDERED and orderable: position 1 is spent next, and tapping a card offers 🔍 View
   *    (the full description-box text) and ⤒ Promote to top.
   *  · SHUFFLE is read-only — what is queued to come back when your deck runs dry.
   * The "first ♥ / first ♦ …" tags are decision 3's labelling: a colored pip takes the EARLIEST card of
   * that suit, so a promoted card of another suit gets skipped. Tagging the first of each suit makes that
   * visible instead of mysterious.
   */
  var pileWhich='energy', pileSel=null, pileRead=null, pileSeat=0;   // pileSeat: whose pile we are looking at (0 = you)
  function pileCanReorder(){
    if(pileSeat!==YOU) return false;                                  // another player's pile is VIEW ONLY
    return !!(state && !state.finished && state.turn===YOU && !state.pending && state.respondFor==null && !busy && !TUT.blocking());
  }
  function pileCards(which){
    var pl=state && state.players[pileSeat]; if(!pl) return [];
    var a=(which==='shuffle' ? pl.shuffle : pl.energy) || [];
    return a.filter(function(c){ return !c.hidden; });                // a redacted zone (shuffle/deck dummies) shows as empty, not as fake cards
  }
  function firstOfSuitIds(cards){                       // which card a colored pip of each suit would claim
    var seen={}, out={};
    cards.forEach(function(c){ if(!seen[c.suit]){ seen[c.suit]=1; out[c.id]=c.suit; } });
    return out;
  }
  function openPileView(which, seat){
    pileWhich=(which==='shuffle')?'shuffle':'energy'; pileSel=null; pileRead=null;
    pileSeat=(typeof seat==='number')?seat:YOU;
    renderPileView();
  }
  function renderPileView(){
    var isNrg=(pileWhich!=='shuffle'), cards=pileCards(pileWhich), canOrder=isNrg && pileCanReorder();
    var mine=(pileSeat===YOU), owner=mine?'':(seatName(pileSeat)+'’s ');   // declare BEFORE the hint reads it
    var firsts=isNrg?firstOfSuitIds(cards):{};
    var rows='';
    cards.forEach(function(c,i){
      var eff=E.effectOf(c), nm=eff?eff.name:'—', tags='';
      if(isNrg && i===0) tags+='<span class="pvTag next">spent next</span>';
      if(isNrg && firsts[c.id]) tags+='<span class="pvTag pip">first '+SUIT_SYMBOL[firsts[c.id]]+'</span>';
      rows+='<div class="pileRow'+(canOrder?'':' ro')+(pileSel===c.id?' sel':'')+'" data-id="'+esc(c.id)+'">'+
        '<span class="pvPos">'+(i+1)+'</span>'+
        '<span class="pvMini"></span>'+
        '<span class="pvName">'+rankLabel(c.rank)+SUIT_SYMBOL[c.suit]+(nm!=='—'?(' · '+esc(nm)):'')+'</span>'+
        '<span class="pvTags">'+tags+'</span></div>';
    });
    var hint = !mine
      ? (isNrg
          ? 'Energy piles are <b>open information</b> — the same as cards face-up on a table. This is <b>view only</b>: position <b>1</b> is what '+seatName(pileSeat)+' spends next.'
          : 'What '+seatName(pileSeat)+' has already spent. It is <b>shuffled at random</b> back into their deck when it runs dry.')
      : (isNrg
        ? (canOrder
            ? 'Position <b>1</b> is spent next. Tap a card to read it or <b>promote it to the top</b> — a promoted card becomes the next one spent, so it recycles into your ♻ pile sooner. A <b>coloured cost</b> takes the <b>first card of that suit</b> (tagged), so it can skip past a promotion.'
            : 'Position <b>1</b> is spent next. You can reorder this on <b>your own turn</b>.')
        : 'Cards you have already spent. When your 🂠 deck runs dry, this pile is <b>shuffled at random</b> back into it — the order here does not matter, only what is in it.');
    var body='<h2>'+(isNrg?('⚡ '+owner+'Energy pile'):('♻ '+owner+'Shuffle pile'))+'</h2>'+
      '<div class="pileHead">'+
        '<button type="button" class="pvNav" id="pvPrev" title="'+(isNrg?'Shuffle pile':'Energy pile')+'">←</button>'+
        '<span class="pvTitle">'+(isNrg?'Spent next, first':'Waiting to be reshuffled')+'</span>'+
        '<span class="pvCount">'+cards.length+' card'+(cards.length===1?'':'s')+'</span>'+
        '<button type="button" class="pvNav" id="pvNext" title="'+(isNrg?'Shuffle pile':'Energy pile')+'">→</button>'+
      '</div>'+
      '<p class="pileHint">'+hint+'</p>'+
      (cards.length?('<div class="pileList" id="pileList">'+rows+'</div>'):'<div class="pileEmpty">This pile is empty.</div>');
    if(pileRead){
      var rc=cards.filter(function(c){ return c.id===pileRead; })[0];
      if(rc) body+='<div class="pvRead">'+cardTextHTML(rc)+'</div>'+
        '<div class="pileCtx pvReadBack"><button id="pvBack" class="ghostBtn">← Back to the pile</button></div>';
    } else if(pileSel){
      body+='<div class="pileCtx">'+
        '<button id="pvView" class="ghostBtn">🔍 View</button>'+
        '<button id="pvPromote"'+(canOrder?'':' disabled')+'>⤒ Promote to top</button>'+
      '</div>';
    }
    body+='<button id="pvDone">Done</button>';
    showModal(body);
    // real card thumbnails (cardEl builds DOM, so paint them after the innerHTML pass)
    Array.prototype.forEach.call(document.querySelectorAll('#pileList .pileRow'), function(row){
      var id=row.getAttribute('data-id'), c=cards.filter(function(x){ return x.id===id; })[0];
      if(c){ var mini=row.querySelector('.pvMini'); if(mini) mini.replaceWith(cardEl(c,'mini')); }
      row.addEventListener('click', function(){
        if(!isNrg || !mine) return;                         // shuffle pile, and any pile but yours, are read-only
        pileSel=(pileSel===id?null:id); pileRead=null; renderPileView();
      });
    });
    var flip=function(){ pileWhich=isNrg?'shuffle':'energy'; pileSel=null; pileRead=null; renderPileView(); };
    $('pvPrev').addEventListener('click', flip);
    $('pvNext').addEventListener('click', flip);
    if($('pvView')) $('pvView').addEventListener('click', function(){ pileRead=pileSel; renderPileView(); });
    if($('pvBack')) $('pvBack').addEventListener('click', function(){ pileRead=null; renderPileView(); });
    if($('pvPromote')) $('pvPromote').addEventListener('click', function(){ promoteFromPile(pileSel); });
    $('pvDone').addEventListener('click', hideOverlay);
    overlayDismiss=hideOverlay;
  }
  // Promote the selected energy card to the front — locally, or as an intent when we are a netplay client.
  function promoteFromPile(id){
    if(!id || !pileCanReorder()) return;
    var cards=pileCards('energy'), card=cards.filter(function(c){ return c.id===id; })[0];
    if(!card) return;
    if(typeof NET!=='undefined' && NET.isClientActive && NET.isClientActive()){
    if(typeof NET!=='undefined' && NET.clientNotReady && NET.clientNotReady()){ setMessage('Connecting to the host\u2026 wait for the game to start.'); return; }
      var ids=[id]; cards.forEach(function(c){ if(c.id!==id) ids.push(c.id); });
      NET.clientSend({op:'reorderEnergy', ids:ids});
      pileSel=null; busy=true; hideOverlay(); render();
      return;
    }
    var r=E.promoteEnergy(state, YOU, id);
    if(!r.ok){ setMessage(r.reason||'Cannot reorder right now.'); return; }
    logEnergyPromote(YOU, card);
    TUT.note('energypromote', { id:id, card:card });
    pileSel=null; render(); renderPileView();
  }
  // PUBLIC log line (decision 6): the energy pile is not hidden information in paper play, and public lines
  // make usage trends trackable — they also land in fullLog, so exported games carry them.
  function logEnergyPromote(seat, card){
    logMsg('<b>'+(seat===YOU?'You':seatName(seat))+'</b> moved <b>'+rankLabel(card.rank)+SUIT_SYMBOL[card.suit]+'</b> to the front of '+(seat===YOU?'your':'their')+' energy pile.', 'nrgmove');
  }

  // ---- Custom deck builder ----------------------------------------------------------------------
  // Four steppers (one per class) that must total PARTS_TOTAL parts; a part is one complete 13-card
  // suit, so the deck is always 52 cards. Saving stores {name, parts} and hands the caller back the
  // composition key. Create + delete only — to change a deck, delete it and build it again.
  function openDeckBuilder(startParts, onDone){
    var parts={}; E.PARTS_SUITS.forEach(function(su){ parts[su]=(startParts&&startParts[su])||0; });
    var CLASS_NAME={D:'Wizard',H:'Cleric',C:'Fighter',S:'Rogue'};
    var done=false;
    function finish(key){ if(done) return; done=true; overlayDismiss=null; if(onDone) onDone(key||null); }

    function stepperHTML(su){
      return '<div class="dbRow" data-su="'+su+'">'+
        '<span class="dbCls"><b class="'+(su==='D'||su==='H'?'red':'')+'">'+PART_SUIT_SYM[su]+'</b> '+CLASS_NAME[su]+'</span>'+
        '<span class="dbStep">'+
          '<button type="button" class="dbBtn" data-d="-1" aria-label="One fewer '+CLASS_NAME[su]+' part">−</button>'+
          '<b class="dbN">0</b>'+
          '<button type="button" class="dbBtn" data-d="1" aria-label="One more '+CLASS_NAME[su]+' part">+</button>'+
        '</span>'+
        '<span class="dbCards"></span>'+
      '</div>';
    }
    function savedListHTML(){
      if(!savedDecks.length) return '';
      var h='<div class="dbSaved"><div class="dbSavedHd">Your saved decks</div>';
      savedDecks.forEach(function(d){
        var k=E.partsKey(d.parts);

  // Make the coach panel draggable so it never blocks the played cards.
  function initTutDrag(){
    var p=$('tutPanel'); if(!p || p._dragInit) return; p._dragInit=true;
    var on=false, sx=0, sy=0, ox=0, oy=0;
    p.addEventListener('pointerdown', function(e){
      if(e.target.closest && e.target.closest('button')) return;      // let Skip/Next clicks through
      var r=p.getBoundingClientRect();
      on=true; sx=e.clientX; sy=e.clientY; ox=r.left; oy=r.top;
      // Pin by top/left only — clear the CSS bottom/right so the box keeps its height instead of stretching top→bottom.
      p.classList.remove('atStage');   // a manual drag takes over from any staged auto-position
      p.style.transform='none'; p.style.left=r.left+'px'; p.style.top=r.top+'px'; p.style.bottom='auto'; p.style.right='auto';
      p.classList.add('dragging'); try{ p.setPointerCapture(e.pointerId); }catch(_){}
    });
    p.addEventListener('pointermove', function(e){
      if(!on) return;
      var nx=ox+(e.clientX-sx), ny=oy+(e.clientY-sy);
      nx=Math.max(6, Math.min(nx, window.innerWidth - p.offsetWidth - 6));
      ny=Math.max(6, Math.min(ny, window.innerHeight - p.offsetHeight - 6));
      p.style.left=nx+'px'; p.style.top=ny+'px';
    });
    function up(){ on=false; p.classList.remove('dragging'); }
    p.addEventListener('pointerup', up); p.addEventListener('pointercancel', up);
  }

  function rollDiceMP(){
    var reduce=reduceMotion(), els=[]; for(var i=0;i<mpCount;i++) els.push($('mpDie'+i));
    function oneRound(done){
      var rolls=[]; for(var j=0;j<mpCount;j++) rolls.push(1+Math.floor(Math.random()*6));
      if(reduce){ els.forEach(function(el,i){ if(el) el.textContent=DICE[rolls[i]-1]; }); return done(rolls); }

          setTimeout(function(){ els.forEach(function(el){ if(el) el.classList.remove('land'); }); }, 450);
          done(rolls);

      if(reduce){ yEl.textContent=DICE[fy-1]; rEl.textContent=DICE[fr-1]; done(fy,fr); return; }

      var t=0, iv=setInterval(function(){

    }

  /* ================= NETPLAY (human vs human, host-authoritative) =================
   * Symmetric snapshot + intent model. The HOST owns the engine and applies EVERY seat's intents through it;
   * both ends render from their own redacted NetView.snapshotFor and submit high-level intents. Transport is
   * BroadcastChannel (same-machine two tabs today; the same schema rides a LAN/WebRTC socket in Phase 5).
   * Entirely additive and gated behind ?net= — with no flag none of this runs and the shipped game is untouched.
   * v1 scope: 2 players; pre-fight Quick timing is deferred (Quicks still work as responses to activated effects). */
  var NET = (function(){
    var transport=null, role=null, kind='bc', room=null, mySeat=0, hostState=null, deckPick='full', connected=false, lastErr='';
    var myDeck='random', oppDeck=null, oppReady=false, iReady=false;   // lobby deck-picker state (each side chooses before the host starts)
    var myId='c'+(''+Math.random()).slice(2,10)+(''+Math.random()).slice(2,6);   // this client's stable id (so the host can tell a new joiner from a 350ms retry on the shared bus)
    var hostSeatOf={}, seatDeckMap={}, nextSeat=1, MAX_SEATS=6;                   // host: cid→seat, seat→deck, next free seat
    var useStun=true, sig=null, pc=null, dc=null;   // WebRTC signaling state
    function active(){ return !!role; }
    /* Only clear a query that actually EXISTS: on Android a downloaded file opens as `content://`, which cannot
     * carry a query string, so assigning location.search there navigates to an unresolvable URI and the game
     * vanishes into ERR_FILE_NOT_FOUND (v1.31.15). Reload instead. */
    function leaveOnline(){
      try{ relayDropRoom(); }catch(e){}
      try{ if(transport) transport.close(); }catch(e){}
      if(/[?&]net=/.test(location.search)) location.search=''; else location.reload();
    }
    function isHost(){ return role==='host'; }
    function seatLabel(i){ return i===mySeat ? 'You' : ('Player '+(i+1)); }

    // ---- transports (pluggable): both expose { send(obj), setOnMessage(cb), close() } ----
    function bcTransport(ch){ var cb=null; ch.onmessage=function(e){ if(cb) cb(e.data); }; return { send:function(o){ try{ ch.postMessage(o); }catch(e){} }, setOnMessage:function(c){ cb=c; }, close:function(){ try{ ch.close(); }catch(e){} } }; }
    function rtcTransport(pconn, chan){ var cb=null; chan.onmessage=function(e){ var m; try{ m=JSON.parse(e.data); }catch(_){ return; } if(cb) cb(m); }; return { send:function(o){ try{ chan.send(JSON.stringify(o)); }catch(e){} }, setOnMessage:function(c){ cb=c; }, close:function(){ try{ chan.close(); }catch(e){} try{ pconn.close(); }catch(e){} } }; }

    /* `?net=` still works (links, and every nettest_* suite uses it), but netplay must ALSO be enterable with
     * NO navigation. On Android a downloaded HTML file opens as `content://…`, and that scheme cannot carry a
     * query string — so the old `location.search='?net=rtchost'` navigated to a URI the provider cannot

    function boot(){

      if(!map[m]) return false;

      /* Emote bar. Lives in #actions — NOT on <body> and NOT inside #netroot, which renderNet rewrites. It was

       * created ONLY in netplay — there is nobody to talk to in a solo game. Collapsed to a single 💬 tap on a
       * phone, where a 7-button row would eat the board. */
      var eb=document.createElement('div'); eb.id='emoteBar';
      eb.innerHTML='<button id="emoteToggle" title="Emotes">💬</button><div id="emoteList">'+

    /* ---------- THE RELAY (v1.31.49) — a four-character room code instead of a round trip ----------

    /* JOINER: claim a slot, answer it, hand the answer back. One exchange, and the player typed four characters. */

     * false exactly when the end-of-round trim matches the draw — `discardToLimit` runs BEFORE `roundDraw`, so
     * a client that passed while holding 12 trims to 10 and draws back to 12: equal, never greater. A player is

    function isRoundDeal(st){

       * deal is the only card arrival that happens with an empty pile. */
      if(st.pile) return false;

    var qrShowing={};                                    // canvasId -> the text it is currently displaying

       * sized by its child, and an un-rendered canvas defaults to 300px wide — so "first ancestor with a real
       * width" finds the canvas's own placeholder size and every screen renders the same 234px symbol. */

       * pushing the code box and the Copy button off the screen. Aj: "just barely fits on the screen".
       * So on a short viewport only, stop growing once each module is comfortably readable and give the rest
       * of the height back to the controls. Desktop and portrait are untouched: there the height is not
       * scarce, and a bigger symbol is the one that reads across a table.
       * The cap is per MODULE, not a fraction of the screen, because "big enough to scan" is a property of the
       * module and a fraction silently means something different at every payload size. Quiet zone included,
       * matching how qrtest measures — 4 modules each side. */
      if (window.innerHeight <= 480 && typeof CardmenQR.build === 'function') {

      }
